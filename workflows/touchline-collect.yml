name: touchline-collect
description: |
  Use when: someone asks for a soccer schedule, roster, player statistics, or match box scores — for a whole conference or a single programme, current season or archive.
  Triggers: "get the 2026 schedule", "pull down the 2026 roster", "collect GAC men 2026", "retrieve Harding 2019 stats", "get the box scores".
  Does: refuses any directory that is not a Touchline data home, fetches official season schedule, roster, statistics and box-score pages, then writes the board files and names exact gaps.
  NOT for: repairing data (use data-integrity), or judging code.

# Deliberately NOT `requiresProject: true`: in Keelson that flag means the
# working directory must be a Git repository. A Touchline home is an ordinary
# registered directory. The selected project still supplies cwd/projectId, and
# the exclusive mutation lock below still serialises writes to that directory.
requiresProject: false
# Two collects into one data home would race on the same season file.
mutates_checkout: true
tags: [soccer, collection, touchline]

inputs:
  - name: conference
    description: Conference the targets belong to, e.g. GAC. Used for labelling.
    required: true
  - name: gender
    description: men or women.
    required: true
  - name: season
    description: Season year, e.g. 2026 for the current season or 2019 for an archive roster.
    required: true
  - name: programmes
    description: >-
      Comma-separated membership slugs to collect. Optional: when empty, the
      resolve-programmes node reads the conference's members for the season
      from the rib's packaged membership record, the same resolver the
      touchline_collect tool uses, so the tool and the workflow share one
      input contract. Pass it only to narrow the run to named programmes.
    required: false
  - name: layers
    description: >-
      Comma-separated layers to collect: schedule, roster, stats, matches.
      Defaults to all four. Every layer is served per (site, season) back to
      2016; a cell that refuses comes back as a named gap, never a run
      failure. The matches layer fetches one box score per played fixture,
      so it is the slowest — a full conference season is a couple of minutes.
    required: false
  - name: membership_extrapolated
    description: true when conference membership was carried beyond its last authored season.
    required: false

# ─────────────────────────────────────────────────────────────────────────────
# Runs with cwd = the consumer's Touchline data directory. Git is not required.
#
# A bash body is NOT template-substituted — that split is the engine's security
# boundary. Inputs arrive as KEELSON_INPUTS_<key> and an upstream node's output
# as KEELSON_NODE_<id>_OUTPUT (hyphens become underscores). Only prompt bodies
# take $inputs.<key> / $<id>.output.
#
# The pipeline lives in the installed rib; resolve it the way data-integrity.yml
# does — env override, then the rib's config, then the installed package path —
# and ALARM rather than guess.
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  - id: preflight
    timeout: 60000
    bash: |
      set -uo pipefail
      if [ ! -f touchline-data.yaml ]; then
        printf 'REFUSED: %s is not a Touchline data home (no touchline-data.yaml marker).\n' "$PWD"
        printf 'A collection only ever writes into a folder Touchline initialised, or one it already owns.\n'
        exit 1
      fi
      KIND=$(sed -n 's/^[[:space:]]*kind:[[:space:]]*\(.*\)$/\1/p' touchline-data.yaml | head -1)
      if [ "$KIND" != "touchline-data" ]; then
        printf 'REFUSED: touchline-data.yaml exists but declares kind=%s, not touchline-data.\n' "${KIND:-(none)}"
        exit 1
      fi
      for v in KEELSON_INPUTS_conference KEELSON_INPUTS_gender KEELSON_INPUTS_season; do
        eval "val=\${$v:-}"
        if [ -z "$val" ]; then
          printf 'REFUSED: required input %s is empty. Nothing was collected.\n' "$v"
          exit 1
        fi
      done
      case "$KEELSON_INPUTS_season" in
        [0-9][0-9][0-9][0-9]) ;;
        *)
          printf 'REFUSED: season %s is not a four-digit year.\n' "$KEELSON_INPUTS_season"
          exit 1
          ;;
      esac
      printf 'data home OK: %s\n' "$PWD"
      printf 'layers: %s\n' "${KEELSON_INPUTS_layers:-schedule,roster,stats,matches}"
      printf 'target: %s %s %s -> %s\n' \
        "$KEELSON_INPUTS_conference" "$KEELSON_INPUTS_gender" \
        "$KEELSON_INPUTS_season" "${KEELSON_INPUTS_programmes:-(resolved from membership)}"

  - id: resolve-pipeline
    depends_on: [preflight]
    timeout: 60000
    bash: |
      set -uo pipefail
      KEELSON_HOME_DIR="${KEELSON_HOME:-$HOME/.keelson}"
      CFG="$KEELSON_HOME_DIR/rib-touchline/config.json"
      PIPELINE_DIR="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PIPELINE_DIR" ] && [ -f "$CFG" ]; then
        PKG=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null)
        [ -n "$PKG" ] && PIPELINE_DIR="$PKG/pipeline"
      fi
      if [ -z "$PIPELINE_DIR" ]; then
        PIPELINE_DIR="$KEELSON_HOME_DIR/node_modules/@keelson/rib-touchline/pipeline"
      fi
      if [ ! -f "$PIPELINE_DIR/pyproject.toml" ]; then
        printf 'ALARM: cannot resolve the Touchline pipeline. Tried TOUCHLINE_PIPELINE_DIR, %s, and the installed package path. Last candidate: %s\n' "$CFG" "$PIPELINE_DIR"
        exit 1
      fi
      printf '%s\n' "$PIPELINE_DIR"

  # A data home collects ONE NCAA level (touchline-data.yaml `level`; a
  # marker with none is a Division II home, and this node says so). A
  # conference at any other level is refused here, naming both levels,
  # before anything is resolved or fetched: the guard that keeps Division I
  # data out of a Division II home after a slip of the project picker. The
  # rule lives in the rib (bin/resolve-membership.ts guard, src/datahome.ts);
  # collect-board enforces the same one again before its first fetch.
  - id: level-guard
    depends_on: [resolve-pipeline]
    timeout: 60000
    bash: |
      set -uo pipefail
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      RESOLVER="$(dirname "$PIPELINE_DIR")/bin/resolve-membership.ts"
      if [ ! -f "$RESOLVER" ]; then
        printf 'ALARM: membership resolver not found at %s (the rib package beside the pipeline should carry bin/resolve-membership.ts)\n' "$RESOLVER"
        exit 1
      fi
      bun "$RESOLVER" guard "$PWD" "$KEELSON_INPUTS_conference"

  # Membership is DATA, not code. With no programmes input the member list
  # comes from the packaged data/reference/membership.json through the rib's
  # bin/resolve-membership.ts, the same resolveConference the touchline_collect
  # tool calls; a season past the authored windows is carried forward and
  # flagged. The node prints one line, "<extrapolated> <slug,slug,...>", and
  # passes a caller-supplied list through untouched so the collect node has one
  # shape to read. Nothing here names a conference or a member.
  - id: resolve-programmes
    depends_on: [level-guard]
    timeout: 60000
    bash: |
      set -uo pipefail
      if [ -n "${KEELSON_INPUTS_programmes:-}" ]; then
        printf 'programmes supplied by the caller.\n' >&2
        printf '%s %s\n' "${KEELSON_INPUTS_membership_extrapolated:-false}" "$KEELSON_INPUTS_programmes"
        exit 0
      fi
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      RESOLVER="$(dirname "$PIPELINE_DIR")/bin/resolve-membership.ts"
      if [ ! -f "$RESOLVER" ]; then
        printf 'ALARM: membership resolver not found at %s (the rib package beside the pipeline should carry bin/resolve-membership.ts)\n' "$RESOLVER"
        exit 1
      fi
      RES=$(bun "$RESOLVER" conference "$KEELSON_INPUTS_conference" "$KEELSON_INPUTS_gender" "$KEELSON_INPUTS_season" 2>&1)
      RC=$?
      if [ "$RC" -ne 0 ] || [ -z "$RES" ]; then
        printf 'REFUSED: no programmes resolve for %s %s %s: %s\n' \
          "$KEELSON_INPUTS_conference" "$KEELSON_INPUTS_gender" "$KEELSON_INPUTS_season" "${RES:-no output}"
        exit 1
      fi
      printf '%s\n' "$RES"

  - id: collect
    depends_on: [resolve-programmes]
    timeout: 900000
    bash: |
      set -uo pipefail
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      if [ ! -f "$PIPELINE_DIR/pyproject.toml" ]; then
        printf 'ALARM: pipeline not found at %s (resolve-pipeline output did not carry a usable path)\n' "${PIPELINE_DIR:-<empty>}"
        exit 1
      fi
      RESOLVED=$(printf '%s' "${KEELSON_NODE_resolve_programmes_OUTPUT:-}" | tr -d '\r' | tail -1)
      EXTRAPOLATED=${RESOLVED%% *}
      PROGRAMMES=${RESOLVED#* }
      if [ -z "$PROGRAMMES" ] || [ "$PROGRAMMES" = "$RESOLVED" ]; then
        printf 'ALARM: resolve-programmes output did not carry a programme list (%s). Nothing was collected.\n' "${RESOLVED:-<empty>}"
        exit 1
      fi
      printf 'programmes: %s\n' "$PROGRAMMES"

      # NOT a bash array: macOS ships bash 3.2 as /bin/bash, where expanding an
      # EMPTY array under `set -u` raises "unbound variable" — which would fire
      # on the common path, where no extra flag is set.
      EXTRA=""
      if [ "$EXTRAPOLATED" = "true" ]; then
        EXTRA="--membership-extrapolated"
        printf 'NOTE: membership carried forward past its last authored season (extrapolated).\n'
      fi

      # shellcheck disable=SC2086 # EXTRA is a single controlled flag or empty.
      TOUCHLINE_DATA_DIR="$PWD" uv run --project "$PIPELINE_DIR" collect-board \
        --conference "$KEELSON_INPUTS_conference" \
        --gender "$KEELSON_INPUTS_gender" \
        --season "$KEELSON_INPUTS_season" \
        --programmes "$PROGRAMMES" \
        --layers "${KEELSON_INPUTS_layers:-schedule,roster,stats,matches}" \
        $EXTRA
      RC=$?
      # Exit 0 means the coverage manifest was written and describes reality,
      # gaps included. A non-zero exit means no manifest — nothing above is then
      # a claim that data landed.
      if [ "$RC" -ne 0 ]; then
        printf '\nCollection exited %s — no coverage manifest was written, so nothing above is a claim that data landed.\n' "$RC"
        exit "$RC"
      fi

  - id: report
    depends_on: [collect]
    timeout: 120000
    prompt: |
      A Touchline collection run just finished.

      Preflight reported:
      $preflight.output

      The level guard reported:
      $level-guard.output

      The programme list resolved to:
      $resolve-programmes.output

      The collection command printed:
      $collect.output

      Write a SHORT completion summary, in plain prose, for the person who asked for this data:
      - what was collected (conference, gender, season, how many programmes and fixtures)
      - anything the run explicitly reported as missing, collapsed as duplicates, or
        DERIVED rather than published — name it, never soften it
      - distinguish played from upcoming exactly as the collector reports them
      - say that schedule, roster, statistics and box-score data came from official programme season pages

      Do not invent numbers. Every figure must appear in the text above; if a figure is
      not there, say it was not reported.
