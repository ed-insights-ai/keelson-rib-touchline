name: touchline-report
description: |
  Use when: someone wants the preseason scouting briefing for a collected season — opponent analysis, roster turnover, availability leads, verified offseason research, rendered as the print-first report.
  Triggers: "build the preseason report", "generate the scouting briefing", "preseason intelligence for Harding".
  Does: computes the deterministic digest, fans research out one programme at a time (summer leagues, honors, coaching changes — verified at sources), writes the narrative under the style contract, renders the briefing, and reports what was verified, dropped, and unswept.
  NOT for: collecting season data (run touchline-collect first), or repairing data (data-integrity).

# A Touchline home is an ordinary registered directory, not a git repo.
requiresProject: false
# Writes research into data/research/ (durable, tracked in the data home),
# the digest into data/scratch/ (regenerable, ignored), and the delivered
# analysis — narrative + report/appendix PDFs — into data/reports/.
mutates_checkout: true
# The research stage lives on the open web.
webSearchMode: live
# Loop iterations take the WORKFLOW-level model and effort, so the research
# loop's tier lives here: terra balances the fetch-heavy research work.
# NOTE: model *classes* (deep/balanced/fast) all map to `auto` on this
# provider, which silently resolves to the smallest tier — pin literal ids.
model: gpt-5.6-terra
modelReasoningEffort: medium
tags: [soccer, touchline, report, scouting]

inputs:
  - name: season
    description: Season year the report is for, e.g. 2026.
    required: true
  - name: gender
    description: men or women.
    required: true
  - name: conference
    description: Conference name or shard slug, e.g. GAC.
    required: true
  - name: focus
    description: Programme slug the report is prepared for, e.g. harding.
    required: true

# ─────────────────────────────────────────────────────────────────────────────
# The evidence chain, in order:
#   digest (deterministic numbers) → research loop (one programme per
#   iteration) → verification loop + deterministic merge → narrative core +
#   opponent-card loop + deterministic assembly → render → summary.
#
# Keelson has no runtime-sized fan-out. Conference-scale stages use bounded
# loops followed by deterministic merges. max_iterations and timeout are
# load-time safety caps, not workload targets: early exit keeps small
# conferences cheap, and larger supported conferences require raising the
# constants rather than expecting them to scale from the digest count.
#
# A bash body is NOT template-substituted — inputs arrive as
# KEELSON_INPUTS_<key>, upstream output as KEELSON_NODE_<id>_OUTPUT.
# Prompt bodies take $inputs.<key> / $<id>.output.
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  - id: preflight
    timeout: 60000
    bash: |
      set -uo pipefail
      if [ ! -f touchline-data.yaml ]; then
        printf 'REFUSED: %s is not a Touchline data home (no touchline-data.yaml marker).\n' "$PWD"
        exit 1
      fi
      KIND=$(sed -n 's/^[[:space:]]*kind:[[:space:]]*\(.*\)$/\1/p' touchline-data.yaml | head -1)
      if [ "$KIND" != "touchline-data" ]; then
        printf 'REFUSED: touchline-data.yaml declares kind=%s, not touchline-data.\n' "${KIND:-(none)}"
        exit 1
      fi
      printf 'data home: %s\n' "$PWD"
      for v in KEELSON_INPUTS_season KEELSON_INPUTS_gender KEELSON_INPUTS_conference KEELSON_INPUTS_focus; do
        eval "val=\${$v:-}"
        if [ -z "$val" ]; then
          printf 'REFUSED: required input %s is empty.\n' "$v"
          exit 1
        fi
      done
      case "$KEELSON_INPUTS_season" in
        [0-9][0-9][0-9][0-9]) ;;
        *) printf 'REFUSED: season %s is not a four-digit year.\n' "$KEELSON_INPUTS_season"; exit 1 ;;
      esac
      case "$KEELSON_INPUTS_gender" in
        men|women) ;;
        *) printf 'REFUSED: gender must be men or women, not %s.\n' "$KEELSON_INPUTS_gender"; exit 1 ;;
      esac
      CONF=$(printf '%s' "$KEELSON_INPUTS_conference" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9][^a-z0-9]*/-/g; s/^-//; s/-$//')
      if [ ! -f "data/fixtures/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${CONF}.json" ]; then
        printf 'REFUSED: no collected fixtures for %s %s %s in this home — run touchline-collect first.\n' \
          "$KEELSON_INPUTS_season" "$KEELSON_INPUTS_gender" "$KEELSON_INPUTS_conference"
        exit 1
      fi
      printf 'data home OK: %s\n' "$PWD"
      printf 'report target: %s %s %s, prepared for %s\n' \
        "$KEELSON_INPUTS_season" "$KEELSON_INPUTS_gender" "$KEELSON_INPUTS_conference" "$KEELSON_INPUTS_focus"

  - id: conference-shard
    depends_on: [preflight]
    timeout: 60000
    bash: |
      set -euo pipefail
      CONF=$(printf '%s' "$KEELSON_INPUTS_conference" \
        | tr '[:upper:]' '[:lower:]' \
        | sed 's/[^a-z0-9][^a-z0-9]*/-/g; s/^-//; s/-$//')
      printf '%s' "$CONF"

  - id: resolve-pipeline
    depends_on: [preflight]
    timeout: 60000
    bash: |
      set -uo pipefail
      KEELSON_HOME_DIR="${KEELSON_HOME:-$HOME/.keelson}"
      CFG="$KEELSON_HOME_DIR/rib-touchline/config.json"
      PIPELINE_DIR="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PIPELINE_DIR" ] && [ -f "$CFG" ]; then
        PKG=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null)
        [ -n "$PKG" ] && PIPELINE_DIR="$PKG/pipeline"
      fi
      if [ -z "$PIPELINE_DIR" ]; then
        PIPELINE_DIR="$KEELSON_HOME_DIR/node_modules/@keelson/rib-touchline/pipeline"
      fi
      if [ ! -f "$PIPELINE_DIR/pyproject.toml" ]; then
        printf 'ALARM: cannot resolve the Touchline pipeline. Last candidate: %s\n' "$PIPELINE_DIR"
        exit 1
      fi
      printf '%s\n' "$PIPELINE_DIR"

  - id: digest
    depends_on: [resolve-pipeline]
    timeout: 300000
    bash: |
      set -uo pipefail
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      TOUCHLINE_DATA_DIR="$PWD" uv run --project "$PIPELINE_DIR" build-digest \
        --season "$KEELSON_INPUTS_season" \
        --gender "$KEELSON_INPUTS_gender" \
        --conference "$KEELSON_INPUTS_conference" \
        --focus "$KEELSON_INPUTS_focus"

  - id: programme-count
    depends_on: [digest]
    timeout: 60000
    bash: |
      set -uo pipefail
      DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      N=$(jq -e '.programmes | length' "$DG" 2>/dev/null) || {
        printf 'ALARM: digest %s is missing or unparseable — cannot size the research sweep.\n' "$DG"
        exit 1
      }
      if [ "$N" -lt 1 ]; then
        printf 'ALARM: digest lists 0 programmes.\n'
        exit 1
      fi
      printf '%s\n' "$N"

  - id: research
    depends_on: [digest, conference-shard, programme-count]
    loop:
      # Keelson cannot derive scalar loop limits at runtime; early exit makes this a safety cap.
      max_iterations: 24
      fresh_context: true
      until: ALL RESEARCHED
      until_bash: |
        set -u
        D="data/research/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}"
        DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
        SLUGS=$(jq -er '.programmes | keys[]' "$DG") || exit $?
        for slug in $SLUGS; do
          F="$D/research-$slug.json"
          [ -f "$F" ] || exit 1
          jq -e '(.coach.name // "") != ""' "$F" >/dev/null 2>&1 || exit 1
        done
      prompt: |
        You are one iteration of the Touchline offseason research stage for the
        $inputs.season $inputs.gender season, prepared for '$inputs.focus'. Each
        iteration researches EXACTLY ONE programme, then stops.

        MANDATORY FIRST CHECK, every programme, no exceptions: who is the
        head coach for the $inputs.season season, did that change since
        last season, and how long have they held the job? Fetch the
        programme's staff directory or the coach's bio (bios usually state
        "entering his Nth season" — that dates tenure) and record the
        answer as the file's top-level "coach" object either way. A
        verified coaching change is among the most important facts a
        scouting report can carry (it voids the opponent's film library),
        and a confirmed long-tenured coach matters just as much the other
        way: established patterns make the held record more predictive.
        since_season only when a fetched page states it; a coach you
        cannot verify is status "unknown" with the surface recorded in
        unswept. A research file without a coach object is incomplete.

        ONE FINDING, ONE PAGE: never write a finding whose truth needs two
        pages to check — the verifier fetches each finding's single url and
        drops any claim that page alone cannot support. Split compound
        claims: a coaching change becomes one finding per page (the current
        directory names the new coach; the bio states the appointment date;
        the prior year's directory names the predecessor), each carrying its
        own url. When a single page states the whole fact (a bio saying
        "named head coach in January $inputs.season"), prefer that page.

        1. Read data/scratch/digest-$inputs.season-$inputs.gender-$inputs.focus.json — the
           programme list, and each programme's availability_flags and
           usage_shifts (your special-interest players).
        2. List data/research/$inputs.season-$inputs.gender/ — pick the
           FIRST programme (the focus programme first, then alphabetical)
           with no research-<slug>.json yet, or whose file lacks a
           top-level "coach" object. For a coach-only top-up, do ONLY the
           mandatory coach check and any change findings it produces, add
           the coach object, and leave the existing findings untouched.
           Replying ALL RESEARCHED ends the whole research stage
           immediately, so it must be MECHANICALLY CHECKED first, never
           eyeballed: run
             jq -r 'select((.coach // null) == null) | input_filename' \
               data/research/<season>-<gender>/research-*.json
           and reply ALL RESEARCHED only when that prints nothing AND
           every digest programme has a file. Any filename it prints is
           your target this iteration. A validation gate after this
           stage fails the run if a file is missing its coach object.
        3. Read that programme's roster from
           data/rosters/$inputs.season-$inputs.gender-$conference-shard.output.json (names, hometowns).
           If the roster is missing, write a file recording exactly that as the
           only finding and finish.
        3b. Check data/players/$inputs.gender/<slug>/ for existing player
           profiles. Their findings are ALREADY VERIFIED — copy relevant ones
           into this programme's findings as-is (same text, source, url,
           date), and let their unswept notes save you repeat work. Probed
           players still get a fresh focus-year check for anything newer.
        4. Research the roster with THIS recipe, in order. First read
           <pipeline-parent>/prompts/research-protocol.md — its identity
           binding, stopping rules, source precedence, and dating rules
           govern every step below:
           a. CLUB-FIRST: from the hometowns, list plausible summer clubs
              in the gender-correct competitions ($inputs.gender: men —
              USL League Two, NPSL, UPSL; women — USL W League, WPSL,
              UPSL) near campus and near player-cluster geographies;
              fetch each club's roster or squad page; cross-reference
              names.
           b. BARE-NAME: for each distinctive name, search the plain name
              alone — league award and social posts surface there when
              structured queries miss. Every hit passes identity binding
              before it becomes a finding.
           c. HONORS FOLLOW-UP: any membership hit triggers an immediate
              player+league honors search (all-conference, Team of the
              Season, Best XI, weekly awards).
           d. SPECIAL INTEREST: for every player in this programme's
              availability_flags or usage_shifts, search their bare name plus
              hometown — summer activity for a player with a participation
              hole is the highest-value finding.
           e. Also check for programme-level news: head-coach changes,
              preseason polls, signing-class announcements.
        5. EVIDENCE RULES — absolute: a finding exists only if you can verify
           it at a URL you fetched or that appears unambiguously in search
           results, AND identity plausibly matches (hometown, school, age).
           Never stretch a name match. Confidence: league/club official pages
           and local news are high; club social capturable at a stable URL is
           medium; player self-posts (soccer-relevant only) are medium. A
           claim you believe but cannot capture at a URL goes in
           attested_uncaptured, NOT in findings. "Nothing found" per player
           is a normal result.
        6. Write the file INSIDE THE DATA HOME (the absolute directory on
           the 'data home:' line of: $preflight.output) — reading contracts
           takes you into the pipeline package, but output written relative
           to anywhere else is silently lost — at
           data/research/$inputs.season-$inputs.gender/research-<slug>.json:
           {
             "schema": "touchline.research/1",
             "programme": "<slug>",
             "coach": { "name": str, "status": "new"|"returning"|"unknown",
               "since_season": int|null, "text": str, "source": str,
               "url": str, "date": str, "confidence": "high"|"medium" },
             "findings": [ { "player": str|null, "type":
               "summer-league"|"honor"|"news"|"coach"|"signing",
               "text": str, "source": str, "url": str, "date": str,
               "confidence": "high"|"medium" } ],
             "attested_uncaptured": [ str ],
             "unswept": [ "club or league whose roster could not be read, with reason" ],
             "clubs_checked": [ str ]
           }
           The coach object is the standing answer (who, how long); a
           coaching CHANGE additionally produces split findings per the
           one-page rule so the verifier can check each page.
        7. Reply with one line: the programme slug, findings count, and
           unswept count. Do NOT reply ALL RESEARCHED unless step 2 found no
           remaining programme.

  - id: validate-research
    depends_on: [research]
    # The research loop's text exit ("ALL RESEARCHED") can fire on a
    # model's say-so; this gate makes an incomplete coach layer fail the
    # run instead of shipping silently.
    timeout: 60000
    bash: |
      set -uo pipefail
      D="data/research/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}"
      DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      N=$(jq -e '.programmes | length' "$DG")
      if [ -z "${N:-}" ] || [ "$N" -lt 1 ]; then
        printf 'ALARM: digest unreadable in validate-research.\n'
        exit 1
      fi
      MISSING=""
      for slug in $(jq -r '.programmes | keys[]' "$DG"); do
        F="$D/research-$slug.json"
        if [ ! -f "$F" ]; then
          MISSING="$MISSING $slug(no-file)"
        elif ! jq -e '(.coach.name // "") != "" and ((.coach.status // "") | IN("new","returning","unknown"))' "$F" >/dev/null 2>&1; then
          MISSING="$MISSING $slug(no-coach)"
        fi
      done
      if [ -n "$MISSING" ]; then
        printf 'ALARM: research stage ended incomplete — every programme needs a research file with a coach object (name + status new/returning/unknown). Missing:%s\n' "$MISSING"
        exit 1
      fi
      printf 'research OK: %s programmes, every file carries a coach object\n' "$N"

  - id: verify
    depends_on: [validate-research]
    # Loop nodes inherit the workflow model; Keelson drops per-loop model overrides.
    timeout: 900000
    loop:
      # Fixed safety cap: scalar loop limits cannot read the runtime programme count.
      max_iterations: 24
      fresh_context: true
      until: ALL VERIFIED
      until_bash: |
        set -u
        D="data/research/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}"
        DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
        SLUGS=$(jq -er '.programmes | keys[]' "$DG") || exit $?
        for slug in $SLUGS; do
          F="$D/verified-$slug.json"
          [ -f "$F" ] && [ "$F" -nt "$DG" ] || exit 1
        done
      prompt: |
        You are one iteration of the Touchline verification stage for the
        $inputs.season $inputs.gender season. Verify EXACTLY ONE programme,
        write its result, then stop.

        1. Read data/scratch/digest-$inputs.season-$inputs.gender-$inputs.focus.json.
           Pick the FIRST programme whose
           data/research/$inputs.season-$inputs.gender/verified-<slug>.json is
           missing or is not newer than the digest. The digest is rebuilt for
           every report run, so this timestamp check prevents stale verification
           from being reused.
        2. Read only that programme's
           data/research/$inputs.season-$inputs.gender/research-<slug>.json.
        3. For EACH finding, re-fetch its URL and check that the page supports
           the claim as written: the name appears, the honor is named, and the
           date is plausible. You are trying to REFUTE each claim. Keep only
           what survives. A finding whose page cannot be fetched or does not
           support the text is dropped — recorded, never softened.
        4. Re-fetch the top-level coach object's URL and confirm that the page
           names the coach, and states the tenure when since_season is set. If
           the page does not support it, downgrade status to "unknown", set
           since_season to null, and record the failure in dropped. The coach
           STAYS in the coaches map either way.
        5. Write — under the data home named on the 'data home:' line of
           $preflight.output, never relative to another directory —
           data/research/$inputs.season-$inputs.gender/verified-<slug>.json:
           {
             "schema": "touchline.research-verified/1",
             "findings": [ ...this programme's surviving findings, unchanged... ],
             "coaches": { "<slug>": ...this programme's coach object... },
             "dropped": [ { "programme": str, "text": str, "reason": str } ],
             "attested_uncaptured": [ ...from this research file... ],
             "unswept": [ ...from this research file, deduplicated... ]
           }
           Include ALL six keys and exactly one coaches entry.
        6. Reply with one line: programme slug, surviving count, dropped count,
           attested count, and unswept count. Reply ALL VERIFIED only after a
           mechanical check finds no missing or stale per-programme file.

  - id: merge-verified
    depends_on: [verify]
    timeout: 60000
    bash: |
      set -euo pipefail
      D="data/research/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}"
      DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      OUT="$D/verified.json"
      TMP="$OUT.tmp"
      trap 'rm -f "$TMP"' EXIT
      FILES=()
      SLUGS=$(jq -er '.programmes | keys[]' "$DG")
      for slug in $SLUGS; do
        F="$D/verified-$slug.json"
        if [ ! -f "$F" ] || [ ! "$F" -nt "$DG" ]; then
          printf 'ALARM: missing or stale per-programme verification %s.\n' "$F"
          exit 1
        fi
        if ! jq -e --arg slug "$slug" '
          .schema == "touchline.research-verified/1"
          and ((.findings | type) == "array")
          and ((.coaches | type) == "object")
          and (.coaches | has($slug))
          and ((.coaches | length) == 1)
          and ((.dropped | type) == "array")
          and ((.attested_uncaptured | type) == "array")
          and ((.unswept | type) == "array")
        ' "$F" >/dev/null; then
          printf 'ALARM: invalid per-programme verification %s.\n' "$F"
          exit 1
        fi
        FILES+=("$F")
      done
      jq -s '{
        schema: "touchline.research-verified/1",
        findings: [.[] | .findings[]?],
        coaches: (map(.coaches) | add // {}),
        dropped: [.[] | .dropped[]?],
        attested_uncaptured: [.[] | .attested_uncaptured[]?],
        unswept: ([.[] | .unswept[]?] | unique)
      }' "${FILES[@]}" > "$TMP"
      mv -f "$TMP" "$OUT"
      trap - EXIT
      jq -r '"verified merge: \(.coaches | length) coaches, \(.findings | length) findings, \(.dropped | length) dropped, \(.attested_uncaptured | length) attested, \(.unswept | length) unswept"' "$OUT"

  - id: validate-verified
    depends_on: [merge-verified]
    timeout: 60000
    bash: |
      set -uo pipefail
      D="data/research/${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}"
      V="$D/verified.json"
      if [ ! -f "$V" ]; then
        printf 'ALARM: verify reported success but %s does not exist.\n' "$V"
        exit 1
      fi
      for key in findings coaches dropped attested_uncaptured unswept; do
        if ! jq -e --arg k "$key" 'has($k)' "$V" >/dev/null; then
          printf 'ALARM: verified.json missing required key "%s".\n' "$key"
          exit 1
        fi
      done
      DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      WANT=0
      for slug in $(jq -r '.programmes | keys[]' "$DG" 2>/dev/null); do
        F="$D/research-$slug.json"
        [ -f "$F" ] && jq -e '(.coach // null) != null' "$F" >/dev/null 2>&1 && WANT=$((WANT+1))
      done
      HAVE=$(jq '.coaches | length' "$V")
      if [ "$HAVE" -lt "$WANT" ]; then
        printf 'ALARM: verified.json coaches map holds %s entries but %s research files carry coach objects — verify carries every one (downgraded to "unknown" when unsupported, never dropped from the map).\n' "$HAVE" "$WANT"
        exit 1
      fi
      printf 'verified OK: %s coach entries carried\n' "$HAVE"

  - id: normalize
    depends_on: [validate-verified]
    # Agents write research JSON free-hand, so formatting drifts per run;
    # this rewrites every file into the canonical line-per-fact shape.
    timeout: 60000
    bash: |
      set -uo pipefail
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      TOUCHLINE_DATA_DIR="$PWD" uv run --project "$PIPELINE_DIR" normalize-research

  - id: narrative-core
    depends_on: [normalize]
    context: fresh
    model: gpt-5.6-sol
    effort: xhigh
    timeout: 900000
    prompt: |
      You are the core narrative writer of the Touchline report workflow.
      Write only the executive, landscape, focus, and preseason-scorecard
      material. Opponent cards and watchlist profiles are written separately.

      The pipeline directory is:
      $resolve-pipeline.output
      Its parent directory holds the report's content contracts. Read BOTH
      before writing:
        <pipeline-parent>/prompts/scouting-questionnaire.md  (what to answer)
        <pipeline-parent>/prompts/style-contract.md          (how it must read)
      Also read the touchline.report-narrative/4 contract at the top of
      <pipeline>/src/report.py.

      Your inputs, in this data home (the current directory):
        data/scratch/digest-$inputs.season-$inputs.gender-$inputs.focus.json
          — THE ONLY SOURCE OF NUMBERS. If a figure is not there, it does not
          appear in your prose.
        data/research/$inputs.season-$inputs.gender/verified.json —
          the only admissible news and offseason findings, each with source,
          URL, and date. attested_uncaptured items NEVER appear in report
          prose. If it is not discoverable, it is not in the report. An
          undated source cannot date a claim.

      Create data/scratch/report-$inputs.season-$inputs.gender-$inputs.focus/
      and write narrative-core.json there as plain JSON:
      {
        "schema": "touchline.report-narrative-core/1",
        "headline": str,
        "exec": {
          "bottom_line": str,
          "findings": [
            {"evidence": str, "meaning": str, "implication": str,
             "label": "observed"|"projected"|"signal"|"judgment",
             "confidence": "high"|"medium"|"low"}
          ],
          "decisions": [{"title": str, "text": str}],
          "priorities": [str]
        },
        "landscape": str,
        "focus": {
          "overview": str,
          "roster": [{"title": str, "text": str}],
          "news": [{"text": str, "source": str, "url": str, "date": str}],
          "offseason": [
            {"player": str, "text": str,
             "sources": [{"source": str, "url": str, "date": str}]}
          ]
        },
        "questions": [str]
      }

      Requirements:
      - THE STRUCTURE IS A TOOLKIT, NOT A TEMPLATE. Which decisions get
        made and which position groups get attention come from THIS team's
        current record and findings, never from a prior report's topics. Do
        not assume a goalkeeper battle, scoring gap, or any other fixed story.
      - PAGE BUDGETS are hard print boundaries the renderer cannot fix for
        you: bottom_line at most 70 words; focus.overview at most 110
        words; landscape at most 100 words. Prose past a budget spills onto
        a broken page.
      - exec: a bottom_line paragraph; EXACTLY 3 findings, each split into
        evidence (the fact), meaning (the interpretation), and implication
        (what the staff does with it) — never blend fact and judgment in
        one sentence; at most 3 decisions — a decision is a call the
        staff settles in preseason, before the first match; a fixture,
        checkpoint, or anything on the season calendar is never a
        decision; apply the generic-decision test from the style
        contract: a decision title that would fit another team's report
        unchanged is under-specified. Rebind it to named players and this
        team's numbers until it could belong to no one else. Add a short
        priorities list for the roster page without repeating the decisions.
      - the roster shape counts each squad's international players from
        published hometowns. Where the share is notable — especially in a
        newcomer class — say so and read experience accordingly: D2
        eligibility rules mean internationals often arrive older than
        domestic freshmen, so class year understates experience. The same
        goes for verified pedigree in the research: MLS Next / ECNL /
        academy backgrounds mark a freshman proven above high-school
        level (roughly JUCO-transfer equivalent); JUCO and
        lower-division transfers are real minutes against variable
        competition. Use the ladder to calibrate newcomer expectations
        where pedigree is verified; otherwise the newcomer is unscouted.
        A structural note about the squad, never a verdict on a named
        player.
      - focus.roster: an ARRAY of {title, text} rows, one per line of the
        team (In goal, Back line, Midfield, Front line, Squad age — use
        the digest's roster_shape groups), tying last season's problems
        to this season's makeup. Ground every claim in the shape numbers
        and write shares as people ("the keepers who played 85% of the
        minutes are gone"), never as portfolios.
      - one landscape prose section covering BOTH conference positioning
        and where the focus side gains ground; it shares one page with the
        standings table and the gap chart, hence the 100-word budget
      - focus overview/news/offseason. The offseason ledger holds AT MOST
        3 consolidated signals — one item per player with every supporting
        citation in its sources array, never one item per source
      - questions are the preseason scorecard: testable checks, not generic
        prompts, and they must not duplicate decisions
      - LENGTH: roughly 150-200 words of prose per rendered fixed page.
        These core sections own seven fixed pages: cover, three brief pages,
        two roster pages, and the landscape. Apply the insight filter; state
        each conclusion once and stop. Repetition, not facts, makes a report
        long.
      - credibility rules (absolute): records are written W-L-T; the
        digest's availability_flags and usage_shifts are unverified
        signals — observed gaps with unknown causes, never conclusions;
        head-to-head is a held record since the first archived season,
        never "all-time"; never draw a conclusion from absence of
        evidence; never claim possession, set-piece quality, fitness, or
        any trait the data does not measure — corner counts show
        territorial exposure, and late goals show "performance after 60
        minutes", not fitness; name the measure when ranking players
        (shot-on-target rate, conversion), never bare "efficiency"
      - voice per the style contract: the vocabulary of a beat writer or
        an assistant coach, direct, no hype, every claim anchored to a
        cited number or source
      - DATA FIDELITY: every record, count, and share must be read directly
        from the relevant programme's section at the moment it is written,
        never from memory or a summary built earlier. After drafting, re-open
        the input and re-check every W-L-T record, returning count, and named
        player's status. Cross-programme scrambles are the worst failure.
      - the report NEVER names its own machinery: the words "digest",
        "roster shape", "verified pool", or any reference to this system
        must not appear in narrative prose. Say "the published record",
        "the held record", or state the fact plainly. "No roster shape is
        verified" becomes "the 2026 roster has not been published".
      - major verified programme news is never omitted: a head-coach
        change, a verified transfer between conference programmes, or a
        decorated arrival in the focus programme's findings MUST appear in
        focus.news or focus.offseason. Cutting for length never cuts it.

      Reply with one line: core findings, decisions, focus-news, offseason,
      and questions counts.

  - id: narrative-cards
    depends_on: [normalize]
    # Loop nodes inherit the workflow model and effort; per-loop overrides are dropped.
    timeout: 900000
    loop:
      # Fixed safety cap: scalar loop limits cannot read the runtime programme count.
      max_iterations: 24
      fresh_context: true
      until: ALL CARDS WRITTEN
      until_bash: |
        set -u
        DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
        D="data/scratch/report-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}"
        SLUGS=$(jq -r --arg focus "$KEELSON_INPUTS_focus" '.programmes | keys[] | select(. != $focus)' "$DG") || exit $?
        if [ -z "$SLUGS" ]; then
          exit 0
        fi
        for slug in $SLUGS; do
          F="$D/card-$slug.json"
          [ -f "$F" ] && [ "$F" -nt "$DG" ] || exit 1
        done
      prompt: |
        You are one iteration of the Touchline opponent-card stage for the
        $inputs.season $inputs.gender season, prepared for '$inputs.focus'.
        Write EXACTLY ONE opponent card and its zero-to-two watchlist profiles,
        then stop.

        The pipeline directory is:
        $resolve-pipeline.output
        Before writing, read:
          <pipeline-parent>/prompts/scouting-questionnaire.md
          <pipeline-parent>/prompts/style-contract.md
          <pipeline>/src/report.py (the touchline.report-narrative/4 contract)

        Inputs:
          data/scratch/digest-$inputs.season-$inputs.gender-$inputs.focus.json
            — THE ONLY SOURCE OF NUMBERS
          data/research/$inputs.season-$inputs.gender/verified.json
            — the only admissible news and offseason findings

        1. In digest programme order excluding '$inputs.focus', choose the FIRST
           opponent whose
           data/scratch/report-$inputs.season-$inputs.gender-$inputs.focus/card-<slug>.json
           is missing or is not newer than the digest.
        2. Read THAT programme's section directly. Never work from a summary
           table or memory of another programme. Read its verified findings and
           coach entry. attested_uncaptured items never enter report prose.
        3. Read already-written card-*.json files in the same scratch directory.
           Vary this card's opening and implication sentence shape from the
           preceding cards; fixed field anatomy does not require formulaic prose.
        4. Create the scratch directory and write card-<slug>.json as plain JSON:
           {
             "schema": "touchline.report-narrative-card/1",
             "programme": "<slug>",
             "card": {
               "threat": str,
               "vulnerability": str,
               "roster_note": str,
               "implication": str,
               "coach": str,
               "news": [{"text": str, "source": str, "url": str, "date": str}],
               "tier": "benchmark"|"swing"|"update"
             },
             "watchlist": [
               {
                 "player": str,
                 "programme": "<slug>",
                 "label": "observed"|"projected"|"signal"|"judgment",
                 "why": str,
                 "verify": str,
                 "role": str,
                 "class": str
               }
             ]
           }
           Omit the coach key when the coach is unverified.

        Card rules:
        - The structure is a toolkit, not a template. Threat, opening, tier, and
          watchlist picks come from THIS opponent's current record and findings.
        - A full card has threat, potential opening, roster note, exactly one
          preparation implication, optional verified bench line, and news. If a
          field has nothing verified, leave its string empty.
        - Tier from the findings, not table position alone. "update" is only for
          too little published data: a programme with a held record and a
          published roster is NEVER update. A new coach makes old patterns
          provisional but does not remove the full card. Tier words never appear
          in prose.
        - Apply the bench lens. A verified returning coach makes held patterns
          more reliable; a new coach makes them provisional. Roster churn under
          a new coach is a structural expectation, never a claim about a named
          player unless a source says so.
        - news has at most 2 ordinary items. A verified coaching change,
          intra-conference transfer, or decorated arrival is major news and is
          NEVER cut; when majors alone exceed two, include all, coach change
          first.
        - Watchlist has UP TO 2 players, admitted by the insight filter rather
          than quota. Draw a pair from different evidence classes when possible;
          one strong pick beats a manufactured pair. "why" is at most 90 words,
          and "verify" is a testable preseason check. No dossier section.
        - A benchmark or swing card earns roughly 150-200 words of prose; each
          watchlist sheet earns the same range. An update entry is compact:
          roster_note says what is missing and implication says what to re-check
          and when. Larger conferences earn proportionally more pages, never
          compressed full cards.
        - Credibility is absolute: W-L-T order; availability and usage are
          signals with unknown causes; held records are never "all-time"; no
          conclusions from missing evidence; no possession, fitness, set-piece
          quality, or unmeasured traits; name the measure behind any ranking.
        - Voice is a beat writer or assistant coach: direct, no hype, every
          claim anchored. The prose NEVER says "digest", "roster shape",
          "verified pool", or names report machinery.
        - After drafting, re-open THIS programme's section and re-check every
          number, returning/departed status, and named player. Fix every mismatch.

        Reply with one line: programme slug, tier, news count, and watchlist
        count. Reply ALL CARDS WRITTEN only after a mechanical check finds no
        missing or stale opponent card file.

  - id: assemble-narrative
    depends_on: [narrative-core, narrative-cards]
    timeout: 60000
    bash: |
      set -euo pipefail
      DG="data/scratch/digest-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      D="data/scratch/report-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}"
      CORE="$D/narrative-core.json"
      OUT="data/reports/narrative-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      TMP="$OUT.tmp"
      trap 'rm -f "$TMP"' EXIT
      if [ ! -f "$CORE" ] || [ ! "$CORE" -nt "$DG" ]; then
        printf 'ALARM: missing or stale narrative core %s.\n' "$CORE"
        exit 1
      fi
      if ! jq -e '
        .schema == "touchline.report-narrative-core/1"
        and ((.headline | type) == "string")
        and ((.exec | type) == "object")
        and ((.exec.bottom_line | type) == "string")
        and ((.exec.findings | type) == "array")
        and ((.exec.decisions | type) == "array")
        and ((.exec.priorities | type) == "array")
        and ((.landscape | type) == "string")
        and ((.focus | type) == "object")
        and ((.focus.overview | type) == "string")
        and ((.focus.roster | type) == "array")
        and ((.focus.news | type) == "array")
        and ((.focus.offseason | type) == "array")
        and ((.questions | type) == "array")
      ' "$CORE" >/dev/null; then
        printf 'ALARM: invalid narrative core %s.\n' "$CORE"
        exit 1
      fi
      FILES=()
      SLUGS=$(jq -r --arg focus "$KEELSON_INPUTS_focus" '.programmes | keys[] | select(. != $focus)' "$DG")
      for slug in $SLUGS; do
        F="$D/card-$slug.json"
        if [ ! -f "$F" ] || [ ! "$F" -nt "$DG" ]; then
          printf 'ALARM: missing or stale opponent card %s.\n' "$F"
          exit 1
        fi
        if ! jq -e --arg slug "$slug" '
          .schema == "touchline.report-narrative-card/1"
          and (.programme == $slug)
          and ((.card | type) == "object")
          and ((.card.threat | type) == "string")
          and ((.card.vulnerability | type) == "string")
          and ((.card.roster_note | type) == "string")
          and ((.card.implication | type) == "string")
          and ((.card | has("coach") | not) or ((.card.coach | type) == "string"))
          and ((.card.news | type) == "array")
          and (.card.tier | IN("benchmark", "swing", "update"))
          and ((.watchlist | type) == "array")
          and ((.watchlist | length) <= 2)
          and all(.watchlist[];
            .programme == $slug
            and ((.player | type) == "string")
            and (.label | IN("observed", "projected", "signal", "judgment"))
            and ((.why | type) == "string")
            and ((.verify | type) == "string"))
        ' "$F" >/dev/null; then
          printf 'ALARM: invalid opponent card %s.\n' "$F"
          exit 1
        fi
        FILES+=("$F")
      done
      mkdir -p data/reports
      jq -s '
        .[0] as $core
        | .[1:] as $parts
        | $core + {
            schema: "touchline.report-narrative/4",
            programmes: ($parts | map({key: .programme, value: .card}) | from_entries),
            watchlist: [$parts[] | .watchlist[]?]
          }
      ' "$CORE" "${FILES[@]}" > "$TMP"
      mv -f "$TMP" "$OUT"
      trap - EXIT
      jq -r '"narrative assembled: \(.programmes | length) programme cards, \(.watchlist | length) watchlist profiles, \(.exec.findings | length) findings"' "$OUT"

  - id: validate-narrative
    depends_on: [assemble-narrative]
    timeout: 60000
    bash: |
      set -uo pipefail
      F="data/reports/narrative-${KEELSON_INPUTS_season}-${KEELSON_INPUTS_gender}-${KEELSON_INPUTS_focus}.json"
      if [ ! -f "$F" ]; then
        printf 'ALARM: narrative node reported success but %s does not exist.\n' "$F"
        exit 1
      fi
      SCHEMA=$(jq -r '.schema // empty' "$F" 2>/dev/null)
      if [ "$SCHEMA" != "touchline.report-narrative/4" ]; then
        printf 'ALARM: %s schema is %s, expected touchline.report-narrative/4.\n' "$F" "${SCHEMA:-unparseable}"
        exit 1
      fi
      FINDINGS=$(jq '.exec.findings | length' "$F")
      DECISIONS=$(jq '.exec.decisions | length' "$F")
      PROGS=$(jq '.programmes | length' "$F")
      BOTTOM=$(jq -r '.exec.bottom_line // empty | length' "$F")
      if [ "$FINDINGS" -ne 3 ] || [ "$DECISIONS" -lt 1 ] \
        || [ "$DECISIONS" -gt 3 ] || [ "$PROGS" -lt 1 ] || [ "${BOTTOM:-0}" -lt 1 ]; then
        printf 'ALARM: narrative out of contract (findings=%s, exactly 3 required; decisions=%s max 3, programmes=%s, bottom_line len=%s).\n' \
          "$FINDINGS" "$DECISIONS" "$PROGS" "${BOTTOM:-0}"
        exit 1
      fi
      LEDGER=$(jq '[.focus.offseason // [] | length] | first' "$F")
      if [ "$LEDGER" -gt 3 ]; then
        printf 'ALARM: offseason ledger has %s items; the contract caps it at 3 consolidated signals.\n' "$LEDGER"
        exit 1
      fi
      SPLIT=$(jq '[.exec.findings[] | select((.evidence // "") == "" or (.meaning // "") == "")] | length' "$F")
      if [ "$SPLIT" -gt 0 ]; then
        printf 'ALARM: %s finding(s) missing the evidence/meaning split required by narrative/4.\n' "$SPLIT"
        exit 1
      fi
      MACHINERY=$(jq -r '.. | strings' "$F" | grep -ci 'digest\|roster shape\|roster_shape\|verified pool' || true)
      if [ "$MACHINERY" -gt 0 ]; then
        printf 'ALARM: narrative prose names report machinery %s time(s) ("digest"/"roster shape"/"verified pool") — banned by the style contract. Rewrite those sentences in plain language.\n' "$MACHINERY"
        exit 1
      fi
      BOTTOM_W=$(jq -r '.exec.bottom_line // ""' "$F" | wc -w | tr -d ' ')
      LAND_W=$(jq -r '.landscape // ""' "$F" | wc -w | tr -d ' ')
      OVER_W=$(jq -r '.focus.overview // ""' "$F" | wc -w | tr -d ' ')
      if [ "$BOTTOM_W" -gt 70 ] || [ "$LAND_W" -gt 100 ] || [ "$OVER_W" -gt 110 ]; then
        printf 'ALARM: page budgets exceeded (bottom_line %sw max 70, landscape %sw max 100, overview %sw max 110) — prose past budget breaks the print layout.\n' \
          "$BOTTOM_W" "$LAND_W" "$OVER_W"
        exit 1
      fi
      WHY_BAD=$(jq -r '[.watchlist // [] | .[] | select(((.why // "") | split(" ") | length) > 90) | .player] | join(", ")' "$F")
      if [ -n "$WHY_BAD" ]; then
        printf 'ALARM: watchlist "why" over the 90-word budget for: %s\n' "$WHY_BAD"
        exit 1
      fi
      if jq -e '(.dossiers // []) | length > 0' "$F" >/dev/null; then
        printf 'ALARM: narrative/4 has no dossier section — per-player depth lives in the watchlist profiles.\n'
        exit 1
      fi
      WATCH_BAD=$(jq -r --arg focus "$KEELSON_INPUTS_focus" '
        ([.programmes | keys[]]) as $known
        | ((.watchlist // []) | group_by(.programme) | map({k: .[0].programme, n: length})) as $groups
        | ($groups | map(select(.k == $focus)) | map("focus-side " + .k))
          + ($groups | map(select(.k as $k | ($k != $focus) and (($known | index($k)) == null))) | map("unknown " + .k))
          + ($groups | map(select(.n > 2)) | map(.k + " has " + (.n | tostring)))
        | join(", ")' "$F")
      if [ -n "$WATCH_BAD" ]; then
        printf 'ALARM: watchlist holds at most 2 profiles per opponent, none for the focus side, and only known programme slugs. Violations: %s\n' "$WATCH_BAD"
        exit 1
      fi
      printf 'narrative OK: %s findings, %s decisions, %s programme sections, ledger %s, watchlist %s\n' \
        "$FINDINGS" "$DECISIONS" "$PROGS" "$LEDGER" "$(jq '[.watchlist // []] | first | length' "$F")"

  - id: render
    depends_on: [validate-narrative]
    timeout: 120000
    bash: |
      set -uo pipefail
      PIPELINE_DIR=$(printf '%s' "${KEELSON_NODE_resolve_pipeline_OUTPUT:-}" | tr -d '\r' | tail -1)
      TOUCHLINE_DATA_DIR="$PWD" uv run --project "$PIPELINE_DIR" render-report \
        --season "$KEELSON_INPUTS_season" \
        --gender "$KEELSON_INPUTS_gender" \
        --focus "$KEELSON_INPUTS_focus"

  - id: summary
    model: gpt-5.6-luna
    depends_on: [render]
    timeout: 120000
    prompt: |
      The Touchline preseason report run finished. Write a SHORT completion
      summary for the person who asked:
      - the digest line: $digest.output
      - the research verification line: $merge-verified.output
      - the narrative sections: $assemble-narrative.output
      - the render line: $render.output
      Name what was dropped, attested-but-uncaptured, or left unswept exactly
      as reported — never soften it: with no approval gate, this summary is
      where a human learns what needs their eyes. The report is data/reports/preseason-$inputs.season-$inputs.gender-$inputs.focus.html;
      point to the matching .pdf only if the render line above says one was
      written;
      research artifacts live under data/research/. Do not invent
      numbers: every figure must appear in the text above.
