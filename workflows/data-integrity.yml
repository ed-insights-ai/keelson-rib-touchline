name: data-integrity
description: |
  Use when: you need to know which numbers in the touchline database are currently trustworthy — before believing a report, and before and after any data repair.
  Triggers: "data integrity", "check the data", "is the data right", "integrity report", "did the repair work".
  Does: rebuilds the parquet archive offline from the data repo's raw_html, runs thirteen deterministic read-only checks against it, live Postgres, the season JSON layers, and the membership reference, then prints one report with a per-check verdict and the file:line that causes each failure.
  NOT for: repairing anything (this never writes to the database), scraping, or judging code quality.

requiresProject: true
mutates_checkout: true
tags: [data, integrity, soccer]

# ─────────────────────────────────────────────────────────────────────────────
# FAIL CLOSED. Every check in this file must alarm when it cannot run.
#
# Q() sends psql stderr to /dev/null, so a dead database, a dropped table, a
# permissions change or one timed-out query all arrive in the shell as an EMPTY
# STRING. `[ "" -gt 0 ]` is then a test ERROR (exit 2) — not false — so an
# unguarded `&& V=alarm` never fires and V keeps its initialised `ok`. That is
# how a nonexistent database used to render as `[ OK   ]` with blank numbers.
#
# The convention, inherited from ground-truth.yml's cache-provenance check:
# after the queries run, assert every captured variable is non-empty; if any is
# empty, print an explicit `CHECK DID NOT RUN` alarm naming the empty captures
# and exit 0. The failure headline is deliberately NOT the measurement headline
# with blanks in it — a reader must be able to tell "the query failed" from
# "the data is bad" at a glance.
#
# `${!v}` is bash indirect expansion; Keelson runs bash nodes under bash (3.2 on
# this machine), where it is supported. Do not port these loops to sh.
#
# This workflow runs with cwd = the consumer data repo (e.g. soccer-data), so
# data paths are cwd-relative (data/raw_html, data/errors, data/structured,
# and the season JSON layers data/fixtures and data/stats).
# The database defaults to postgresql://lume@localhost:5432/touchline and is
# overridable with DATABASE_URL. Pipeline commands resolve the installed rib's
# pipeline/ directory: TOUCHLINE_PIPELINE_DIR env override, else packageDir
# from ~/.keelson/rib-touchline/config.json, else the installed package path —
# and alarm (never silently skip) when none resolves.
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  # ── 1. Freshness ────────────────────────────────────────────────────────
  - id: freshness
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      TOTAL=$(Q "SELECT count(*) FROM games")
      NEWEST=$(Q "SELECT coalesce(max(date)::text,'none') FROM games")
      DAYS=$(Q "SELECT coalesce((CURRENT_DATE - max(date))::text,'-1') FROM games")
      SEASONS=$(Q "SELECT count(DISTINCT season_year) FROM games")
      MISSING=
      for v in TOTAL NEWEST DAYS SEASONS; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"freshness","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$DAYS" -gt 14 ] 2>/dev/null && V=warn
      printf '{"check":"freshness","verdict":"%s","headline":"%s games, newest %s (%s days ago), %s seasons","cause":""}\n' \
        "$V" "$TOTAL" "$NEWEST" "$DAYS" "$SEASONS"

  # ── 2. Conference flagging ──────────────────────────────────────────────
  - id: conference-flag
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      NULLS=$(Q "SELECT count(*) FROM games WHERE is_conference_game IS NULL")
      TOTAL=$(Q "SELECT count(*) FROM games")
      AWAYC=$(Q "SELECT count(*) FROM games WHERE away_conference IS NULL")
      MISSING=
      for v in NULLS TOTAL AWAYC; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"conference-flag","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$NULLS" -gt 0 ] && V=alarm
      printf '{"check":"conference-flag","verdict":"%s","headline":"is_conference_game NULL for %s of %s rows; away_conference NULL for %s","cause":"nothing populates it — conferences.py:55-59 therefore returns an OVERALL record labelled standings"}\n' \
        "$V" "$NULLS" "$TOTAL" "$AWAYC"

  # ── 2b. Independent conference derivation ────────────────────────────────
  - id: conference-derivation
    timeout: 120000
    bash: |
      set -uo pipefail
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PIPELINE_DIR="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PIPELINE_DIR" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PIPELINE_DIR="$PD/pipeline"
      fi
      [ -d "${PIPELINE_DIR:-/nonexistent}" ] || PIPELINE_DIR="$HOME/.keelson/node_modules/@keelson/rib-touchline/pipeline"
      if [ ! -d "$PIPELINE_DIR" ]; then
        printf '{"check":"conference-derivation","verdict":"alarm","headline":"CHECK DID NOT RUN — no pipeline directory resolvable (TOUCHLINE_PIPELINE_DIR unset, no packageDir in %s, no installed rib), so conference-audit could not be invoked at all.","cause":"install or link the touchline rib, or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory."}\n' "$CFG"
        exit 0
      fi
      OUT=$(uv run --project "$PIPELINE_DIR" conference-audit 2>/dev/null); RC=$?
      if [ "$RC" -ne 0 ] || [ -z "${OUT:-}" ]; then
        printf '{"check":"conference-derivation","verdict":"alarm","headline":"CHECK DID NOT RUN — conference-audit exited %s or returned no output, so no rows were measured.","cause":"Run uv run --project <rib>/pipeline conference-audit from the data repo to expose the database, query, or Python error hidden from this read-only workflow node."}\n' "$RC"
        exit 0
      fi
      JSON=$(printf '%s\n' "$OUT" | awk '/^\{/{line=$0} END{print line}')
      if [ -z "${JSON:-}" ] || [[ "$JSON" != \{* ]] || ! printf '%s' "$JSON" | jq -e 'type == "object" and .check == "conference-derivation" and (.verdict == "ok" or .verdict == "warn" or .verdict == "alarm") and (.headline | type == "string" and length > 0)' >/dev/null 2>&1; then
        printf '{"check":"conference-derivation","verdict":"alarm","headline":"CHECK DID NOT RUN — conference-audit returned no valid one-line verdict JSON, so no counts can be trusted.","cause":"The CLI must end with one JSON object containing check, verdict, and a non-empty denominator-bearing headline."}\n'
        exit 0
      fi
      printf '%s\n' "$JSON"

  # ── 3. Match duplication ────────────────────────────────────────────────
  - id: duplication
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      # NOT `GROUPS` — that is a readonly bash builtin array (the caller's gids).
      # Assigning to it is silently ignored and $GROUPS expands to a gid (20 on
      # macOS/staff), which reads as a plausible count. Cost us a wrong number once.
      # GENDER IS PART OF THE KEY. A men's and a women's fixture on the same date
      # between the same two schools are two DIFFERENT matches (CROSSGENDER below
      # counts the live pairs). The old key was (date,home_team,away_team) with no
      # gender axis, so it merged every one of them and then read their naturally
      # differing scores as corruption — 100% false positives that inverted the
      # actual good news (no real score disagreement anywhere) into the file's
      # loudest verdict. s.gender is safe to key on: it is non-NULL for every row
      # and every row corroborates it against its own source_url (the
      # mens-soccer/womens-soccer segment or the msoc/wsoc convention), with zero
      # disagreements under either convention.
      DUPGROUPS=$(Q "SELECT count(*) FROM (SELECT g.date, g.home_team, g.away_team, s.gender FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY 1,2,3,4 HAVING count(*) > 1) d")
      EXTRA=$(Q "SELECT coalesce(sum(n-1),0) FROM (SELECT count(*) AS n FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY g.date, g.home_team, g.away_team, s.gender HAVING count(*) > 1) d")
      DISAGREE=$(Q "SELECT count(*) FROM (SELECT g.date, g.home_team, g.away_team, s.gender FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY 1,2,3,4 HAVING count(*) > 1 AND (count(DISTINCT g.home_score) > 1 OR count(DISTINCT g.away_score) > 1)) d")
      NODATE=$(Q "SELECT count(*) FROM games WHERE date IS NULL")
      TOTAL=$(Q "SELECT count(*) FROM games")
      # The staged expectation, measured live rather than recorded flat so it cannot
      # go stale. DUPCLEAN re-counts the same gender-aware groups over only the rows
      # tl-o23 will leave behind. The phantom predicate is NOT `!= season_year` —
      # that condemns legitimate games, because programmes that played their COVID
      # season in spring 2021 correctly filed it under season_year=2020. IN
      # (season_year, season_year+1) is its audited complement. Do not "simplify" it.
      DUPCLEAN=$(Q "SELECT count(*) FROM (SELECT g.date, g.home_team, g.away_team, s.gender FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL AND EXTRACT(YEAR FROM g.date)::int IN (g.season_year, g.season_year+1) GROUP BY 1,2,3,4 HAVING count(*) > 1) d")
      PHANTOMS=$(Q "SELECT count(*) FROM games WHERE date IS NOT NULL AND EXTRACT(YEAR FROM date)::int NOT IN (season_year, season_year+1)")
      # Both measured live so the cause states what the gender axis is actually
      # buying today, instead of asserting a number that was true once.
      CROSSGENDER=$(Q "SELECT count(*) FROM (SELECT g.date, g.home_team, g.away_team FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY 1,2,3 HAVING count(DISTINCT s.gender) > 1) d")
      BLINDDIS=$(Q "SELECT count(*) FROM (SELECT date, home_team, away_team FROM games WHERE date IS NOT NULL GROUP BY 1,2,3 HAVING count(*) > 1 AND (count(DISTINCT home_score) > 1 OR count(DISTINCT away_score) > 1)) d")
      MISSING=
      for v in DUPGROUPS EXTRA DISAGREE NODATE TOTAL DUPCLEAN PHANTOMS CROSSGENDER BLINDDIS; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"duplication","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$DUPGROUPS" -gt 0 ] && V=warn; [ "$DISAGREE" -gt 0 ] && V=alarm
      printf '{"check":"duplication","verdict":"%s","headline":"%s duplicate (date,home,away,gender) groups, %s extra rows, %s disagree on score; %s of %s rows have no date and are outside this check. Expect %s now and %s once tl-o23 deletes the %s phantom rows — a later drop to %s is that repair landing, not a regression.","cause":"a fixture scraped from both schools becomes two rows; no canonical match key exists. Gender is in the key deliberately: %s same-day fixtures between the same two schools are a genuine mens and womens pair, so the gender-blind key this check used to apply merged them and read their differing scores as corruption — %s false score disagreements, alarmed on, versus %s real ones now."}\n' \
        "$V" "$DUPGROUPS" "$EXTRA" "$DISAGREE" "$NODATE" "$TOTAL" "$DUPGROUPS" "$DUPCLEAN" "$PHANTOMS" "$DUPCLEAN" "$CROSSGENDER" "$BLINDDIS" "$DISAGREE"

  # ── 4. Season labelling ─────────────────────────────────────────────────
  - id: season-label
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      BYDATE=$(Q "SELECT count(*) FROM (SELECT s.abbreviation a, g.season_year sy, EXTRACT(YEAR FROM g.date)::int dy FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY 1,2,3) t WHERE dy NOT IN (sy, sy+1)")
      ROWS=$(Q "SELECT coalesce(sum(n),0) FROM (SELECT g.season_year sy, EXTRACT(YEAR FROM g.date)::int dy, count(*) n FROM games g WHERE g.date IS NOT NULL GROUP BY 1,2) t WHERE dy NOT IN (sy, sy+1)")
      BYURL=$(Q "SELECT count(*) FROM games WHERE source_url ~ '/stats/[0-9]{4}/' AND substring(source_url from '/stats/([0-9]{4})/')::int <> season_year")
      WORST=$(Q "SELECT coalesce(string_agg(x,'; '),'none') FROM (SELECT s.abbreviation||' '||g.season_year||' holds '||count(*)||' games dated '||EXTRACT(YEAR FROM g.date)::int AS x FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL GROUP BY s.abbreviation, g.season_year, EXTRACT(YEAR FROM g.date) HAVING EXTRACT(YEAR FROM g.date)::int NOT IN (g.season_year, g.season_year+1) ORDER BY count(*) DESC LIMIT 5) t")
      # WORST coalesces to the literal 'none' on success-with-no-findings, so an
      # empty WORST means the query failed, never that there is nothing to report.
      MISSING=
      for v in BYDATE ROWS BYURL WORST; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"season-label","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; { [ "$BYDATE" -gt 0 ] || [ "$BYURL" -gt 0 ]; } && V=alarm
      printf '{"check":"season-label","verdict":"%s","headline":"%s program-seasons mislabelled (%s rows); %s rows whose source_url year disagrees. %s","cause":"sidearm_discovery.py — the schedule page year segment was never asserted against the requested year"}\n' \
        "$V" "$BYDATE" "$ROWS" "$BYURL" "$WORST"

  # ── 5. Team identity resolution ─────────────────────────────────────────
  - id: identity
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      STRINGS=$(Q "SELECT count(*) FROM (SELECT home_team t FROM games UNION SELECT away_team FROM games UNION SELECT team FROM team_game_stats UNION SELECT team FROM player_game_stats) u WHERE t IS NOT NULL")
      DUPNAME=$(Q "SELECT coalesce(string_agg(name||' x'||n,', '),'none') FROM (SELECT name, count(*) n FROM schools GROUP BY 1 HAVING count(*) > 1) d")
      # Reproduce _ilike_pattern (conferences.py:14-21) EXACTLY: the first token
      # whose paren-stripped lowercase form is >= 4 chars and is not a stop word.
      # What matters is not "does the pattern match something" but "does it match
      # NEITHER team" — because conferences.py:69 and teams.py:79 both do
      #   is_home = _matches_pattern(g.home_team, pattern)
      # so a match FAILURE is silently indistinguishable from "we are the away
      # team", and the away score is then read as the school's own. Fail-open.
      SELF=$(Q "WITH pat AS (
                  SELECT s.id, s.abbreviation ab,
                    COALESCE((SELECT btrim(w,'()') FROM unnest(string_to_array(s.name,' ')) WITH ORDINALITY AS t(w,ord)
                              WHERE length(btrim(lower(w),'()')) >= 4
                                AND btrim(lower(w),'()') NOT IN ('university','college','state','of','the','and','at','women','lady')
                              ORDER BY ord LIMIT 1),
                             split_part(s.name,' ',1)) tok
                  FROM schools s),
                agg AS (
                  SELECT p.ab, count(*) total,
                         count(*) FILTER (WHERE g.home_team NOT ILIKE '%'||p.tok||'%'
                                            AND g.away_team NOT ILIKE '%'||p.tok||'%') blind
                  FROM games g JOIN pat p ON p.id=g.school_id
                  WHERE g.home_score IS NOT NULL GROUP BY 1)
                SELECT coalesce(string_agg(ab||' '||blind||'/'||total,', ' ORDER BY blind DESC),'none')
                FROM agg WHERE blind > 0")
      WORSTN=$(Q "WITH pat AS (
                  SELECT s.id,
                    COALESCE((SELECT btrim(w,'()') FROM unnest(string_to_array(s.name,' ')) WITH ORDINALITY AS t(w,ord)
                              WHERE length(btrim(lower(w),'()')) >= 4
                                AND btrim(lower(w),'()') NOT IN ('university','college','state','of','the','and','at','women','lady')
                              ORDER BY ord LIMIT 1),
                             split_part(s.name,' ',1)) tok
                  FROM schools s)
                SELECT count(*) FROM games g JOIN pat p ON p.id=g.school_id
                WHERE g.home_score IS NOT NULL
                  AND g.home_team NOT ILIKE '%'||p.tok||'%' AND g.away_team NOT ILIKE '%'||p.tok||'%'")
      # DUPNAME and SELF coalesce to 'none' on success, so empty means query failure.
      MISSING=
      for v in STRINGS DUPNAME SELF WORSTN; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"identity","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$WORSTN" -gt 0 ] && V=alarm
      printf '{"check":"identity","verdict":"%s","headline":"%s distinct team strings; non-unique school names: %s; %s scored games where the school cannot identify itself in either team slot (blind/total: %s)","cause":"_ilike_pattern (conferences.py:14-21, teams.py:14) fails open — conferences.py:69 treats a non-match as away and reads the OPPONENT score as the school own"}\n' \
        "$V" "$STRINGS" "$DUPNAME" "$WORSTN" "$SELF"

  # ── 6. Discipline coverage ──────────────────────────────────────────────
  - id: discipline
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      REDS=$(Q "SELECT count(*) FROM game_events WHERE event_type='red_card'")
      SCHOOLS=$(Q "SELECT count(DISTINCT school_id) FROM game_events WHERE event_type='red_card'")
      TOTAL=$(Q "SELECT count(*) FROM schools WHERE enabled")
      WHO=$(Q "SELECT coalesce(string_agg(s.abbreviation||'='||c,', '),'none') FROM (SELECT school_id, count(*) c FROM game_events WHERE event_type='red_card' GROUP BY 1) e JOIN schools s ON s.id=e.school_id")
      # Two-sided test: if EITHER operand is empty the comparison errors and the
      # verdict silently stays ok, so a readable schools table plus a dropped
      # game_events table used to pass. Both operands are asserted here.
      MISSING=
      for v in REDS SCHOOLS TOTAL WHO; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"discipline","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$SCHOOLS" -lt "$TOTAL" ] && V=alarm
      printf '{"check":"discipline","verdict":"%s","headline":"%s red cards across only %s of %s enabled programs (%s)","cause":"sidearm_parser.py:339-348 hardcodes yellow_card for every caution row at the SideArm programs"}\n' \
        "$V" "$REDS" "$SCHOOLS" "$TOTAL" "$WHO"

  # ── 7. Orphaned games ───────────────────────────────────────────────────
  - id: orphans
    timeout: 60000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      Q() { psql "$DSN" -At -c "$1" 2>/dev/null; }
      NOTEAM=$(Q "SELECT count(*) FROM games g WHERE NOT EXISTS (SELECT 1 FROM team_game_stats t WHERE t.game_id=g.game_id)")
      NOPLAYER=$(Q "SELECT count(*) FROM games g WHERE NOT EXISTS (SELECT 1 FROM player_game_stats p WHERE p.game_id=g.game_id)")
      NOEVENT=$(Q "SELECT count(*) FROM games g WHERE NOT EXISTS (SELECT 1 FROM game_events e WHERE e.game_id=g.game_id)")
      OVERLONG=$(Q "SELECT coalesce(string_agg(a||' '||sy||'='||n,', '),'none') FROM (SELECT s.abbreviation a, g.season_year sy, count(*) n FROM games g JOIN schools s ON s.id=g.school_id GROUP BY 1,2 HAVING count(*) > 28) t")
      # This check used to fail closed BY ACCIDENT: OVERLONG coalesces to 'none'
      # on success, so on query failure it was empty and `[ "" != "none" ]` was a
      # valid string comparison that happened to be true. That put the only
      # safety net in this file inside a SQL sentinel. The guard below makes it
      # deliberate; the `!= "none"` test now means only what it says — a season
      # is implausibly long — and no longer doubles as the failure detector.
      MISSING=
      for v in NOTEAM NOPLAYER NOEVENT OVERLONG; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"orphans","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see the error."}\n' "$MISSING"
        exit 0
      fi
      V=ok; [ "$NOTEAM" -gt 0 ] && V=warn
      [ "$OVERLONG" != "none" ] && V=alarm
      printf '{"check":"orphans","verdict":"%s","headline":"%s games with no team stats, %s with no player stats, %s with no events; implausibly long seasons: %s","cause":"sidearm_discovery.py assigns game_num by enumerate() position — a late-published box score shifts every subsequent id and orphans the old rows"}\n' \
        "$V" "$NOTEAM" "$NOPLAYER" "$NOEVENT" "$OVERLONG"

  # ── 8. Parse failures ───────────────────────────────────────────────────
  - id: parse-failures
    timeout: 60000
    bash: |
      set -uo pipefail
      D=data/errors
      # This node reads the filesystem, so it fails open by a different mechanism
      # than the psql checks: N can never be empty. The old else-branch set N=0 on
      # a missing directory, which renders identically to a genuinely clean
      # errors/ — so an unexpected cwd, or a moved directory, read as "clean".
      # A missing directory is not an empty one.
      if [ ! -d "$D" ]; then
        printf '{"check":"parse-failures","verdict":"alarm","headline":"CHECK DID NOT RUN — no directory at %s (cwd %s). A missing directory is not an empty one.","cause":"the path is relative to the data repo root, so either this node ran from an unexpected working directory or data/errors was moved, renamed or deleted"}\n' "$D" "$(pwd)"
        exit 0
      fi
      # The -d test above is necessary but NOT sufficient. A directory that exists but
      # cannot be listed sends find to stderr, which is discarded, and leaves the pipe
      # empty — so `wc -l` prints 0 and the node reported `0 unparsed box scores` with
      # verdict ok. An UNREADABLE directory is no more an empty one than a missing one
      # is. Listing entries needs r; descending into them needs x; find needs both.
      if [ ! -r "$D" ] || [ ! -x "$D" ]; then
        printf '{"check":"parse-failures","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not both readable and searchable by this user (cwd %s). find prints nothing and the count reads 0, which is indistinguishable from a clean errors/.","cause":"permissions or ownership on the directory changed, or the node ran as a user that cannot list it — check with ls -ld on the path. An unreadable directory is not an empty one."}\n' "$D" "$(pwd)"
        exit 0
      fi
      # One walk, and branch on find EXIT STATUS rather than on the count. The top-level
      # permission test above cannot see a subdirectory under data/errors that find
      # cannot descend into; that yields a partial walk, an undercount, and no signal at
      # all in the count itself. A count taken from a failed walk is not a measurement.
      FLIST=$(find "$D" -name '*.json' 2>/dev/null)
      FRC=$?
      if [ "$FRC" -ne 0 ]; then
        printf '{"check":"parse-failures","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s while walking %s (cwd %s), so the tree was only partly read and any count from it is an undercount, not a measurement of zero.","cause":"find stderr is discarded here — re-run the same find by hand from the data repo root to see which subdirectory it could not descend into, typically a permissions change somewhere under data/errors"}\n' "$FRC" "$D" "$(pwd)"
        exit 0
      fi
      # Same count as before: one line per matched file. grep -c . also counts a final
      # line with no trailing newline, which is what command substitution leaves behind.
      N=$(printf '%s' "$FLIST" | grep -c . | tr -d ' ')
      OLDEST=$(printf '%s' "$FLIST" | sort | head -1 | sed 's|.*/||')
      # OLDEST is deliberately NOT asserted: it is legitimately empty exactly when
      # N=0, which is the genuine clean state. N is asserted anyway.
      if [ -z "$N" ]; then
        printf '{"check":"parse-failures","verdict":"alarm","headline":"CHECK DID NOT RUN — could not count *.json under %s. That is a failed count, not a measurement of zero.","cause":"find succeeded but grep or tr produced no output for a directory that exists and is readable — re-run the count by hand"}\n' "$D"
        exit 0
      fi
      V=ok; [ "$N" -gt 0 ] && V=warn
      printf '{"check":"parse-failures","verdict":"%s","headline":"%s unparsed box scores in data/errors (oldest %s)","cause":"permanently failed parses — invisible to every consumer until retried"}\n' \
        "$V" "$N" "${OLDEST:-none}"

  # ── 9. Archive vs database agreement ────────────────────────────────────
  - id: archive
    timeout: 300000
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PIPELINE_DIR="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PIPELINE_DIR" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PIPELINE_DIR="$PD/pipeline"
      fi
      [ -d "${PIPELINE_DIR:-/nonexistent}" ] || PIPELINE_DIR="$HOME/.keelson/node_modules/@keelson/rib-touchline/pipeline"
      DB=$(psql "$DSN" -At -c "SELECT count(*) FROM games" 2>/dev/null)
      # The database half needs none of the filesystem, so do not throw away a working
      # measurement to report a broken one: DBHALF is computed up front and carried into
      # whichever not-run headline fires below.
      DBHALF="unavailable — psql returned nothing"
      [ -n "${DB:-}" ] && DBHALF="$DB games in the touchline database"
      if [ ! -d "$PIPELINE_DIR" ]; then
        printf '{"check":"archive","verdict":"alarm","headline":"CHECK DID NOT RUN — no pipeline directory resolvable (TOUCHLINE_PIPELINE_DIR unset, no packageDir in %s, no installed rib), so reparse could not be invoked. Database half: %s.","cause":"install or link the touchline rib, or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory."}\n' "$CFG" "$DBHALF"
        exit 0
      fi
      uv run --project "$PIPELINE_DIR" reparse >/dev/null 2>&1; REPARSE_RC=$?
      if [ "$REPARSE_RC" -ne 0 ]; then
        printf '{"check":"archive","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — uv run reparse exited %s from the data repo, so no regenerated export exists to compare. Database half: %s.","cause":"reparse stderr is discarded here — run uv run --project <rib>/pipeline reparse from the data repo to expose a missing source-URL mapping, unreadable cached page, parser failure, or broken uv environment."}\n' "$REPARSE_RC" "$DBHALF"
        exit 0
      fi
      # One line deliberately: a multi-line heredoc here would break out of the
      # YAML block scalar at column 1 and silently unregister this workflow.
      # Print the number of MATCHED FILES alongside the row sum. sum([]) is 0, so a glob
      # that matched nothing used to render as `parquet all/ 0 rows` — a fabricated
      # measurement that sails through the non-empty assertion below, because 0 is also
      # what a real but empty export reports. The file count is the only thing that
      # separates "the export holds no rows" from "there is no export to read".
      # WHICH parquet corpus this reads, because the two are easy to confuse. The glob
      # data/structured/*/all/games.parquet matches the PER-SCHOOL exports, each of
      # which has its own all/ subdirectory. It does NOT match the merged export at
      # data/structured/all/games.parquet — that path has no all/all/ under it. The
      # per-school game_id set is the one expected to match Postgres exactly, so
      # DB = PQ is the correct expectation and any gap is a real finding. The merged
      # export can lag or carry retired-ordinal rows; MC measures it separately so
      # the report can say so, and it never enters the DB/PQ equality.
      PY='import glob,os,pandas as pd; fs=sorted(glob.glob("data/structured/*/all/games.parquet")); m="data/structured/all/games.parquet"; mc=(len(pd.read_parquet(m,columns=["game_id"])) if os.path.exists(m) else "absent"); print(len(fs), sum(len(pd.read_parquet(f,columns=["game_id"])) for f in fs), mc)'
      # Piping straight into `tail -1` threw python's EXIT STATUS away. A run that dies
      # partway — one corrupt or unreadable parquet — can have printed to stdout before
      # it failed, and tail hands that line on as though it were the answer.
      # Capture the whole stream, branch on the status, and only then take the last line.
      PQRAW=$(uv run --project "$PIPELINE_DIR" python -c "$PY" 2>/dev/null); PQRC=$?
      if [ "$PQRC" -ne 0 ]; then
        printf '{"check":"archive","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — uv run python exited %s (cwd %s), so anything it printed before dying is not a measurement. Database half did run: %s.","cause":"python and uv stderr are discarded here — re-run the same one-liner by hand from the data repo to see it. Typically a missing or unreadable data/structured, a corrupt parquet, or a broken uv environment."}\n' "$PQRC" "$(pwd)" "$DBHALF"
        exit 0
      fi
      PQOUT=$(printf '%s' "$PQRAW" | tail -1)
      # Split only a well-formed three-field line: two integers and a third that is
      # either an integer or the literal token absent. Anything else — a truncated
      # line, a traceback tail, a uv diagnostic — leaves ALL THREE empty and trips the
      # assertion, rather than being silently parsed as a count.
      OK3='NF==3 && $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ && ($3 ~ /^[0-9]+$/ || $3 == "absent")'
      PQFILES=$(printf '%s' "$PQOUT" | awk "$OK3"' {print $1}')
      PQ=$(printf '%s' "$PQOUT" | awk "$OK3"' {print $2}')
      MC=$(printf '%s' "$PQOUT" | awk "$OK3"' {print $3}')
      # du keeps walking after a permission error, prints a total for what it COULD read,
      # and exits nonzero — so `du -sh ... | cut` yields a plausible undercount with no
      # signal in the value itself: `1.1G` and `4.0K` are equally well-formed. Piping to
      # cut discarded that status. Branch on du's own status instead and leave RAW empty
      # on a partial walk, so the assertion below names it.
      RAW=
      DUOUT=$(du -sh data/raw_html 2>/dev/null) && RAW=$(printf '%s' "$DUOUT" | cut -f1)
      # In this layout the raw_html archive is the durable record and SHOULD be fully
      # git-tracked — the opposite of the monorepo, where tracked HTML was a smell.
      # Count disk and git over the same path, exit status checked on both, so the
      # verdict below can compare them instead of alarming on mere existence.
      ONDISK=
      DISKLS=$(find data/raw_html -type f -name '*.html' 2>/dev/null) && ONDISK=$(printf '%s' "$DISKLS" | grep -c . | tr -d ' ')
      # `git ls-files ... | wc -l` reports 0 when git ITSELF fails, which is
      # indistinguishable from "nothing is tracked". Branch on git's exit status
      # so a git failure leaves TRACKED empty and trips the assertion below.
      TRACKED=
      TRACKEDLS=$(git ls-files 'data/raw_html/**/*.html' 2>/dev/null) && TRACKED=$(printf '%s' "$TRACKEDLS" | grep -c . | tr -d ' ')
      # DB is the whole point of this check and never entered the verdict at all —
      # it appeared only as ${DB:-?} in the headline, so a dead database read
      # "db ? games" with verdict ok. All captures are asserted here.
      MISSING=
      for v in DB PQ PQFILES MC RAW ONDISK TRACKED; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"archive","verdict":"alarm","headline":"CHECK DID NOT RUN — no result for:%s (DB from psql, PQ PQFILES and MC from uv run python over data/structured, RAW from du, ONDISK from find, TRACKED from git ls-files). Those are failures, not measurements of zero. Database half: %s.","cause":"stderr is discarded on all of them, so the reason is not captured here — a dead database, a missing or unreadable parquet export, a missing or partly unreadable raw_html directory, an unexpected working directory, or git failing. Re-run the commands by hand from the data repo root."}\n' "$MISSING" "$DBHALF"
        exit 0
      fi
      # DB and PQ are the two operands of the equality below, so being non-empty is
      # not enough — they must be NUMBERS. `[ x -ne y ]` on a non-numeric operand is
      # a test ERROR (exit 2), not false, so the comparison would silently not fire
      # and V would keep its initialised ok. That is the exact shape of the bug this
      # node is being fixed for, so the new comparison is guarded against it rather
      # than reintroducing it one layer down.
      NONNUM=
      for v in DB PQ; do case "${!v}" in *[!0-9]*|"") NONNUM="$NONNUM $v";; esac; done
      if [ -n "$NONNUM" ]; then
        printf '{"check":"archive","verdict":"alarm","headline":"CHECK DID NOT RUN — non-numeric result for:%s, so the db-vs-parquet comparison cannot be made. A comparison that cannot be evaluated is not a pass.","cause":"psql or the parquet reader returned something that is not a row count. Re-run both by hand from the data repo root and look at what they actually printed."}\n' "$NONNUM"
        exit 0
      fi
      # PQFILES is non-empty here, so it is a real count and 0 means the glob genuinely
      # matched nothing. That is the parquet half failing to run, not an export of zero
      # rows — and it is reported as such, with the database half preserved.
      if [ "$PQFILES" -lt 1 ] 2>/dev/null; then
        printf '{"check":"archive","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — the glob data/structured/*/all/games.parquet matched no files (cwd %s), so there is no export to compare against. The 0 rows this used to print was an absent export, not an empty one. Database half did run: %s.","cause":"data/structured was moved, renamed, or never generated, or the node ran from an unexpected working directory. Re-run reparse from the data repo, or list the glob by hand, then re-run this check."}\n' "$(pwd)" "$DBHALF"
        exit 0
      fi
      V=ok
      # THE REAL COMPARISON. This line used to read `[ "${PQ:-0}" -lt 0 ]` — a test for
      # a NEGATIVE ROW COUNT, which cannot happen, so the verdict could never fire and
      # DB and PQ were never compared to each other anywhere in the node. A parquet
      # export holding 999,999 rows against a Postgres count printed ok. The counts
      # happened to agree, so the check had been right by accident, not by measurement.
      AGREE="counts agree"
      # ALARM, not warn. This one comparison is the entire reason the node exists.
      # A mismatch signalled at the same level as an ordinary warn is
      # indistinguishable from one — which would leave the verdict exactly as inert
      # as the `[ "${PQ:-0}" -lt 0 ]` test this replaced.
      # Severity only ever RISES. Plain `V=warn` further down would silently downgrade an
      # alarm set here — which is how the first attempt at this fix broke: the mismatch
      # correctly set alarm, then an always-true condition on the next line reset it to
      # warn, and the escalation was invisible. A later assignment that can undo an earlier
      # signal is the same defect as the dead predicate this whole node was repaired for.
      raise() { case "$V:$1" in ok:warn|ok:alarm|warn:alarm) V=$1 ;; esac; }
      if [ "$DB" -ne "$PQ" ]; then raise alarm; AGREE="MISMATCH, parquet minus db = $((PQ - DB)) rows"; fi
      # Tracked-vs-disk DRIFT is the warn condition here, not mere trackedness: the
      # archive is canonical in git, so an on-disk file git does not know about is a
      # collected game that never reached the durable record (or a deleted one still
      # on disk). Equality is the healthy state.
      [ "$TRACKED" -ne "$ONDISK" ] 2>/dev/null && raise warn
      # The merged export is reported, never compared. It can lag the per-school
      # exports or carry retired-ordinal rows — worth naming every run, because it
      # is the file a careless consumer reads instead of the per-school ones.
      # Absent is a legitimate state and says so rather than printing 0.
      # Branch on the direction rather than printing db + $((MC - DB)) unconditionally:
      # that phrasing asserts the merged export is a SUPERSET of the db, which need
      # not hold. A merged export smaller than the db is a different and equally
      # reportable state, and printing it as `db + -N rows` would be stating a
      # relationship the data does not support.
      if [ "$MC" = "absent" ]; then
        MHALF="merged data/structured/all/games.parquet is absent, so nothing can read a stale superset"
      elif [ "$MC" -gt "$DB" ]; then
        MHALF="merged data/structured/all/games.parquet holds $MC rows = db + $((MC - DB)) rows the db does not have (retired school ordinals) and is NOT part of the comparison above"
      elif [ "$MC" -lt "$DB" ]; then
        MHALF="merged data/structured/all/games.parquet holds $MC rows, $((DB - MC)) FEWER than the db rather than the usual surplus, and is NOT part of the comparison above"
        raise warn
      else
        MHALF="merged data/structured/all/games.parquet holds $MC rows, equal to the db"
      fi
      # Each number stated over the corpus it was measured on, and the corpus named in
      # full: `parquet all/ N rows` is ambiguous between the per-school all/ exports
      # that were actually summed and the single merged all/ export that was not.
      printf '{"check":"archive","verdict":"%s","headline":"db %s games vs %s rows summed across the %s per-school data/structured/*/all/games.parquet exports — %s; %s; raw_html %s, %s of %s files on disk git-tracked","cause":"the db-vs-parquet equality is the right expectation for the per-school corpus: its game_id set is expected to match Postgres exactly in both directions, so a gap there is a real divergence and not an export convention. raw_html is the durable record in this repo, so tracked-vs-disk drift means collected games have not been committed."}\n' \
        "$V" "$DB" "$PQ" "$PQFILES" "$AGREE" "$MHALF" "$RAW" "$TRACKED" "$ONDISK"

  # ── 10. Merged export staleness ──────────────────────────────────────────
  - id: export-staleness
    timeout: 300000
    depends_on: [archive]
    bash: |
      set -uo pipefail
      DSN="${DATABASE_URL:-postgresql://lume@localhost:5432/touchline}"
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PIPELINE_DIR="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PIPELINE_DIR" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PIPELINE_DIR="$PD/pipeline"
      fi
      [ -d "${PIPELINE_DIR:-/nonexistent}" ] || PIPELINE_DIR="$HOME/.keelson/node_modules/@keelson/rib-touchline/pipeline"
      DB=$(psql "$DSN" -At -c "SELECT count(*) FROM games" 2>/dev/null); DBRC=$?
      if [ ! -d "$PIPELINE_DIR" ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"CHECK DID NOT RUN — no pipeline directory resolvable (TOUCHLINE_PIPELINE_DIR unset, no packageDir in %s, no installed rib), so reparse could not be invoked. Database half returned %s games.","cause":"install or link the touchline rib, or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory."}\n' "$CFG" "${DB:-unavailable}"
        exit 0
      fi
      uv run --project "$PIPELINE_DIR" reparse >/dev/null 2>&1; REPARSE_RC=$?
      if [ "$REPARSE_RC" -ne 0 ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — uv run reparse exited %s from the data repo, so no regenerated merged export exists. Database half returned %s games.","cause":"reparse stderr is discarded here — run uv run --project <rib>/pipeline reparse from the data repo to expose a missing source-URL mapping, unreadable cached page, parser failure, or broken uv environment."}\n' "$REPARSE_RC" "${DB:-unavailable}"
        exit 0
      fi
      PY='import pandas as pd; g=pd.read_parquet("data/structured/all/games.parquet",columns=["game_id"]); p=pd.read_parquet("data/structured/all/player_stats.parquet",columns=["game_id"]); print(len(g),int(((g["game_id"]//1000000)>14).sum()),len(p),int(((p["game_id"]//1000000)>14).sum()))'
      PQRAW=$(uv run --project "$PIPELINE_DIR" python -c "$PY" 2>/dev/null); PQRC=$?
      if [ "$DBRC" -ne 0 ] || [ -z "${DB:-}" ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"DATABASE HALF DID NOT RUN — psql exited %s and returned no usable games count; the merged export cannot be compared with Postgres.","cause":"psql stderr is discarded here — re-run SELECT count(*) FROM games against the touchline database (DATABASE_URL or postgresql://lume@localhost:5432/touchline) to see whether the database is down, the table is missing, or permissions changed."}\n' "$DBRC"
        exit 0
      fi
      if [ "$PQRC" -ne 0 ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — uv run python exited %s while opening data/structured/all/{games,player_stats}.parquet, so no retired-ordinal or row-count measurement exists. Database half did run: %s games.","cause":"python and uv stderr are discarded here — re-run the same reader from the data repo to expose a missing, unreadable, or corrupt merged export."}\n' "$PQRC" "$DB"
        exit 0
      fi
      PQOUT=$(printf '%s' "$PQRAW" | tail -1)
      OK4='NF==4 && $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/'
      GAMES=$(printf '%s' "$PQOUT" | awk "$OK4"' {print $1}')
      RETIRED_GAMES=$(printf '%s' "$PQOUT" | awk "$OK4"' {print $2}')
      PLAYERS=$(printf '%s' "$PQOUT" | awk "$OK4"' {print $3}')
      RETIRED_PLAYERS=$(printf '%s' "$PQOUT" | awk "$OK4"' {print $4}')
      MISSING=
      for v in GAMES RETIRED_GAMES PLAYERS RETIRED_PLAYERS; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"PARQUET HALF DID NOT RUN — malformed reader output left no numeric result for:%s. A missing count is not a measurement of zero. Database half did run: %s games.","cause":"the parquet reader must emit exactly four integers: total and retired rows for games, then total and retired rows for player_stats. Re-run it by hand and inspect stdout."}\n' "$MISSING" "$DB"
        exit 0
      fi
      case "$DB" in *[!0-9]*|"")
        printf '{"check":"export-staleness","verdict":"alarm","headline":"DATABASE HALF DID NOT RUN — psql returned a non-numeric games count, so the merged export cannot be compared with Postgres.","cause":"re-run SELECT count(*) FROM games against the touchline database and inspect its output."}\n'
        exit 0
      ;; esac
      V=ok
      raise() { case "$V:$1" in ok:warn|ok:alarm|warn:alarm) V=$1 ;; esac; }
      AGREE="counts agree"
      if [ "$GAMES" -ne "$DB" ]; then raise alarm; AGREE="MISMATCH, parquet minus db = $((GAMES - DB)) rows"; fi
      if [ "$RETIRED_GAMES" -gt 0 ] || [ "$RETIRED_PLAYERS" -gt 0 ]; then raise alarm; fi
      printf '{"check":"export-staleness","verdict":"%s","headline":"merged games export %s rows vs db %s — %s; retired ordinals (>14): games %s of %s rows, player stats %s of %s rows","cause":"data/structured/all is stale or was merged from retired school directories. Regenerate only after prerequisite data repairs are present, then re-run this check."}\n' \
        "$V" "$GAMES" "$DB" "$AGREE" "$RETIRED_GAMES" "$GAMES" "$RETIRED_PLAYERS" "$PLAYERS"

  # ── 11. Goal attribution — scoreboard vs stats layer ────────────────────
  - id: goal-attribution
    timeout: 60000
    bash: |
      set -uo pipefail
      # For every collected programme in every conference-season cell the data
      # home holds, compare the scoreline reading of its goals (fixtures layer:
      # its side of every final scoreline, either team slot) against the
      # attributed reading (stats layer: its players' goals summed). The two
      # can diverge HONESTLY — an own goal or unattributed scorer inflates the
      # scoreboard side, a stats page that lags or leads the schedule page
      # moves either — so a divergence is reported with both figures, named,
      # never dropped, and never escalated past warn. Alarm is reserved for
      # the check itself failing to run, per the file's rule.
      # EXHIBITIONS ARE NOT SCOREBOARD GOALS. Season statistics tables never
      # attribute exhibition goals to players, so a scored friendly in the
      # sum is a guaranteed false divergence, not a finding: Saint Mary's
      # 2026 read 5 scoreboard v 0 attributed until its two scored friendlies
      # (one against a club side) were excluded, after which both readings
      # agree at 0. match_type=="exhibition" fixtures are therefore excluded
      # from the sums and counted, like scoreless finals — excluded, never
      # hidden. A fixture without match_type is a regular match and counts.
      # Conference, gender, and season all come from the files on disk — the
      # sweep covers whatever has been collected, nothing is hardcoded.
      FD=data/fixtures
      SD=data/stats
      # Same rule as parse-failures: a missing or unreadable layer directory is
      # CHECK DID NOT RUN, never a clean sweep of zero cells.
      for D in "$FD" "$SD"; do
        if [ ! -d "$D" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — no directory at %s (cwd %s). A missing layer directory is not an empty one.","cause":"the path is relative to the data home root, so either this node ran from an unexpected working directory or the season layer was moved, renamed, or never collected"}\n' "$D" "$(pwd)"
          exit 0
        fi
        if [ ! -r "$D" ] || [ ! -x "$D" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not both readable and searchable by this user (cwd %s), so its season files cannot be listed.","cause":"permissions or ownership on the directory changed — check with ls -ld. An unreadable directory is not an empty one."}\n' "$D" "$(pwd)"
          exit 0
        fi
      done
      FLIST=$(find "$FD" -maxdepth 1 -name '*.json' 2>/dev/null | sort); FRC=$?
      if [ "$FRC" -ne 0 ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s listing %s (cwd %s), so the season files were only partly listed and any sweep over them is an undercount, not a measurement.","cause":"find stderr is discarded here — re-run the same find by hand from the data home root to see what it could not read"}\n' "$FRC" "$FD" "$(pwd)"
        exit 0
      fi
      if [ -z "$FLIST" ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s holds no season files (cwd %s), so there is nothing to compare. A fixtures layer with nothing in it cannot be measured, only collected.","cause":"either this node ran outside a collected data home or the fixtures layer was moved or renamed — list the directory by hand"}\n' "$FD" "$(pwd)"
        exit 0
      fi
      # One jq pass per cell. META carries the cell labels and two exclusion
      # counts, both named rather than silent: regular finals published
      # without a scoreline (at least one modern theme publishes completion
      # without a result) and exhibition finals that DO carry a scoreline
      # (the goals the stats layer will rightly never attribute). CMP carries
      # one row per collected programme: scoreboard goals-for summed over
      # non-exhibition final fixtures that carry BOTH scores, from either
      # team slot, against that programme's summed player goals from the
      # stats layer — "absent" when the stats layer has no entry for the
      # programme at all. EXTRA names a stats-layer team the fixtures layer
      # does not list as a programme, so neither direction of layer mismatch
      # is dropped.
      JQ='
        .season as $y | .gender as $g | .conference as $c
        | (.programmes | map(.slug)) as $ps
        | ($st[0].teams // {}) as $tm
        | ([.fixtures[] | select(.status=="final" and .match_type!="exhibition" and (((.home_score|type)!="number") or ((.away_score|type)!="number")))] | length) as $noscore
        | ([.fixtures[] | select(.status=="final" and .match_type=="exhibition" and ((.home_score|type)=="number") and ((.away_score|type)=="number"))] | length) as $exh
        | ( ["META\t\($y)\t\($g)\t\($c)\t\($ps|length)\t\($noscore)\t\($exh)"]
          + [ $ps[] as $p
              | ([ .fixtures[]
                   | select(.status=="final" and .match_type!="exhibition" and ((.home_score|type)=="number") and ((.away_score|type)=="number"))
                   | select(.home==$p or .away==$p)
                   | (if .home==$p then .home_score else .away_score end) ] | add // 0) as $gf
              | (if ($tm|has($p)) then ([ $tm[$p].players[]?.goals // 0 ] | add // 0 | tostring) else "absent" end) as $att
              | "CMP\t\($y)\t\($g)\t\($c)/\($p)\t\($gf)\t\($att)" ]
          + [ ($tm | keys[]) as $p | select(($ps | index($p)) | not)
              | "EXTRA\t\($y)\t\($g)\t\($c)/\($p)\t\([ $tm[$p].players[]?.goals // 0 ] | add // 0)" ]
          )[]'
      ROWS_ALL=""
      CELLS=0
      UNPAIRED=0
      UNPAIREDNAMES=""
      MAXSEASON=0
      NOSCORE=0
      EXHIBITIONS=0
      # Word-splitting FLIST on whitespace is safe here: season files are named
      # {season}-{gender}-{conference}.json by the collector, never with spaces.
      for F in $FLIST; do
        B=$(basename "$F")
        S="$SD/$B"
        # A fixtures cell with no stats file is a NAMED finding, not a silent
        # skip and not an alarm: a freshly collected season legitimately
        # precedes its stats publication, and the coverage manifest already
        # owns that gap.
        if [ ! -f "$S" ]; then
          UNPAIRED=$((UNPAIRED+1))
          UNPAIREDNAMES="$UNPAIREDNAMES ${B%.json}"
          continue
        fi
        ROWS=$(jq -r --slurpfile st "$S" "$JQ" "$F" 2>/dev/null); RC=$?
        META=$(printf '%s\n' "$ROWS" | awk -F '\t' '$1=="META" && NF==7 {print; exit}')
        if [ "$RC" -ne 0 ] || [ -z "$META" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — jq exited %s reading %s against %s, so no cell was measured. A season file that cannot be read is not a clean one.","cause":"jq stderr is discarded here — re-run it by hand against the pair to see the parse error: a malformed season file, or a layer shape this check does not know."}\n' "$RC" "$F" "$S"
          exit 0
        fi
        Y=$(printf '%s' "$META" | cut -f2)
        NS=$(printf '%s' "$META" | cut -f6)
        EX=$(printf '%s' "$META" | cut -f7)
        case "$Y$NS$EX" in *[!0-9]*|"")
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s carries a non-numeric season, scoreless-final, or exhibition count, so the sweep cannot be keyed. A cell that cannot be keyed is not a measured one.","cause":"the season field must be an integer year — inspect the file by hand"}\n' "$F"
          exit 0
        ;; esac
        [ "$Y" -gt "$MAXSEASON" ] && MAXSEASON=$Y
        NOSCORE=$((NOSCORE+NS))
        EXHIBITIONS=$((EXHIBITIONS+EX))
        CELLS=$((CELLS+1))
        ROWS_ALL="$ROWS_ALL$ROWS
      "
      done
      if [ "$CELLS" -eq 0 ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — none of the fixtures cells has a stats file (%s), so not one comparison could be made. A comparison that cannot be evaluated is not a pass.","cause":"the stats layer was never collected into this home, or lives under a different naming — list data/stats by hand"}\n' "${UNPAIREDNAMES# }"
        exit 0
      fi
      # Every divergent programme-season, named with both figures — the whole
      # point of the check, so the full table precedes the one-line verdict the
      # way the conference audit prints its summary before its payload. The
      # report node reads only the final JSON line; the table stays in this
      # node's output, named, not dropped.
      TABLE=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '
        $1=="CMP" && $6!="absent" && ($5+0)!=($6+0) { printf "%s %s %s scoreboard %s attributed %s\n",$2,$3,$4,$5,$6 }
        $1=="CMP" && $6=="absent" && ($5+0)>0 { printf "%s %s %s scoreboard %s attributed none (no stats entry)\n",$2,$3,$4,$5 }
        $1=="EXTRA" { printf "%s %s %s stats layer only: %s attributed goals, no fixtures programme\n",$2,$3,$4,$5 }
      ' | sort)
      COMPARED=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP"{n++} END{print n+0}')
      DIVN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($5+0)!=($6+0){n++} END{print n+0}')
      OVERN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($5+0)>($6+0){n++} END{print n+0}')
      UNDERN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($6+0)>($5+0){n++} END{print n+0}')
      NOG=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)>0{n++} END{print n+0}')
      NO0=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)==0{n++} END{print n+0}')
      NO0NAMES=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)==0 { printf "%s%s %s %s",sep,$2,$3,$4; sep=", " }')
      EXTRAN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="EXTRA"{n++} END{print n+0}')
      # The newest season is the live one — its divergences travel in the
      # headline in full, because collect time is when a lagging layer is
      # cheapest to chase. The archive's divergences are endemic (own goals
      # were never attributed historically) and live in the table above.
      CUR=$(printf '%s' "$ROWS_ALL" | awk -F '\t' -v m="$MAXSEASON" '
        $1=="CMP" && $2==m && ( ($6!="absent" && ($5+0)!=($6+0)) || ($6=="absent" && ($5+0)>0) ) {
          a=$6; if (a=="absent") a="none"
          printf "%s%s %s %sv%s", sep, $3, $4, $5, a; sep="; "
        }')
      MISSING=
      for v in COMPARED DIVN OVERN UNDERN NOG NO0 EXTRAN; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — no count for:%s. Those are failed aggregations, not measurements of zero.","cause":"awk produced no output over rows jq already validated — re-run the sweep by hand from the data home root"}\n' "$MISSING"
        exit 0
      fi
      V=ok
      { [ "$DIVN" -gt 0 ] || [ "$NOG" -gt 0 ] || [ "$EXTRAN" -gt 0 ] || [ "$UNPAIRED" -gt 0 ]; } && V=warn
      [ -n "$TABLE" ] && printf '%s\n' "$TABLE"
      [ -n "$CUR" ] || CUR="every programme agrees"
      UP="none"
      [ -n "$UNPAIREDNAMES" ] && UP="${UNPAIREDNAMES# }"
      NO0OUT="none"
      [ -n "$NO0NAMES" ] && NO0OUT="$NO0NAMES"
      printf '{"check":"goal-attribution","verdict":"%s","headline":"%s of %s programme-seasons diverge between scoreboard and attributed goals across %s conference-season cells — %s scoreboard ahead, %s stats ahead, %s with goals but no stats entry, each named above; season %s: %s; %s scoreless finals and %s scored exhibitions excluded from scoreboard totals; %s programmes absent from stats with 0 scoreboard goals (%s); %s stats-only programmes; %s cells with no stats file (%s)","cause":"both layers can be honest — a scoreboard goal nobody was credited with (own goal, unattributed scorer) or a stats page that lags or leads the schedule page by a match — so a divergence is a collector-domain signal to re-collect the lagging layer, never proof of corruption. Exhibition scorelines are excluded before summing: season statistics tables never attribute exhibition goals, so a scored friendly in the sum is a guaranteed false divergence. Consumer surfaces already verify against either reading; this names the gap at collect time."}\n' \
        "$V" "$((DIVN + NOG))" "$COMPARED" "$CELLS" "$OVERN" "$UNDERN" "$NOG" "$MAXSEASON" "$CUR" "$NOSCORE" "$EXHIBITIONS" "$NO0" "$NO0OUT" "$EXTRAN" "$UNPAIRED" "$UP"

  # ── 12. Membership reference sync ───────────────────────────────────────
  - id: membership-sync
    timeout: 60000
    bash: |
      set -uo pipefail
      # The rib's packaged data/reference/membership.json is the SOURCE OF
      # RECORD for conference membership: version-controlled, reviewed, read
      # by the rib's src/membership.ts (and so by the collect cadence's
      # programme resolution) and preferred by the pipeline's
      # src/membership.py. The data home's data/reference/membership.json is
      # the deployment artifact collect mirrors from it
      # (pipeline/scripts/collect_board.py, sync_membership_reference). A
      # divergence no longer silently steers resolution — loaders prefer the
      # packaged copy — but it does publish a stale membership record to
      # anything reading the data repo's files directly, so it is reported
      # as WARN with the exact canonical diff printed above the verdict
      # line. Alarm is reserved for this check itself not running, per the
      # file's rule. Nothing here names a conference: every figure is
      # measured from the two documents.
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PKG=""
      [ -n "${TOUCHLINE_PIPELINE_DIR:-}" ] && PKG=$(dirname "$TOUCHLINE_PIPELINE_DIR")
      if [ ! -f "${PKG:-/nonexistent}/data/reference/membership.json" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PKG="$PD"
      fi
      [ -f "${PKG:-/nonexistent}/data/reference/membership.json" ] || PKG="$HOME/.keelson/node_modules/@keelson/rib-touchline"
      SRC="$PKG/data/reference/membership.json"
      DST=data/reference/membership.json
      if [ ! -f "$SRC" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — no packaged membership.json resolvable (tried the parent of TOUCHLINE_PIPELINE_DIR, packageDir in %s, and the installed rib), so there is no source of record to compare the data home against.","cause":"install or link the touchline rib, or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory — the source of record lives beside it at <package>/data/reference/membership.json."}\n' "$CFG"
        exit 0
      fi
      # Canonicalize BOTH sides (jq -S) so key order and whitespace never
      # count as divergence — only the data can differ.
      SRCC=$(jq -S . "$SRC" 2>/dev/null); SRCRC=$?
      if [ "$SRCRC" -ne 0 ] || [ -z "${SRCC:-}" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — the packaged source of record %s is not parseable JSON (jq exited %s), so no comparison can be made. An unreadable authority is not a clean one.","cause":"jq stderr is discarded here — run jq -S . on the file by hand; the rib install at that path is broken and must be fixed before this check means anything."}\n' "$SRC" "$SRCRC"
        exit 0
      fi
      if [ ! -f "$DST" ]; then
        printf '{"check":"membership-sync","verdict":"warn","headline":"data home carries no membership.json at %s (cwd %s) — pipeline loaders fall back to the packaged source of record, so resolution stays consistent, but the data repo publishes no membership record at all.","cause":"the next collect run mirrors the packaged copy into the data home; to install it now, from the data home root: cp %s %s"}\n' "$DST" "$(pwd)" "$SRC" "$DST"
        exit 0
      fi
      if [ ! -r "$DST" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not readable by this user (cwd %s), so the data home side cannot be compared. An unreadable file is not a synced one.","cause":"permissions or ownership on the file changed — check with ls -l on the path."}\n' "$DST" "$(pwd)"
        exit 0
      fi
      DSTC=$(jq -S . "$DST" 2>/dev/null); DSTRC=$?
      if [ "$DSTRC" -ne 0 ] || [ -z "${DSTC:-}" ]; then
        printf '{"check":"membership-sync","verdict":"warn","headline":"data home membership.json at %s is not parseable JSON (jq exited %s) — it cannot match the packaged source of record, and anything reading the data repo directly gets a corrupt membership record.","cause":"the file was hand-edited or truncated; the next collect run mirrors the packaged copy over it, or install it now from the data home root: cp %s %s"}\n' "$DST" "$DSTRC" "$SRC" "$DST"
        exit 0
      fi
      TMPD=$(mktemp -d "${TMPDIR:-/tmp}/membership-sync.XXXXXX" 2>/dev/null)
      if [ -z "${TMPD:-}" ] || [ ! -d "$TMPD" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — mktemp could not create a scratch directory under %s, so the canonicalized documents cannot be diffed.","cause":"TMPDIR is unwritable or full — fix that and re-run."}\n' "${TMPDIR:-/tmp}"
        exit 0
      fi
      trap 'rm -rf "$TMPD"' EXIT
      printf '%s\n' "$SRCC" >"$TMPD/packaged"
      printf '%s\n' "$DSTC" >"$TMPD/data-home"
      # Headline figures, measured from the canonical forms — never asserted
      # flat. jq already parsed both documents above, so an empty capture
      # here is an extraction failure, not data.
      PPROG=$(printf '%s\n' "$SRCC" | jq -r '.memberships // {} | length' 2>/dev/null)
      DPROG=$(printf '%s\n' "$DSTC" | jq -r '.memberships // {} | length' 2>/dev/null)
      PWIN=$(printf '%s\n' "$SRCC" | jq -r '[.memberships // {} | .[] | .[] | length] | add // 0' 2>/dev/null)
      DWIN=$(printf '%s\n' "$DSTC" | jq -r '[.memberships // {} | .[] | .[] | length] | add // 0' 2>/dev/null)
      PCONF=$(printf '%s\n' "$SRCC" | jq -r '.conferences // [] | join("/")' 2>/dev/null)
      DCONF=$(printf '%s\n' "$DSTC" | jq -r '.conferences // [] | join("/")' 2>/dev/null)
      MISSING=
      for v in PPROG DPROG PWIN DWIN PCONF DCONF; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — jq returned nothing for:%s over documents it already parsed, so the comparison cannot be summarized. Those are failed extractions, not measurements of zero.","cause":"re-run jq -S over both files by hand: %s and %s."}\n' "$MISSING" "$SRC" "$DST"
        exit 0
      fi
      DIFF=$(diff -u -L "packaged $SRC (canonical)" -L "data-home $DST (canonical)" "$TMPD/packaged" "$TMPD/data-home" 2>/dev/null); DRC=$?
      if [ "$DRC" -gt 1 ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — diff exited %s comparing the canonicalized documents, so agreement was never measured. A comparison that cannot be evaluated is not a pass.","cause":"diff stderr is discarded here — run jq -S on both files and diff them by hand: %s vs %s."}\n' "$DRC" "$SRC" "$DST"
        exit 0
      fi
      if [ "$DRC" -eq 0 ]; then
        BYTES="byte-identical"
        cmp -s "$SRC" "$DST" 2>/dev/null || BYTES="formatting differs only, canonical data equal (the next collect run rewrites the mirror byte-for-byte)"
        printf '{"check":"membership-sync","verdict":"ok","headline":"data home membership.json matches the packaged source of record — %s programmes, %s windows, conferences %s; %s","cause":""}\n' "$PPROG" "$PWIN" "$PCONF" "$BYTES"
        exit 0
      fi
      # Divergence: the exact canonical diff precedes the one-line verdict,
      # the way goal-attribution prints its table — named in full, never
      # dropped. The report node reads only the final JSON line.
      # `^-[^-]` / `^+[^+]` count body lines while skipping the ---/+++
      # headers; jq -S output never starts a content line with - or +, and
      # never emits an empty line, so the counts are exact.
      ONLYSRC=$(printf '%s\n' "$DIFF" | grep -c '^-[^-]')
      ONLYDST=$(printf '%s\n' "$DIFF" | grep -c '^+[^+]')
      printf 'membership-sync: canonicalized diff, packaged source of record (-) vs data home copy (+):\n'
      printf '%s\n' "$DIFF"
      printf '{"check":"membership-sync","verdict":"warn","headline":"membership.json DIVERGES from the packaged source of record: %s canonical lines only in the packaged record, %s only in the data home copy — packaged holds %s programmes, %s windows, conferences %s; the data home copy holds %s programmes, %s windows, conferences %s. The exact diff precedes this line.","cause":"the data home copy is a stale deployment artifact. Pipeline loaders prefer the packaged copy, so resolution is already consistent — but the data repo is publishing a stale membership record to anything reading its files directly. The next collect run mirrors the packaged copy over it, or install now from the data home root: cp %s %s"}\n' \
        "$ONLYSRC" "$ONLYDST" "$PPROG" "$PWIN" "$PCONF" "$DPROG" "$DWIN" "$DCONF" "$SRC" "$DST"

  # ── Report ──────────────────────────────────────────────────────────────
  - id: report
    runtime: bun
    always_run: true
    trigger_rule: all_done
    depends_on:
      [freshness, conference-flag, conference-derivation, duplication, season-label, identity,
       discipline, orphans, parse-failures, archive, export-staleness, goal-attribution,
       membership-sync]
    script: |
      const IDS = ['freshness','conference_flag','conference_derivation','duplication','season_label','identity',
                   'discipline','orphans','parse_failures','archive','export_staleness','goal_attribution',
                   'membership_sync']
      const MARK = { ok: '[ OK   ]', warn: '[ WARN ]', alarm: '[ ALARM]' }
      const rows = []
      for (const id of IDS) {
        const raw = (process.env[`KEELSON_NODE_${id}_OUTPUT`] || '').trim()
        if (!raw) { rows.push({ check: id, verdict: 'alarm', headline: 'check did not run', cause: '' }); continue }
        try {
          rows.push(JSON.parse(raw.split('\n').filter(l => l.trim().startsWith('{')).pop()))
        } catch {
          rows.push({ check: id, verdict: 'alarm', headline: `unparseable output: ${raw.slice(0, 160)}`, cause: '' })
        }
      }
      const n = v => rows.filter(r => r.verdict === v).length
      const worst = n('alarm') ? 'ALARM' : n('warn') ? 'WARN' : 'CLEAR'

      console.log('')
      console.log('  TOUCHLINE — DATA INTEGRITY')
      console.log('  ' + '─'.repeat(72))
      console.log(`  ${worst}   ${n('ok')} clear · ${n('warn')} warn · ${n('alarm')} alarm   (${rows.length} checks)`)
      console.log('  ' + '─'.repeat(72))
      console.log('')
      for (const r of rows) {
        console.log(`  ${MARK[r.verdict] || '[  ?   ]'}  ${String(r.check).toUpperCase().replace(/_/g, '-')}`)
        console.log(`            ${r.headline}`)
        if (r.cause && r.verdict !== 'ok') console.log(`            └ ${r.cause}`)
        console.log('')
      }
      console.log('  ' + '─'.repeat(72))
      console.log('  Read-only. Repairs are tracked as tl-* beads (bd ready).')
      console.log('')
      console.log(JSON.stringify({ verdict: worst, clear: n('ok'), warn: n('warn'), alarm: n('alarm'), checks: rows }))
