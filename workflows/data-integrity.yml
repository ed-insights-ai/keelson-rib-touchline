name: data-integrity
description: |
  Use when: you need to know which numbers in the touchline data home are currently trustworthy — before believing a report, and before and after any data repair.
  Triggers: "data integrity", "check the data", "is the data right", "integrity report", "did the repair work".
  Does: runs four deterministic read-only checks against the season JSON layers, the collect gap ledger, and the membership reference, then prints one report with a per-check verdict and the file that causes each failure.
  NOT for: repairing anything (this never writes to the data home), collecting, or judging code quality.

requiresProject: true
mutates_checkout: false
tags: [data, integrity, soccer]

# ─────────────────────────────────────────────────────────────────────────────
# FAIL CLOSED. Every check in this file must alarm when it cannot run.
#
# The convention, inherited from ground-truth.yml's cache-provenance check:
# after the measurements run, assert every captured variable is non-empty; if
# any is empty, print an explicit `CHECK DID NOT RUN` alarm naming the empty
# captures and exit 0. The failure headline is deliberately NOT the measurement
# headline with blanks in it — a reader must be able to tell "the measurement
# failed" from "the data is bad" at a glance. A missing directory is not an
# empty one, and an unreadable directory is not an empty one either.
#
# `${!v}` is bash indirect expansion; Keelson runs bash nodes under bash (3.2 on
# this machine), where it is supported. Do not port these loops to sh.
#
# This workflow runs with cwd = the consumer data home (e.g. soccer-data), so
# data paths are cwd-relative: the season JSON layers data/fixtures and
# data/stats, the collect gap ledger data/errors, and the membership reference
# data/reference/membership.json. The JSON data home is the system of record;
# the checks that measured the retired Postgres/parquet lineage were removed
# with it.
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  # ── 1. Collect gaps ─────────────────────────────────────────────────────
  - id: collect-gaps
    timeout: 60000
    bash: |
      set -uo pipefail
      D=data/errors
      # This node reads the filesystem, so it fails open by a different mechanism
      # than a query-based check: N can never be empty. The old else-branch set
      # N=0 on a missing directory, which renders identically to a genuinely
      # clean errors/ — so an unexpected cwd, or a moved directory, read as
      # "clean". A missing directory is not an empty one.
      if [ ! -d "$D" ]; then
        printf '{"check":"collect-gaps","verdict":"alarm","headline":"CHECK DID NOT RUN — no directory at %s (cwd %s). A missing directory is not an empty one.","cause":"the path is relative to the data home root, so either this node ran from an unexpected working directory or data/errors was moved, renamed or deleted"}\n' "$D" "$(pwd)"
        exit 0
      fi
      # The -d test above is necessary but NOT sufficient. A directory that exists but
      # cannot be listed sends find to stderr, which is discarded, and leaves the pipe
      # empty — so the count reads 0 and the node would report a clean ledger with
      # verdict ok. An UNREADABLE directory is no more an empty one than a missing one
      # is. Listing entries needs r; descending into them needs x; find needs both.
      if [ ! -r "$D" ] || [ ! -x "$D" ]; then
        printf '{"check":"collect-gaps","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not both readable and searchable by this user (cwd %s). find prints nothing and the count reads 0, which is indistinguishable from a clean errors/.","cause":"permissions or ownership on the directory changed, or the node ran as a user that cannot list it — check with ls -ld on the path. An unreadable directory is not an empty one."}\n' "$D" "$(pwd)"
        exit 0
      fi
      # One walk, and branch on find EXIT STATUS rather than on the count. The top-level
      # permission test above cannot see a subdirectory under data/errors that find
      # cannot descend into; that yields a partial walk, an undercount, and no signal at
      # all in the count itself. A count taken from a failed walk is not a measurement.
      FLIST=$(find "$D" -name '*.json' 2>/dev/null)
      FRC=$?
      if [ "$FRC" -ne 0 ]; then
        printf '{"check":"collect-gaps","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s while walking %s (cwd %s), so the tree was only partly read and any count from it is an undercount, not a measurement of zero.","cause":"find stderr is discarded here — re-run the same find by hand from the data home root to see which subdirectory it could not descend into, typically a permissions change somewhere under data/errors"}\n' "$FRC" "$D" "$(pwd)"
        exit 0
      fi
      # One line per matched file. grep -c . also counts a final line with no
      # trailing newline, which is what command substitution leaves behind.
      N=$(printf '%s' "$FLIST" | grep -c . | tr -d ' ')
      OLDEST=$(printf '%s' "$FLIST" | sort | head -1 | sed 's|.*/||')
      # OLDEST is deliberately NOT asserted: it is legitimately empty exactly when
      # N=0, which is the genuine clean state. N is asserted anyway.
      if [ -z "$N" ]; then
        printf '{"check":"collect-gaps","verdict":"alarm","headline":"CHECK DID NOT RUN — could not count *.json under %s. That is a failed count, not a measurement of zero.","cause":"find succeeded but grep or tr produced no output for a directory that exists and is readable — re-run the count by hand"}\n' "$D"
        exit 0
      fi
      V=ok; [ "$N" -gt 0 ] && V=warn
      printf '{"check":"collect-gaps","verdict":"%s","headline":"%s collect gap ledger file(s) in data/errors (oldest %s)","cause":"each collect-board-{season}-{gender}-{conference}.json names the layers a collect run could not prove, with the per-programme reason — the coverage manifest carries the same gaps as cells, and the next collect of that season rewrites the file"}\n' \
        "$V" "$N" "${OLDEST:-none}"

  # ── 2. Goal attribution — scoreboard vs stats layer ─────────────────────
  - id: goal-attribution
    timeout: 60000
    bash: |
      set -uo pipefail
      # For every collected programme in every conference-season cell the data
      # home holds, compare the scoreline reading of its goals (fixtures layer:
      # its side of every final scoreline, either team slot) against the
      # attributed reading (stats layer: its players' goals summed). The two
      # can diverge HONESTLY — an own goal or unattributed scorer inflates the
      # scoreboard side, a stats page that lags or leads the schedule page
      # moves either — so a divergence is reported with both figures, named,
      # never dropped, and never escalated past warn. Alarm is reserved for
      # the check itself failing to run, per the file's rule.
      # EXHIBITIONS ARE NOT SCOREBOARD GOALS. Season statistics tables never
      # attribute exhibition goals to players, so a scored friendly in the
      # sum is a guaranteed false divergence, not a finding: Saint Mary's
      # 2026 read 5 scoreboard v 0 attributed until its two scored friendlies
      # (one against a club side) were excluded, after which both readings
      # agree at 0. match_type=="exhibition" fixtures are therefore excluded
      # from the sums and counted, like scoreless finals — excluded, never
      # hidden. A fixture without match_type is a regular match and counts.
      # Conference, gender, and season all come from the files on disk — the
      # sweep covers whatever has been collected, nothing is hardcoded.
      FD=data/fixtures
      SD=data/stats
      # Same rule as collect-gaps: a missing or unreadable layer directory is
      # CHECK DID NOT RUN, never a clean sweep of zero cells.
      for D in "$FD" "$SD"; do
        if [ ! -d "$D" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — no directory at %s (cwd %s). A missing layer directory is not an empty one.","cause":"the path is relative to the data home root, so either this node ran from an unexpected working directory or the season layer was moved, renamed, or never collected"}\n' "$D" "$(pwd)"
          exit 0
        fi
        if [ ! -r "$D" ] || [ ! -x "$D" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not both readable and searchable by this user (cwd %s), so its season files cannot be listed.","cause":"permissions or ownership on the directory changed — check with ls -ld. An unreadable directory is not an empty one."}\n' "$D" "$(pwd)"
          exit 0
        fi
      done
      FLIST=$(find "$FD" -maxdepth 1 -name '*.json' 2>/dev/null | sort); FRC=$?
      if [ "$FRC" -ne 0 ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s listing %s (cwd %s), so the season files were only partly listed and any sweep over them is an undercount, not a measurement.","cause":"find stderr is discarded here — re-run the same find by hand from the data home root to see what it could not read"}\n' "$FRC" "$FD" "$(pwd)"
        exit 0
      fi
      if [ -z "$FLIST" ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s holds no season files (cwd %s), so there is nothing to compare. A fixtures layer with nothing in it cannot be measured, only collected.","cause":"either this node ran outside a collected data home or the fixtures layer was moved or renamed — list the directory by hand"}\n' "$FD" "$(pwd)"
        exit 0
      fi
      # One jq pass per cell. META carries the cell labels and two exclusion
      # counts, both named rather than silent: regular finals published
      # without a scoreline (at least one modern theme publishes completion
      # without a result) and exhibition finals that DO carry a scoreline
      # (the goals the stats layer will rightly never attribute). CMP carries
      # one row per collected programme: scoreboard goals-for summed over
      # non-exhibition final fixtures that carry BOTH scores, from either
      # team slot, against that programme's summed player goals from the
      # stats layer — "absent" when the stats layer has no entry for the
      # programme at all. EXTRA names a stats-layer team the fixtures layer
      # does not list as a programme, so neither direction of layer mismatch
      # is dropped.
      JQ='
        .season as $y | .gender as $g | .conference as $c
        | (.programmes | map(.slug)) as $ps
        | ($st[0].teams // {}) as $tm
        | ([.fixtures[] | select(.status=="final" and .match_type!="exhibition" and (((.home_score|type)!="number") or ((.away_score|type)!="number")))] | length) as $noscore
        | ([.fixtures[] | select(.status=="final" and .match_type=="exhibition" and ((.home_score|type)=="number") and ((.away_score|type)=="number"))] | length) as $exh
        | ( ["META\t\($y)\t\($g)\t\($c)\t\($ps|length)\t\($noscore)\t\($exh)"]
          + [ $ps[] as $p
              | ([ .fixtures[]
                   | select(.status=="final" and .match_type!="exhibition" and ((.home_score|type)=="number") and ((.away_score|type)=="number"))
                   | select(.home==$p or .away==$p)
                   | (if .home==$p then .home_score else .away_score end) ] | add // 0) as $gf
              | (if ($tm|has($p)) then ([ $tm[$p].players[]?.goals // 0 ] | add // 0 | tostring) else "absent" end) as $att
              | "CMP\t\($y)\t\($g)\t\($c)/\($p)\t\($gf)\t\($att)" ]
          + [ ($tm | keys[]) as $p | select(($ps | index($p)) | not)
              | "EXTRA\t\($y)\t\($g)\t\($c)/\($p)\t\([ $tm[$p].players[]?.goals // 0 ] | add // 0)" ]
          )[]'
      ROWS_ALL=""
      CELLS=0
      UNPAIRED=0
      UNPAIREDNAMES=""
      MAXSEASON=0
      NOSCORE=0
      EXHIBITIONS=0
      # Word-splitting FLIST on whitespace is safe here: season files are named
      # {season}-{gender}-{conference}.json by the collector, never with spaces.
      for F in $FLIST; do
        B=$(basename "$F")
        S="$SD/$B"
        # A fixtures cell with no stats file is a NAMED finding, not a silent
        # skip and not an alarm: a freshly collected season legitimately
        # precedes its stats publication, and the coverage manifest already
        # owns that gap.
        if [ ! -f "$S" ]; then
          UNPAIRED=$((UNPAIRED+1))
          UNPAIREDNAMES="$UNPAIREDNAMES ${B%.json}"
          continue
        fi
        ROWS=$(jq -r --slurpfile st "$S" "$JQ" "$F" 2>/dev/null); RC=$?
        META=$(printf '%s\n' "$ROWS" | awk -F '\t' '$1=="META" && NF==7 {print; exit}')
        if [ "$RC" -ne 0 ] || [ -z "$META" ]; then
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — jq exited %s reading %s against %s, so no cell was measured. A season file that cannot be read is not a clean one.","cause":"jq stderr is discarded here — re-run it by hand against the pair to see the parse error: a malformed season file, or a layer shape this check does not know."}\n' "$RC" "$F" "$S"
          exit 0
        fi
        Y=$(printf '%s' "$META" | cut -f2)
        NS=$(printf '%s' "$META" | cut -f6)
        EX=$(printf '%s' "$META" | cut -f7)
        case "$Y$NS$EX" in *[!0-9]*|"")
          printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — %s carries a non-numeric season, scoreless-final, or exhibition count, so the sweep cannot be keyed. A cell that cannot be keyed is not a measured one.","cause":"the season field must be an integer year — inspect the file by hand"}\n' "$F"
          exit 0
        ;; esac
        [ "$Y" -gt "$MAXSEASON" ] && MAXSEASON=$Y
        NOSCORE=$((NOSCORE+NS))
        EXHIBITIONS=$((EXHIBITIONS+EX))
        CELLS=$((CELLS+1))
        ROWS_ALL="$ROWS_ALL$ROWS
      "
      done
      if [ "$CELLS" -eq 0 ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — none of the fixtures cells has a stats file (%s), so not one comparison could be made. A comparison that cannot be evaluated is not a pass.","cause":"the stats layer was never collected into this home, or lives under a different naming — list data/stats by hand"}\n' "${UNPAIREDNAMES# }"
        exit 0
      fi
      # Every divergent programme-season, named with both figures — the whole
      # point of the check, so the full table precedes the one-line verdict the
      # way the conference audit prints its summary before its payload. The
      # report node reads only the final JSON line; the table stays in this
      # node's output, named, not dropped.
      TABLE=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '
        $1=="CMP" && $6!="absent" && ($5+0)!=($6+0) { printf "%s %s %s scoreboard %s attributed %s\n",$2,$3,$4,$5,$6 }
        $1=="CMP" && $6=="absent" && ($5+0)>0 { printf "%s %s %s scoreboard %s attributed none (no stats entry)\n",$2,$3,$4,$5 }
        $1=="EXTRA" { printf "%s %s %s stats layer only: %s attributed goals, no fixtures programme\n",$2,$3,$4,$5 }
      ' | sort)
      COMPARED=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP"{n++} END{print n+0}')
      DIVN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($5+0)!=($6+0){n++} END{print n+0}')
      OVERN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($5+0)>($6+0){n++} END{print n+0}')
      UNDERN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6!="absent" && ($6+0)>($5+0){n++} END{print n+0}')
      NOG=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)>0{n++} END{print n+0}')
      NO0=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)==0{n++} END{print n+0}')
      NO0NAMES=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="CMP" && $6=="absent" && ($5+0)==0 { printf "%s%s %s %s",sep,$2,$3,$4; sep=", " }')
      EXTRAN=$(printf '%s' "$ROWS_ALL" | awk -F '\t' '$1=="EXTRA"{n++} END{print n+0}')
      # The newest season is the live one — its divergences travel in the
      # headline in full, because collect time is when a lagging layer is
      # cheapest to chase. The archive's divergences are endemic (own goals
      # were never attributed historically) and live in the table above.
      CUR=$(printf '%s' "$ROWS_ALL" | awk -F '\t' -v m="$MAXSEASON" '
        $1=="CMP" && $2==m && ( ($6!="absent" && ($5+0)!=($6+0)) || ($6=="absent" && ($5+0)>0) ) {
          a=$6; if (a=="absent") a="none"
          printf "%s%s %s %sv%s", sep, $3, $4, $5, a; sep="; "
        }')
      MISSING=
      for v in COMPARED DIVN OVERN UNDERN NOG NO0 EXTRAN; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"goal-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — no count for:%s. Those are failed aggregations, not measurements of zero.","cause":"awk produced no output over rows jq already validated — re-run the sweep by hand from the data home root"}\n' "$MISSING"
        exit 0
      fi
      V=ok
      { [ "$DIVN" -gt 0 ] || [ "$NOG" -gt 0 ] || [ "$EXTRAN" -gt 0 ] || [ "$UNPAIRED" -gt 0 ]; } && V=warn
      [ -n "$TABLE" ] && printf '%s\n' "$TABLE"
      [ -n "$CUR" ] || CUR="every programme agrees"
      UP="none"
      [ -n "$UNPAIREDNAMES" ] && UP="${UNPAIREDNAMES# }"
      NO0OUT="none"
      [ -n "$NO0NAMES" ] && NO0OUT="$NO0NAMES"
      printf '{"check":"goal-attribution","verdict":"%s","headline":"%s of %s programme-seasons diverge between scoreboard and attributed goals across %s conference-season cells — %s scoreboard ahead, %s stats ahead, %s with goals but no stats entry, each named above; season %s: %s; %s scoreless finals and %s scored exhibitions excluded from scoreboard totals; %s programmes absent from stats with 0 scoreboard goals (%s); %s stats-only programmes; %s cells with no stats file (%s)","cause":"both layers can be honest — a scoreboard goal nobody was credited with (own goal, unattributed scorer) or a stats page that lags or leads the schedule page by a match — so a divergence is a collector-domain signal to re-collect the lagging layer, never proof of corruption. Exhibition scorelines are excluded before summing: season statistics tables never attribute exhibition goals, so a scored friendly in the sum is a guaranteed false divergence. Consumer surfaces already verify against either reading; this names the gap at collect time."}\n' \
        "$V" "$((DIVN + NOG))" "$COMPARED" "$CELLS" "$OVERN" "$UNDERN" "$NOG" "$MAXSEASON" "$CUR" "$NOSCORE" "$EXHIBITIONS" "$NO0" "$NO0OUT" "$EXTRAN" "$UNPAIRED" "$UP"

  # ── 3. Exhibition wording vs match_type flag ────────────────────────────
  - id: exhibition-markers
    timeout: 60000
    bash: |
      set -uo pipefail
      # A schedule page can say a game is a friendly/exhibition in text the
      # collector stores while the parsed match_type flag stays unset —
      # measured: a venue of "Tulsa, Okla. Friendly" rode in with no
      # match_type, so a friendly against a D1 side counted as a competitive
      # silent final and goal-attribution excluded nothing. Text and flag
      # must not disagree silently: every fixture whose stored venue or
      # opponent slugs carry the wording while match_type is unset is named,
      # verdict warn. The regex is the parser's own — \bexhib,
      # \bfriendl(y|ies)\b or \bscrimmage\b, case-insensitive, word-bounded
      # so a school named Friends never matches. The parser's two other
      # tells (bead tl-11p7) are read the same way: an opponent slug that
      # says alumni-game, alumni-match or intrasquad (slugs only, never the
      # venue, where "Alumni Field" is a real ground), and a row whose home
      # and away are one programme. A fixture that DOES carry match_type is
      # consistent by definition and is not reported. Nothing here names a
      # conference: the sweep covers whatever season files the data home
      # holds. Alarm is reserved for the check itself failing to run, per
      # the file's rule.
      FD=data/fixtures
      if [ ! -d "$FD" ]; then
        printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — no directory at %s (cwd %s). A missing layer directory is not an empty one.","cause":"the path is relative to the data home root, so either this node ran from an unexpected working directory or the fixtures layer was moved, renamed, or never collected"}\n' "$FD" "$(pwd)"
        exit 0
      fi
      if [ ! -r "$FD" ] || [ ! -x "$FD" ]; then
        printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not both readable and searchable by this user (cwd %s), so its season files cannot be listed.","cause":"permissions or ownership on the directory changed — check with ls -ld. An unreadable directory is not an empty one."}\n' "$FD" "$(pwd)"
        exit 0
      fi
      FLIST=$(find "$FD" -maxdepth 1 -name '*.json' 2>/dev/null | sort); FRC=$?
      if [ "$FRC" -ne 0 ]; then
        printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s listing %s (cwd %s), so the season files were only partly listed and any sweep over them is an undercount, not a measurement.","cause":"find stderr is discarded here — re-run the same find by hand from the data home root to see what it could not read"}\n' "$FRC" "$FD" "$(pwd)"
        exit 0
      fi
      if [ -z "$FLIST" ]; then
        printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — %s holds no season files (cwd %s), so there is nothing to sweep. A fixtures layer with nothing in it cannot be measured, only collected.","cause":"either this node ran outside a collected data home or the fixtures layer was moved or renamed — list the directory by hand"}\n' "$FD" "$(pwd)"
        exit 0
      fi
      # One jq pass per cell. TOTAL counts every fixture swept so the
      # headline can say how much was measured; ROW names each offender with
      # the text that tripped it.
      JQ='
        def marked: test("\\bexhib|\\bfriendl(y|ies)\\b|\\bscrimmage\\b"; "i");
        def non_team: test("\\balumni[ -](game|match)\\b|\\bintrasquad\\b"; "i");
        ( ["TOTAL\t\(.fixtures | length)"]
        + [ .fixtures[]
            | select(has("match_type") | not)
            | select(
                ([.venue // "", .home // "", .away // ""] | any(marked))
                or ([.home // "", .away // ""] | any(non_team))
                or ((.home // "") != "" and .home == .away)
              )
            | "ROW\t\(.id)\t\(.date)\t\(.home) v \(.away)\t\(.venue // "(no venue)")" ]
        )[]'
      CELLS=0
      TOTAL=0
      TABLE_ALL=""
      # Word-splitting FLIST on whitespace is safe here: season files are named
      # {season}-{gender}-{conference}.json by the collector, never with spaces.
      for F in $FLIST; do
        ROWS=$(jq -r "$JQ" "$F" 2>/dev/null); RC=$?
        T=$(printf '%s\n' "$ROWS" | awk -F '\t' '$1=="TOTAL" && NF==2 {print $2; exit}')
        if [ "$RC" -ne 0 ] || [ -z "$T" ]; then
          printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — jq exited %s reading %s, so no fixture was swept. A season file that cannot be read is not a clean one.","cause":"jq stderr is discarded here — re-run it by hand against the file to see the parse error: a malformed season file, or a fixtures shape this check does not know"}\n' "$RC" "$F"
          exit 0
        fi
        case "$T" in *[!0-9]*|"")
          printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — %s yielded a non-numeric fixture count, so the sweep cannot be totalled. A cell that cannot be counted is not a measured one.","cause":"the fixtures field must be an array — inspect the file by hand"}\n' "$F"
          exit 0
        ;; esac
        TOTAL=$((TOTAL+T))
        CELLS=$((CELLS+1))
        CELL=${F##*/}; CELL=${CELL%.json}
        ROWS_CELL=$(printf '%s\n' "$ROWS" | awk -F '\t' -v c="$CELL" '$1=="ROW" && NF==5 {printf "%s %s %s %s venue: %s\n", c, $3, $2, $4, $5}')
        [ -n "$ROWS_CELL" ] && TABLE_ALL="$TABLE_ALL$ROWS_CELL
      "
      done
      N=$(printf '%s' "$TABLE_ALL" | grep -c . | tr -d ' ')
      if [ -z "$N" ]; then
        printf '{"check":"exhibition-markers","verdict":"alarm","headline":"CHECK DID NOT RUN — could not count the named fixtures after a sweep that read every cell. That is a failed count, not a measurement of zero.","cause":"grep or tr produced no output over rows jq already validated — re-run the sweep by hand from the data home root"}\n'
        exit 0
      fi
      # Every offender, named with its season file — the whole point of the
      # check, printed above the one-line verdict the way goal-attribution
      # prints its table. The report node reads only the final JSON line.
      [ -n "$TABLE_ALL" ] && printf '%s' "$TABLE_ALL" | grep . | sort
      V=ok; [ "$N" -gt 0 ] && V=warn
      printf '{"check":"exhibition-markers","verdict":"%s","headline":"%s of %s fixtures across %s season files carry friendly/exhibition wording in stored text (venue or opponent) while match_type is unset — each named above","cause":"the schedule page called the game a friendly/exhibition in text the collector stored, but the parser never stamped match_type, so every consumer counts it as competitive and goal-attribution excludes nothing. Fix or re-collect: the next collect of the named season re-parses the page, and the parser reads the wording from both the opponent title and the location text. The internal identifier stays match_type exhibition; only reader copy says friendly."}\n' \
        "$V" "$N" "$TOTAL" "$CELLS"

  # ── 4. Membership reference sync ────────────────────────────────────────
  - id: membership-sync
    timeout: 60000
    bash: |
      set -uo pipefail
      # The rib's packaged data/reference/membership.json is the SOURCE OF
      # RECORD for conference membership: version-controlled, reviewed, read
      # by the rib's src/membership.ts (and so by the collect cadence's
      # programme resolution) and preferred by the pipeline's
      # src/membership.py. The data home's data/reference/membership.json is
      # the deployment artifact collect mirrors from it
      # (pipeline/scripts/collect_board.py, sync_membership_reference). A
      # divergence no longer silently steers resolution — loaders prefer the
      # packaged copy — but it does publish a stale membership record to
      # anything reading the data repo's files directly, so it is reported
      # as WARN with the exact canonical diff printed above the verdict
      # line. Alarm is reserved for this check itself not running, per the
      # file's rule. Nothing here names a conference: every figure is
      # measured from the two documents.
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PKG=""
      [ -n "${TOUCHLINE_PIPELINE_DIR:-}" ] && PKG=$(dirname "$TOUCHLINE_PIPELINE_DIR")
      if [ ! -f "${PKG:-/nonexistent}/data/reference/membership.json" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PKG="$PD"
      fi
      [ -f "${PKG:-/nonexistent}/data/reference/membership.json" ] || PKG="$HOME/.keelson/node_modules/@keelson/rib-touchline"
      SRC="$PKG/data/reference/membership.json"
      DST=data/reference/membership.json
      if [ ! -f "$SRC" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — no packaged membership.json resolvable (tried the parent of TOUCHLINE_PIPELINE_DIR, packageDir in %s, and the installed rib), so there is no source of record to compare the data home against.","cause":"install or link the touchline rib, or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory — the source of record lives beside it at <package>/data/reference/membership.json."}\n' "$CFG"
        exit 0
      fi
      # Canonicalize BOTH sides (jq -S) so key order and whitespace never
      # count as divergence — only the data can differ.
      SRCC=$(jq -S . "$SRC" 2>/dev/null); SRCRC=$?
      if [ "$SRCRC" -ne 0 ] || [ -z "${SRCC:-}" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — the packaged source of record %s is not parseable JSON (jq exited %s), so no comparison can be made. An unreadable authority is not a clean one.","cause":"jq stderr is discarded here — run jq -S . on the file by hand; the rib install at that path is broken and must be fixed before this check means anything."}\n' "$SRC" "$SRCRC"
        exit 0
      fi
      if [ ! -f "$DST" ]; then
        printf '{"check":"membership-sync","verdict":"warn","headline":"data home carries no membership.json at %s (cwd %s) — pipeline loaders fall back to the packaged source of record, so resolution stays consistent, but the data repo publishes no membership record at all.","cause":"the next collect run mirrors the packaged copy into the data home; to install it now, from the data home root: cp %s %s"}\n' "$DST" "$(pwd)" "$SRC" "$DST"
        exit 0
      fi
      if [ ! -r "$DST" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — %s exists but is not readable by this user (cwd %s), so the data home side cannot be compared. An unreadable file is not a synced one.","cause":"permissions or ownership on the file changed — check with ls -l on the path."}\n' "$DST" "$(pwd)"
        exit 0
      fi
      DSTC=$(jq -S . "$DST" 2>/dev/null); DSTRC=$?
      if [ "$DSTRC" -ne 0 ] || [ -z "${DSTC:-}" ]; then
        printf '{"check":"membership-sync","verdict":"warn","headline":"data home membership.json at %s is not parseable JSON (jq exited %s) — it cannot match the packaged source of record, and anything reading the data repo directly gets a corrupt membership record.","cause":"the file was hand-edited or truncated; the next collect run mirrors the packaged copy over it, or install it now from the data home root: cp %s %s"}\n' "$DST" "$DSTRC" "$SRC" "$DST"
        exit 0
      fi
      TMPD=$(mktemp -d "${TMPDIR:-/tmp}/membership-sync.XXXXXX" 2>/dev/null)
      if [ -z "${TMPD:-}" ] || [ ! -d "$TMPD" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — mktemp could not create a scratch directory under %s, so the canonicalized documents cannot be diffed.","cause":"TMPDIR is unwritable or full — fix that and re-run."}\n' "${TMPDIR:-/tmp}"
        exit 0
      fi
      trap 'rm -rf "$TMPD"' EXIT
      printf '%s\n' "$SRCC" >"$TMPD/packaged"
      printf '%s\n' "$DSTC" >"$TMPD/data-home"
      # Headline figures, measured from the canonical forms — never asserted
      # flat. jq already parsed both documents above, so an empty capture
      # here is an extraction failure, not data.
      PPROG=$(printf '%s\n' "$SRCC" | jq -r '.memberships // {} | length' 2>/dev/null)
      DPROG=$(printf '%s\n' "$DSTC" | jq -r '.memberships // {} | length' 2>/dev/null)
      PWIN=$(printf '%s\n' "$SRCC" | jq -r '[.memberships // {} | .[] | .[] | length] | add // 0' 2>/dev/null)
      DWIN=$(printf '%s\n' "$DSTC" | jq -r '[.memberships // {} | .[] | .[] | length] | add // 0' 2>/dev/null)
      PCONF=$(printf '%s\n' "$SRCC" | jq -r '.conferences // [] | join("/")' 2>/dev/null)
      DCONF=$(printf '%s\n' "$DSTC" | jq -r '.conferences // [] | join("/")' 2>/dev/null)
      MISSING=
      for v in PPROG DPROG PWIN DWIN PCONF DCONF; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done
      if [ -n "$MISSING" ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — jq returned nothing for:%s over documents it already parsed, so the comparison cannot be summarized. Those are failed extractions, not measurements of zero.","cause":"re-run jq -S over both files by hand: %s and %s."}\n' "$MISSING" "$SRC" "$DST"
        exit 0
      fi
      DIFF=$(diff -u -L "packaged $SRC (canonical)" -L "data-home $DST (canonical)" "$TMPD/packaged" "$TMPD/data-home" 2>/dev/null); DRC=$?
      if [ "$DRC" -gt 1 ]; then
        printf '{"check":"membership-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — diff exited %s comparing the canonicalized documents, so agreement was never measured. A comparison that cannot be evaluated is not a pass.","cause":"diff stderr is discarded here — run jq -S on both files and diff them by hand: %s vs %s."}\n' "$DRC" "$SRC" "$DST"
        exit 0
      fi
      if [ "$DRC" -eq 0 ]; then
        BYTES="byte-identical"
        cmp -s "$SRC" "$DST" 2>/dev/null || BYTES="formatting differs only, canonical data equal (the next collect run rewrites the mirror byte-for-byte)"
        printf '{"check":"membership-sync","verdict":"ok","headline":"data home membership.json matches the packaged source of record — %s programmes, %s windows, conferences %s; %s","cause":""}\n' "$PPROG" "$PWIN" "$PCONF" "$BYTES"
        exit 0
      fi
      # Divergence: the exact canonical diff precedes the one-line verdict,
      # the way goal-attribution prints its table — named in full, never
      # dropped. The report node reads only the final JSON line.
      # `^-[^-]` / `^+[^+]` count body lines while skipping the ---/+++
      # headers; jq -S output never starts a content line with - or +, and
      # never emits an empty line, so the counts are exact.
      ONLYSRC=$(printf '%s\n' "$DIFF" | grep -c '^-[^-]')
      ONLYDST=$(printf '%s\n' "$DIFF" | grep -c '^+[^+]')
      printf 'membership-sync: canonicalized diff, packaged source of record (-) vs data home copy (+):\n'
      printf '%s\n' "$DIFF"
      printf '{"check":"membership-sync","verdict":"warn","headline":"membership.json DIVERGES from the packaged source of record: %s canonical lines only in the packaged record, %s only in the data home copy — packaged holds %s programmes, %s windows, conferences %s; the data home copy holds %s programmes, %s windows, conferences %s. The exact diff precedes this line.","cause":"the data home copy is a stale deployment artifact. Pipeline loaders prefer the packaged copy, so resolution is already consistent — but the data repo is publishing a stale membership record to anything reading its files directly. The next collect run mirrors the packaged copy over it, or install now from the data home root: cp %s %s"}\n' \
        "$ONLYSRC" "$ONLYDST" "$PPROG" "$PWIN" "$PCONF" "$DPROG" "$DWIN" "$DCONF" "$SRC" "$DST"

  # ── 5. Cross-file twins ─────────────────────────────────────────────────
  - id: programmes-sync
    timeout: 60000
    bash: |
      set -uo pipefail
      # The rib's packaged data/reference/programmes.json (touchline.programmes/2,
      # built from schools.toml and the pinned Gazetteer, reviewed in the PR
      # that changes it) is the SOURCE OF RECORD for programme identity —
      # nickname, town, point, with provenance. The data home's copy is the
      # deployment artifact collect mirrors from it (pipeline/scripts/
      # collect_board.py, sync_programmes_reference). A divergence publishes a
      # stale identity record to the site, which reads the mirrored file, so
      # it is WARN with the canonical diff; alarm only when this check itself
      # cannot run. Same rules as membership-sync, same resolution of the rib.
      CFG="$HOME/.keelson/rib-touchline/config.json"
      PKG=""
      [ -n "${TOUCHLINE_PIPELINE_DIR:-}" ] && PKG=$(dirname "$TOUCHLINE_PIPELINE_DIR")
      if [ ! -f "${PKG:-/nonexistent}/data/reference/programmes.json" ] && [ -f "$CFG" ]; then
        PD=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PD" ] && PKG="$PD"
      fi
      [ -f "${PKG:-/nonexistent}/data/reference/programmes.json" ] || PKG="$HOME/.keelson/node_modules/@keelson/rib-touchline"
      SRC="$PKG/data/reference/programmes.json"
      DST="data/reference/programmes.json"
      if [ ! -f "$SRC" ]; then
        printf '{"check":"programmes-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — no packaged programmes.json resolvable (tried the parent of TOUCHLINE_PIPELINE_DIR, packageDir in %s, and the installed rib), so there is no source of record to compare the data home against.","cause":"install or link the touchline rib at a version that builds data/reference/programmes.json (tl-891), or export TOUCHLINE_PIPELINE_DIR pointing at its pipeline/ directory."}\n' "$CFG"
        exit 0
      fi
      SRCC=$(jq -S . "$SRC" 2>/dev/null); SRCRC=$?
      if [ "$SRCRC" -ne 0 ] || [ -z "${SRCC:-}" ]; then
        printf '{"check":"programmes-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — the packaged source of record %s is not parseable JSON (jq exited %s), so no comparison can be made.","cause":"run jq -S . on the file by hand; the rib install at that path is broken and must be fixed before this check means anything."}\n' "$SRC" "$SRCRC"
        exit 0
      fi
      if [ ! -f "$DST" ]; then
        printf '{"check":"programmes-sync","verdict":"warn","headline":"data home carries no programmes.json at %s (cwd %s) — the site has no identity record to read from this data repo.","cause":"the next collect run mirrors the packaged copy into the data home; to install it now, from the data home root: cp %s %s"}\n' "$DST" "$(pwd)" "$SRC" "$DST"
        exit 0
      fi
      DSTC=$(jq -S . "$DST" 2>/dev/null); DSTRC=$?
      if [ "$DSTRC" -ne 0 ] || [ -z "${DSTC:-}" ]; then
        printf '{"check":"programmes-sync","verdict":"warn","headline":"data home programmes.json at %s is not parseable JSON (jq exited %s) — it cannot match the packaged source of record.","cause":"the file was hand-edited or truncated; the next collect run mirrors the packaged copy over it, or install it now: cp %s %s"}\n' "$DST" "$DSTRC" "$SRC" "$DST"
        exit 0
      fi
      PROWS=$(printf '%s\n' "$SRCC" | jq -r '.programmes // {} | length' 2>/dev/null)
      DROWS=$(printf '%s\n' "$DSTC" | jq -r '.programmes // {} | length' 2>/dev/null)
      PSCHEMA=$(printf '%s\n' "$SRCC" | jq -r '.schema // ""' 2>/dev/null)
      if [ -z "${PROWS:-}" ] || [ -z "${DROWS:-}" ]; then
        printf '{"check":"programmes-sync","verdict":"alarm","headline":"CHECK DID NOT RUN — jq returned nothing for the row counts over documents it already parsed, so the comparison cannot be summarized.","cause":"re-run jq -S over both files by hand: %s and %s."}\n' "$SRC" "$DST"
        exit 0
      fi
      if [ "$SRCC" = "$DSTC" ]; then
        BYTES="byte-identical"
        cmp -s "$SRC" "$DST" 2>/dev/null || BYTES="formatting differs only, canonical data equal"
        printf '{"check":"programmes-sync","verdict":"ok","headline":"data home programmes.json matches the packaged source of record — %s rows, %s; %s","cause":""}\n' "$PROWS" "$PSCHEMA" "$BYTES"
        exit 0
      fi
      TMPD=$(mktemp -d "${TMPDIR:-/tmp}/programmes-sync.XXXXXX" 2>/dev/null)
      if [ -n "${TMPD:-}" ] && [ -d "$TMPD" ]; then
        trap 'rm -rf "$TMPD"' EXIT
        printf '%s\n' "$SRCC" >"$TMPD/packaged"
        printf '%s\n' "$DSTC" >"$TMPD/data-home"
        diff -u -L "packaged $SRC (canonical)" -L "data-home $DST (canonical)" "$TMPD/packaged" "$TMPD/data-home" 2>/dev/null | head -80
      fi
      printf '{"check":"programmes-sync","verdict":"warn","headline":"data home programmes.json DIVERGES from the packaged source of record — packaged %s rows, data home %s rows; canonical diff printed above.","cause":"the site reads the mirrored file, so it is naming or placing programmes from a stale record. The next collect run mirrors the packaged copy over it, or install it now from the data home root: cp %s %s"}\n' "$PROWS" "$DROWS" "$SRC" "$DST"

  - id: twin-check
    timeout: 60000
    bash: |
      set -uo pipefail
      # A match between two programmes this data home follows is collected
      # twice, once from each side's own schedule page, into two season files
      # under two collector ids. The two records must agree on the unordered
      # score and the status: they are the same match, and the only thing
      # each side may legitimately differ on is which of them it calls home
      # (a neutral-site tournament). This is the check that would have gone
      # red on day one of tl-b39, when oceagles.com's winner-first result
      # strings stored twenty Oklahoma Christian results reversed while
      # every single-file check stayed green. Nothing here names a
      # conference: every fixture file in the data home is swept, and a
      # twin is any two rows on the same date between the same two slugs.
      # Alarm is reserved for the check itself failing to run.
      FD=data/fixtures
      if [ ! -d "$FD" ] || [ ! -r "$FD" ] || [ ! -x "$FD" ]; then
        printf '{"check":"twin-check","verdict":"alarm","headline":"CHECK DID NOT RUN — no readable directory at %s (cwd %s). A missing layer directory is not an empty one.","cause":"the path is relative to the data home root, so either this node ran from an unexpected working directory or the fixtures layer was moved, renamed, or never collected"}\n' "$FD" "$(pwd)"
        exit 0
      fi
      FLIST=$(find "$FD" -maxdepth 1 -name '*.json' 2>/dev/null | sort); FRC=$?
      if [ "$FRC" -ne 0 ] || [ -z "$FLIST" ]; then
        printf '{"check":"twin-check","verdict":"alarm","headline":"CHECK DID NOT RUN — find exited %s or listed no season files under %s (cwd %s), so no twin could be paired.","cause":"either this node ran outside a collected data home or the fixtures layer was moved or renamed — list the directory by hand"}\n' "$FRC" "$FD" "$(pwd)"
        exit 0
      fi
      # One row per fixture: the pair it belongs to (date + the two slugs in
      # an order neither side chose) and the side-free shape it claims (each
      # slug with its score, sorted, plus the status). Two rows in one pair
      # with two shapes are a disagreement.
      JQ='
        .fixtures[]
        | select(.status != "cancelled" and .status != "postponed")
        | . as $f
        | ([$f.home, $f.away] | sort | join(" v ")) as $pair
        | ([ "\($f.home)=\($f.home_score // "-")", "\($f.away)=\($f.away_score // "-")" ] | sort | join("|")) as $shape
        | "ROW\t\($f.date) \($pair)\t\($f.id)\t\($shape)|\($f.status // "-")\t\($f.home)"'
      ROWS=""
      FILES=0
      for F in $FLIST; do
        R=$(jq -r "$JQ" "$F" 2>/dev/null); RC=$?
        if [ "$RC" -ne 0 ]; then
          printf '{"check":"twin-check","verdict":"alarm","headline":"CHECK DID NOT RUN — jq exited %s reading %s, so no fixture was paired. A season file that cannot be read is not a clean one.","cause":"re-run the jq by hand against the file: a malformed season file, or a fixtures shape this check does not know"}\n' "$RC" "$F"
          exit 0
        fi
        CELL=${F##*/}; CELL=${CELL%.json}
        ROWS="$ROWS$(printf '%s\n' "$R" | awk -F '\t' -v c="$CELL" '$1=="ROW" && NF==5 {printf "%s\t%s\t%s\t%s\t%s\n", $2, c, $3, $4, $5}')
      "
        FILES=$((FILES+1))
      done
      # Group by pair; a pair with two or more rows is a twin; a twin whose
      # rows carry more than one shape is named, every row of it.
      TABLE=$(printf '%s' "$ROWS" | grep . | sort | awk -F '\t' '
        { n[$1]++; rows[$1] = rows[$1] $2 " " $3 " home=" $5 " " $4 "\n"; if (!($1 SUBSEP $4 in seen)) { seen[$1 SUBSEP $4]=1; shapes[$1]++ } }
        END { for (p in n) if (n[p] > 1) { twins++; if (shapes[p] > 1) { bad++; printf "%s\n%s", p, rows[p] } } printf "TWINS\t%d\tBAD\t%d\n", twins, bad }')
      TWINS=$(printf '%s\n' "$TABLE" | awk -F '\t' '$1=="TWINS" {print $2}')
      BAD=$(printf '%s\n' "$TABLE" | awk -F '\t' '$1=="TWINS" {print $4}')
      case "$TWINS$BAD" in *[!0-9]*|"")
        printf '{"check":"twin-check","verdict":"alarm","headline":"CHECK DID NOT RUN — the pairing produced no count (cwd %s). That is a failed count, not a measurement of zero.","cause":"awk produced no TWINS line over rows jq already validated — re-run the sweep by hand from the data home root"}\n' "$(pwd)"
        exit 0
      ;; esac
      # Every disagreeing twin, each of its records named with its season
      # file, id, the side it called home and the shape it claims.
      printf '%s\n' "$TABLE" | grep -v '^TWINS' | grep .
      V=ok; [ "$BAD" -gt 0 ] && V=warn
      printf '{"check":"twin-check","verdict":"%s","headline":"%s of %s twin matches (one match, two season files) disagree on the unordered score or status across %s season files — each named above","cause":"two collectors published different facts about one match. A score reversed on one side is the collector trusting a printed order over the W/L/T letter (tl-b39, fixed: re-collect the named season); a status split is one side not yet updated, or a tournament row one side never entered a result for. A disagreement on which side was home alone is NOT reported: that is a neutral site, and the site fold handles it."}\n' \
        "$V" "$BAD" "$TWINS" "$FILES"

  # ── 6. Box score v fixture, by team name ────────────────────────────────
  - id: box-vs-fixture
    timeout: 300000
    bash: |
      set -uo pipefail
      # The second source for a result. A fixture stores a scoreline against
      # two slugs; its box score stores the same scoreline against two
      # published team names. Resolving the names through the collector's
      # own identity rules and reading the score off the named side is a
      # copy of the fact made by a different parser from a different page —
      # which is what twin-check lacks for a match only one followed side
      # played, and what the stored home_index can never be, since it was
      # derived by matching the box to the fixture and so inherits the
      # fixture's mistakes (tl-b39: 33 reversed results, every single-file
      # check green). Lives in the pipeline (scripts/check_box_scores.py)
      # because name resolution is the pipeline's; this node resolves the
      # pipeline the way touchline-collect does and alarms rather than guess.
      KEELSON_HOME_DIR="${KEELSON_HOME:-$HOME/.keelson}"
      CFG="$KEELSON_HOME_DIR/rib-touchline/config.json"
      PD="${TOUCHLINE_PIPELINE_DIR:-}"
      if [ -z "$PD" ] && [ -f "$CFG" ]; then
        PKG=$(jq -r '.packageDir // empty' "$CFG" 2>/dev/null); [ -n "$PKG" ] && PD="$PKG/pipeline"
      fi
      [ -z "$PD" ] && PD="$KEELSON_HOME_DIR/node_modules/@keelson/rib-touchline/pipeline"
      if [ ! -f "$PD/pyproject.toml" ]; then
        printf '{"check":"box-vs-fixture","verdict":"alarm","headline":"CHECK DID NOT RUN — cannot resolve the Touchline pipeline (tried TOUCHLINE_PIPELINE_DIR, %s, the installed package path; last candidate %s).","cause":"the check is a pipeline script and needs the pipeline to run — see touchline-collect resolve-pipeline for the same lookup"}\n' "$CFG" "$PD"
        exit 0
      fi
      OUT=$(TOUCHLINE_DATA_DIR="$PWD" uv run --project "$PD" check-box-scores 2>&1); RC=$?
      LAST=$(printf '%s\n' "$OUT" | grep '^{' | tail -1)
      if [ "$RC" -ne 0 ] || [ -z "$LAST" ]; then
        printf '%s\n' "$OUT" | tail -20
        printf '{"check":"box-vs-fixture","verdict":"alarm","headline":"CHECK DID NOT RUN — check-box-scores exited %s without a verdict line (cwd %s); its last lines are printed above.","cause":"the pipeline could not run the check — a missing venv, an unreadable season file, or a shape the script does not know"}\n' "$RC" "$(pwd)"
        exit 0
      fi
      printf '%s\n' "$OUT"

  # ── Report ──────────────────────────────────────────────────────────────
  - id: report
    runtime: bun
    always_run: true
    trigger_rule: all_done
    depends_on: [collect-gaps, goal-attribution, exhibition-markers, membership-sync, programmes-sync, twin-check, box-vs-fixture]
    script: |
      const IDS = ['collect_gaps', 'goal_attribution', 'exhibition_markers', 'membership_sync', 'programmes_sync', 'twin_check', 'box_vs_fixture']
      const MARK = { ok: '[ OK   ]', warn: '[ WARN ]', alarm: '[ ALARM]' }
      const rows = []
      for (const id of IDS) {
        const raw = (process.env[`KEELSON_NODE_${id}_OUTPUT`] || '').trim()
        if (!raw) { rows.push({ check: id, verdict: 'alarm', headline: 'check did not run', cause: '' }); continue }
        try {
          rows.push(JSON.parse(raw.split('\n').filter(l => l.trim().startsWith('{')).pop()))
        } catch {
          rows.push({ check: id, verdict: 'alarm', headline: `unparseable output: ${raw.slice(0, 160)}`, cause: '' })
        }
      }
      const n = v => rows.filter(r => r.verdict === v).length
      const worst = n('alarm') ? 'ALARM' : n('warn') ? 'WARN' : 'CLEAR'

      console.log('')
      console.log('  TOUCHLINE — DATA INTEGRITY')
      console.log('  ' + '─'.repeat(72))
      console.log(`  ${worst}   ${n('ok')} clear · ${n('warn')} warn · ${n('alarm')} alarm   (${rows.length} checks)`)
      console.log('  ' + '─'.repeat(72))
      console.log('')
      for (const r of rows) {
        console.log(`  ${MARK[r.verdict] || '[  ?   ]'}  ${String(r.check).toUpperCase().replace(/_/g, '-')}`)
        console.log(`            ${r.headline}`)
        if (r.cause && r.verdict !== 'ok') console.log(`            └ ${r.cause}`)
        console.log('')
      }
      console.log('  ' + '─'.repeat(72))
      console.log('  Read-only. Repairs are tracked as tl-* beads (bd ready).')
      console.log('')
      console.log(JSON.stringify({ verdict: worst, clear: n('ok'), warn: n('warn'), alarm: n('alarm'), checks: rows }))
