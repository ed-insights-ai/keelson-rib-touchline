# Source of truth: the Peach Belt Conference's own women's soccer pages,
# read 2026-11-08: the live standings
# (peachbeltconference.org/standings.aspx?path=wsoc, "2026 Women's Soccer
# Standings", archive id 213) and the 2026 conference statistics
# (stats.aspx?path=wsoc&year=2026&conf=true). Both list the same ten
# programmes in one table; no division is printed, so no window carries
# one. Depth is 2026 only (the owner's ruling, no historical seasons), so
# every year-list is [2026].
#
# Not the men's set: the seven 2026 men's programmes all sponsor women's
# soccer, and three schools sponsor women's soccer only (Columbus State,
# Georgia College, USC Beaufort). Those three are new institutions to the
# rib; the other seven share their name, and so their slug, with the PBC
# men's stanzas above. Augusta is a member (member JSON on the standings
# page) on no women's table and gets no window or stanza.
