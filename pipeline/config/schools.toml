# CC MEN'S SOCCER - 14 programmes, backfill window 2022-2026
# ============================================================
# 28 windows in the depth on 15 slugs: the fifteenth is Shorter, whose
# stanza sits in the GSC section (GSC 2016-2023, then CC 2024-2026 as a
# second window on the shorter slug, the Trevecca shape). Young Harris's
# stanza is here and its 2022 season is a Peach Belt window on the
# young-harris slug; the collect resolves the conference per season.
#
# Source of truth: Conference Carolinas per-season records
# (conferencecarolinas.com conference statistics per year 2021-2025, plus
# the live standings for 2026, which has no records table yet), verified
# 2026-09-04. 12/13/14/15/15 members 2022-2026: Young Harris in from 2023
# (from the Peach Belt), Shorter from 2024 (from the GSC), Ferrum from 2025
# (from Division III). UNC Pembroke is a member with no men's soccer on any
# records page and has no stanza. Hosts came from the school links on the
# standings page.
#
# The first divisional conference in the rib. From 2023 the standings print
# three tables headed exactly "East", "Northwest" and "Southwest"
# (standings=125, 140, 160 and the live 2026 table); 2022 (standings=111)
# prints one table. Every member's 2022 window carries no division and its
# windows from 2023 carry one; North Greenville has three windows on one
# slug (2022 none, 2023 Southwest, 2024-2026 Northwest). The division sits
# on the window in data/reference/membership.json, never on a stanza.
