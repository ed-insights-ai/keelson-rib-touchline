# Ed Insights Platform — School Configuration
# Source of truth: GAC standings API (greatamericanconference.com/services/standings.ashx)
# Historical sources last verified: 2026-03-16
# All 13 enabled live schedule pages verified for 2026: 2026-08-09
#
# GAC Soccer Programs: 7 men's + 7 women's = 14 total
#
# scraper values:
#   statcrew       — static HTML (Harding only)
#   sidearm        — SideArm New (Nuxt3/Vue, SSR boxscore links)
#   sidearm_legacy — SideArm Legacy (KnockoutJS SPA, NOT YET IMPLEMENTED)
#
# live_scraper overrides the live-path collector and defaults to sidearm. Set it
# to sidearm_legacy/statcrew when the live site has no implemented collector;
# collection then files no-collector rather than a fetch error.
#
# abbreviation_resolves = false keeps an abbreviation display-only. The
# identity map is one table per gender across every stanza, last stanza
# wins, so a bare initialism two stanzas share ("BU", "RU", "SCSU") would
# silently re-point one school's spelling to another's; every stanza in
# such a set carries the flag and only its name and aliases resolve.
# check-membership refuses any spelling two stanzas of one gender claim.
#
# display_name carries the school's published name when it differs from `name`.
# `name` mints the institution slug (programme_slug in src/sidearm_live.py) that
# keys membership.json, canon.json and every coverage cell, so it stays
# ASCII-plain and never changes — not for punctuation ("St. Mary's") and not for
# a rename (Mississippi College → Mississippi Christian). display_name is what
# reader-facing surfaces show; leave it unset when `name` is already the
# published name. Cite the school's own site when setting it. display_name
# never resolves opponent text and never enters check-membership's identity
# check; a spelling that should resolve is an alias.
# Two enabled stanzas of one gender may not mint the same slug: the loader
# refuses the pair. A second institution of the same name qualifies `name`
# ("Lincoln Memorial" beside "Lincoln") and keeps its published name in
# display_name.
#
# data_status values:
#   verified   — URL confirmed live, sport confirmed present, scraper confirmed working
#   unverified — config set but not tested end-to-end
#   absent     — sport not present on this platform (different data source needed)

