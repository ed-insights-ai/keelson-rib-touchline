# 15 windows in the depth on 15 slugs: two of them, Fresno Pacific's
# 2022-2025 and Menlo's 2024-2025, sit on stanzas in the CCAA section (the
# schools moved to the CCAA for 2026, the Young Harris shape) and the
# collect resolves the conference per season. Five windows end inside the
# depth: Holy Names 2022 (dead host), Academy of Art 2022-2024 and Azusa
# Pacific 2022-2025 (hosts alive), plus the two movers.
#
# Source of truth: Pacific West Conference per-season records
# (thepacwest.com conference statistics per year 2021-2025, plus the live
# standings for 2026, whose records page answers "no statistics
# available"), verified 2026-09-05; the standings archive
# (standings.aspx?standings=163, 175, 183, 193, 202 for 2021-2025) agrees
# with the records everywhere. 11/11/14/13/10 members 2022-2026: Holy Names
# out after 2022, Westmont in from 2023, Menlo, Jessup and Vanguard in from
# 2024, Academy of Art out after 2024, Azusa Pacific, Fresno Pacific and
# Menlo out after 2025. Five members' records rows never link a teamstats
# page ('#': Azusa Pacific, Fresno Pacific, Academy of Art, Holy Names,
# Menlo); a parser keyed on school= misses them. Hosts, short forms and
# towns came from the member JSON embedded in the standings page (the 2026
# ten; mascots only for Biola, Chaminade and Concordia).
#
# Sites: the 14 live hosts probed 2026-09-05 (uv run probe --name):
# SideArm on every one (Westmont too: the batch plan's Mascot Media note
# is stale), schedule / roster / stats / matches present and the window
# seasons served; Academy of Art's site serves 2022-2024 and no later
# season, Westmont's, Jessup's, Vanguard's and Menlo's serve earlier NAIA
# seasons the windows exclude, Azusa Pacific's keeps publishing (Division
# III from 2026). One host is dead (Holy Names); see the comment above its
# stanza. The three Hawaii hosts are in UTC-10 with no daylight saving and
# print kickoff times inconsistently (Chaminade tags every row HST, Hilo
# tags rows PT under an HST note, Hawaii Pacific prints no zone): the
# collector's concern, a separate bead. No collect has run yet, so every
# stanza is data_status = unverified. No ordinals.
