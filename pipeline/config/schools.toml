# One table, no divisions, so no window carries one. Depth is 2026 only
# (the owner's ruling, no historical seasons), so every year-list is [2026].
# The women's standings archive ids (2026 192, 2025 183, 2024 144, 2023
# 143, 2022 142) differ from the men's ids in standings_archives.SAC; that
# map is keyed by conference only, so the women's ids are cited in the
# window sources, not added to it.
#
# The same eleven as the 2026 men's SAC: every stanza here shares its name,
# and so its slug, with the SAC men's stanza above; no new institution.
# Realignment traps, each read off a standings page: the 2025 standings
# (standings=183) list the same eleven. The 2024 standings (standings=144)
# list twelve: Limestone, absent from 2025 and 2026 (the college closed
# after 2024-25; its athletics host is dead), outside the depth, so no
# women's window or stanza. UVA Wise is a member (member JSON on the
# standings page) on no women's table and gets nothing. No renames, no D1
# departures at the edge, no provisional member on the table.
