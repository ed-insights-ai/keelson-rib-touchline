# ============================================================
# LSC WOMEN'S SOCCER - 15 programmes, authored depth 2026 only
# ============================================================
# Source of truth: the Lone Star Conference's own women's soccer pages, read
# 2026-11-08: the live standings
# (https://lonestarconference.org/standings.aspx?path=wsoc, "2026 Women's Soccer
# Standings") and the 2026 conference statistics
# (stats.aspx?path=wsoc&year=2026&conf=true). Both list the same fifteen
# programmes in one table with no divisions, so no window carries
# `division`. Depth is 2026 only (the owner's ruling for the women's
# onboarding): every window opens at 2026 as a depth decision, not an
# arrival claim, and every years list is [2026]. The 2025 women's records
# (year=2025) list the same fifteen, so nobody arrived or left across 2026.
#
# Not the men's set. The eleven LSC men's 2026 programmes all sponsor
# women's soccer and reuse their men's `name` here (one slug per school).
# Four more play women's soccer in the LSC: Eastern New Mexico (men's soccer
# discontinued December 2024) and UT Permian Basin (men's LSC 2022 only) reuse
# their historical men's stanzas' `name`, so their slugs already exist; Texas
# Woman's and Angelo State sponsor women's soccer only and are new to the
# rib. Texas Woman's mints `texas-womans` (name "Texas Womans", the
# apostrophe-free form the identity fold gives "Texas Woman's", the
# Saint Edwards precedent), display_name "Texas Woman's". Three full members
# on the member JSON sponsor no women's soccer at all and get no window or
# stanza: Cameron, Texas A&M-Kingsville and Western New Mexico (no wsoc in
# any of their sites' sport menus, read 2026-11-08). No movers at the edge,
# no provisional member, no rename, no same-named collision.
#
# Probe (uv run probe --conference LSC --seasons 2026 --name ..., 2026-11-08;
# hosts from the athletics_website fields of the member JSON embedded in the
# standings page): all 15 SideArm, schedule / roster / stats / matches
# present, 2026 served on every one. No PrestoSports host, no dead host, no
# 403 or 202. base_url is the host each site served after its redirect. No
# collect has run, so every stanza is data_status = unverified. No ordinals.
#
# Hand corrections: abbreviations are the men's stanzas' short forms (the
# probe drafted SE, SM, SRS, TD, TT, MWSU, WTAMU); the new schools carry
# their own scoreboard short forms (TWU, ASU), and ASU is display-only
# because Adams State carries it on the RMAC men's stanza and a women's RMAC
# stanza would claim it too. Mascots are the men's stanzas' (Lubbock
# Christian, Texas A&M International and West Texas A&M's women's
# descriptions print the short or spaced forms "Chaps", "Dust Devils",
# "Buffs"); Angelo State's women are the Rambelles (every 2026 recap on the
# schedule page; the description's "Rams" is the university's). The probe's
# aliases "MSU" (Midwestern State; it is the abbreviation) and "University
# of Texas" (UT Dallas; folds to the bare key "texas") are dropped. Peers'
# 2026 women's schedules print "DBU" (9 pages; the abbreviation resolves),
# "Dallas Baptist (University)", "Midwestern State University Texas"
# (St. Edward's, UTPB), "Texas Permian Basin" / "University of Texas Permian
# Basin", "University of Texas at Dallas", "University of Texas at Tyler" (5),
# "Texas Woman's (University)", "St. Mary's (TX)", "St. Edward's (Texas)",
# and each member's long name; every one resolves to its slug through the
# women's identity map with these stanzas loaded.

