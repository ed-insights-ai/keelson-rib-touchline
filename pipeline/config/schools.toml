# year and proves nothing. 12/12/12/11/13 members 2022-2026: Sonoma State
# and San Francisco State out after 2024, UC Merced in from 2025, Fresno
# Pacific and Menlo in from 2026; the count alone hides all five moves.
# Hosts, short forms and towns came from the member JSON embedded in the
