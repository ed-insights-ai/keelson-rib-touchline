# the 2024 (standings=180) and 2025 (standings=194) women's tables and
# absent from the 2026 standings and records; asugoldenrams.com's
# /sports/womens-soccer/schedule/2026 redirects to the 2025 schedule (no
# 2026 season published, read 2026-11-08). It gets no window. Middle
# Georgia State is absent from the 2024 table and first listed 2025,
# outside the depth. Young Harris's PBC women's seasons ended before the
# depth (it is a CC member). No renames.
#
# Probe (uv run probe --conference PBC --seasons 2026, 2026-11-08): all 10
# hosts SideArm, schedule / roster / stats / matches present, 2026 served
# on every one. Hosts from the athletics_website fields of the member JSON
