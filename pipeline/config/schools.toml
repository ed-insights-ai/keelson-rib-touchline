# ============================================================
# GLVC MEN'S SOCCER — 15 programmes, backfill window 2022-2026
# ============================================================
# Source of truth: GLVC per-season records (glvcsports.com conference
# statistics per year, plus the live standings for 2026), verified
# 2026-09-01. All 15 sites probed 2026-09-01 (uv run probe): SideArm-new,
# schedule / roster / stats / matches present on every one, every season in
# the window served (Lincoln's site serves 2023-2026; its window starts
# 2024). Truman's fingerprint carries only the sidearmsports asset evidence
# (no server-rendered schedule markup on the landing page) but all four
# layers probed present. No collect has run yet, so every stanza is
# data_status = unverified — promote once a collect confirms the layers
# end to end. No ordinals: the StatCrew legacy lineage never reads these.
#
# Season-aware membership lives in data/reference/membership.json —
# Upper Iowa joined 2023 and Lincoln (Mo.) 2024; nobody left inside the
# window. The realignment traps all fall before it: Bellarmine left for
# Division I in 2020, Lindenwood and Southern Indiana are in the 2021
# records and gone from 2022 (both to Division I), Southwest Baptist
# arrived from the MIAA in 2019. Every year-list here equals the window.
#
# Names are chosen so programme_slug(name) matches the membership key. The
# GAC archive already minted indianapolis, maryville, rockhurst, drury,
# william-jewell, mckendree, southwest-baptist, upper-iowa, quincy,
# illinois-springfield and lincoln from opponent text; it also carries a
# residual missouri-s-and-t (18 rows) beside the missouri-s-t this config
# mints, the same split the LSC accepted for texas-a-m-international.
# Aliases come from opponent spellings on member schedules (UIndy 2025,
# Lincoln 2025) — Illinois-Springfield, Missouri -St. Louis, Truman State.

