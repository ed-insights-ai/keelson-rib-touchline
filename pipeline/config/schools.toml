# ============================================================
# CCAA MEN'S SOCCER - 15 programmes, backfill window 2022-2026
# ============================================================
# 17 windows in the depth on 15 slugs: Fresno Pacific and Menlo each carry
# a PacWest window before their 2026 CCAA window (PacWest 2022-2025 and
# 2024-2025, the Young Harris shape), so two of the PacWest section's
# windows live on stanzas here and the collect resolves the conference per
# season. Sonoma State (2022-2024) and San Francisco State (2022-2024) end
# inside the depth with their hosts alive.
#
# Source of truth: California Collegiate Athletic Association per-season
# records (goccaa.org conference statistics per year 2021-2025, plus the
# live standings for 2026, whose records page carries no table yet),
# verified 2026-09-05; the standings archive (standings.aspx?standings=279,
# 288, 297, 308, 320 for 2021-2025) agrees with the records everywhere.
# goccaa.org is SideArm, not PrestoSports: the Presto-shaped path
# /sports/msoc/{Y}-{yy}/standings answers the same live page for every
# year and proves nothing. 12/12/12/11/13 members 2022-2026: Sonoma State
# and San Francisco State out after 2024, UC Merced in from 2025, Fresno
# Pacific and Menlo in from 2026; the count alone hides all five moves.
# Hosts, short forms and towns came from the member JSON embedded in the
# standings page (var component = {"type":"members"}), which lists San
# Francisco State (a member without men's soccer) and omits Sonoma State.
#
# Sites: all 15 hosts probed 2026-09-05 (uv run probe --name): SideArm on
# every one (every host in this batch is SideArm), schedule / roster /
# stats / matches present and the window seasons served; Sonoma State's
# and San Francisco State's sites serve 2022-2024 and no later season
# (the programmes ended), UC Merced's serves earlier NAIA seasons the
# window excludes. Six roots answer a splash page (humboldtathletics.com,
# broncoathletics.com, eastbaypioneers.com, menloathletics.com); the sport
# path is unaffected. No collect has run yet, so every stanza is
# data_status = unverified. No ordinals.
#
# Names are the records' spellings, chosen so programme_slug(name) matches
# the membership key; the data home already carries every one of them as
# an opponent slug except stanislaus-state and sonoma-state, and carries
# both cal-state-la and cal-state-los-angeles (the sweep is the alias
# round's, tl-clk.11). Abbreviations are the goccaa.org member JSON's
# short forms (HUM, CPP, CSUDH, CSUEB, CSULA, CSUMB, CSUSB, CSUSM, CHICO,
# FPU, MEN, SFSU, STAN, UCM; read 2026-09-05) and, for Sonoma State, which
# the JSON omits, its own scoreboard's SSU. FPU is also Franklin Pierce's
# and SSU Shawnee State's, so those two carry abbreviation_resolves =
# false. The probe misread three towns (Cal State East Bay "Dallas,
# Texas", Cal State LA "Kansas City, Mo.", Cal State San Marcos "Kansas
# City, Kan.": the away venue of the first 2026 fixture); each is corrected
# from the school's own page with the member JSON as the second source.
# Aliases cover the published long names, the CSU forms and the label
# variants peers print.

