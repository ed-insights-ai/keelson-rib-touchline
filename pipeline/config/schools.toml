identity_accessed = "2026-09-02"

# ============================================================
# GSC WOMEN'S SOCCER - 12 programmes, authored depth 2026 only
# ============================================================
# Source of truth: the Gulf South Conference's own women's soccer pages,
# read 2026-11-08: the live standings
# (https://gscsports.org/standings.aspx?path=wsoc, "2026 Women's Soccer Standings")
# and the 2026 conference statistics
# (stats.aspx?path=wsoc&year=2026&conf=true). Both list the same twelve
# programmes in one table with no divisions, so no window carries
# `division`. Depth is 2026 only (the owner's ruling for the women's
# onboarding): every window opens at 2026 as a depth decision, not an
# arrival claim, and every years list is [2026].
#
# Not quite the men's set: eleven of the twelve are the GSC men's 2026
# programmes, and every one of those stanzas' `name` is reused here so both
# genders share one slug (Mississippi College keeps its slug and its
# display_name "Mississippi Christian"). Valdosta State sponsors women's
# soccer only and is new to the rib (slug valdosta-state, no collision).
# Realignment traps, each read off a records page: West Florida is in the
# 2025 women's records (stats.aspx?path=wsoc&year=2025&conf=true) and absent
# from 2026; its 2026 schedule (goargos.com/sports/womens-soccer/schedule/2026)
# is an ASUN Division I slate, so it gets no women's window. Its men's GSC
# window already ends 2025. The GSC member JSON still lists it (13 entries).
# Shorter is on neither the 2025 nor the 2026 women's records. Nobody is
# provisional; no same-named collision (`union` and `lee` are the GSC men's
# slugs, and no women's stanza elsewhere claims either key).
#
# Probe (uv run probe --conference GSC --seasons 2026 --name ..., 2026-11-08;
# hosts from the athletics_website fields of the member JSON embedded in the
# standings page): all 12 SideArm, schedule / roster / stats / matches
# present, 2026 served on every one. No PrestoSports host, no dead host, no
# 403 or 202. base_url is the host each site served after its redirect (the
# member JSON prints www. for several that answer on the bare host). No
# collect has run, so every stanza is data_status = unverified. No ordinals.
#
# Hand corrections: abbreviations are the men's stanzas' short forms (the
# probe drafted DS and TN, and left Lee and Montevallo blank); Valdosta State
# carries VSU, its own scoreboard short form and the GSC member JSON
# abbreviation (the probe drafted VS). Mascots are the men's stanzas' (the
# women's schedule pages print the same: Christian Brothers' description
# prints the short "Bucs", Trevecca's prints none); recaps say "Lady Bucs",
# "Lady Statesmen", "Lady Choctaws", which are not separate nicknames on the
# sites' own descriptions. Aliases are the men's plus the published long
# names; peers' 2026 women's schedules print "Auburn University Montgomery"
# (5 pages) and "Auburn University at Montgomery" (3), "Mississippi Christian"
# (7) and "Mississippi Christian University" (5), "Mississippi College" (1,
# Christian Brothers), "Trevecca Nazarene (University)" (10), "University of
# West Alabama" (7), "University of Alabama in Huntsville" (Spring Hill),
# "Alabama-Huntsville" and "Auburn-Montgomery" (Embry-Riddle; Tampa), and
# "Lee University (Tenn.)", "Union University (Tenn.)", "Spring Hill College
# (Ala.)", whose parentheticals drop. Every one resolves to its slug through
# the women's identity map with these stanzas loaded.

[[schools]]
name         = "UAH"
abbreviation = "UAH"
conference   = "GSC"
mascot       = "Chargers"
gender       = "women"
base_url     = "https://uahchargers.com/sports/womens-soccer"
years        = [2026]
scraper      = "sidearm"
data_status  = "unverified"
enabled      = true
aliases      = ["University of Alabama in Huntsville", "Alabama-Huntsville"]
city         = "Huntsville, Ala."
city_source  = "schedule-page home venue location, https://uahchargers.com/sports/womens-soccer/schedule/2026"
identity_accessed = "2026-11-08"

