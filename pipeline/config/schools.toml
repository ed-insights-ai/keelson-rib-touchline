# ============================================================
# SSC WOMEN'S SOCCER - 11 programmes, authored depth 2026 only
# ============================================================
# Source of truth: the Sunshine State Conference's own women's soccer pages,
# read 2026-11-08: the live standings
# (https://sunshinestateconference.com/standings.aspx?path=wsoc, "2026 Women's
# Soccer Standings") and the 2026 conference statistics
# (stats.aspx?path=wsoc&year=2026&conf=true). Both list the same eleven
# programmes in one table with no divisions, so no window carries
# `division`. Depth is 2026 only (the owner's ruling for the women's
# onboarding): every window opens at 2026 as a depth decision, not an
# arrival claim, and every years list is [2026].
#
# The set equals the men's SSC 2026 set exactly, and the 2025 women's
# records (year=2025) list the same eleven, so nobody arrived or left across
# 2026. Every `name` here is the men's SSC stanza's own, so both genders
# share one slug; no women-only programme, no rename, no provisional
# member, no same-named collision. The member JSON on the standings page
# lists the same eleven.
#
# Probe (uv run probe --conference SSC --seasons 2026 --name ..., 2026-11-08;
# hosts from the athletics_website fields of the member JSON): ten SideArm
# hosts with schedule / roster / stats / matches present and 2026 served.
# Tampa (tampaspartans.com/sports/wsoc) answered the probe this time and the
# probe read PrestoSports off its markup (theme asset hosts, mirror host
# tampaspartans.prestosports.com), all four layers present and 2026 served
# (/sports/wsoc/2026-27/schedule). A paced curl pass the same day got one
# empty HTTP 202 (the CloudFront challenge) before a 200: a 202 from Tampa is
# the challenge, not a dead host. base_url is the host each site served after
# its redirect (several www. hosts now answer on the bare host). No collect
# has run, so every stanza is data_status = unverified. No ordinals.
#
# Hand corrections: abbreviations are the men's stanzas' short forms (the
# probe drafted EA, SFLO, LYNNU, NS and SL, and left Barry, Eckerd, Rollins
# and Tampa blank); BU and NSU stay display-only as on the men's side (BU is
# also Bloomsburg's on the PSAC women's stanza, NSU Northeastern State's on
# the MIAA women's). Mascots are the men's stanzas' (the probe found none for
# Florida Southern, Florida Tech, Lynn and Rollins). The probe's junk aliases
# ("#13" off Nova Southeastern's ranked title, "Florida Tech Panthers") are
# dropped. Peers' 2026 women's schedules print "Embry-Riddle University
# (Fla.)" / "Embry-Riddle (FL)" / "Embry-Riddle (Fla.)" (parenthetical
# drops), "University of Tampa" and "/ University of Tampa", and each
# member's long name; all resolve with the aliases below. Towns: Barry,
# Eckerd and Palm Beach Atlantic print no town on their home rows (Barry
# prints its 2026 off-campus venues, Eckerd and PBA print "Home"), so those
# three come from the member JSON; Tampa's PrestoSports rows print "Tampa,
# Fla.".

