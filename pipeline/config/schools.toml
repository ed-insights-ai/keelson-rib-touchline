# Sites: all 14 probed 2026-09-04 (uv run probe --name): SideArm on every
# one, schedule / roster / stats / matches present and 2022-2026 served
# (Ferrum's and Young Harris's earlier seasons belong to other
# conferences; see their stanzas). No collect has run yet, so every stanza
# is data_status = unverified. No ordinals.
