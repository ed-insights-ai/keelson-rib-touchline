[project]
name = "touchline-pipeline"
version = "0.1.0"
description = "Data collection pipeline for Ed Insights Platform"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "truststore>=0.10",
]

[project.scripts]
check-membership = "scripts.check_membership:main"
check-box-scores = "scripts.check_box_scores:main"
sweep-opponent-slugs = "scripts.sweep_opponent_slugs:main"
collect-board = "scripts.collect_board:main"
migrate-shard = "scripts.migrate_shard:main"
build-digest = "scripts.build_digest:main"
render-report = "scripts.render_report:main"
build-profile = "scripts.build_profile:main"
normalize-research = "scripts.normalize_research:main"
probe = "scripts.probe:main"
build-programmes = "scripts.build_programmes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
