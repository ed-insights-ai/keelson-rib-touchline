<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="fl-title">
  <title id="fl-title">Five layers in a row: collect, curate, analyze, interpret, render, with validate gates between interpret and render</title>
  <rect x="0" y="0" width="1000" height="240" fill="#ffffff"/>
  <defs>
    <marker id="fl-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6272"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="15" y="80" width="150" height="64" rx="10" fill="#1d3252"/>
    <text x="90" y="118" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="1.5">COLLECT</text>
    <text x="90" y="170" fill="#5a6272" font-size="13">code</text>

    <rect x="209" y="80" width="150" height="64" rx="10" fill="#1d3252"/>
    <text x="284" y="118" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="1.5">CURATE</text>
    <text x="284" y="170" fill="#5a6272" font-size="13">code</text>

    <rect x="403" y="80" width="150" height="64" rx="10" fill="#1d3252"/>
    <text x="478" y="118" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="1.5">ANALYZE</text>
    <text x="478" y="170" fill="#5a6272" font-size="13">code</text>

    <rect x="597" y="80" width="150" height="64" rx="10" fill="#b47c1e"/>
    <text x="672" y="118" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="1.5">INTERPRET</text>
    <text x="672" y="170" fill="#5a6272" font-size="13">model</text>

    <rect x="835" y="80" width="150" height="64" rx="10" fill="#1d3252"/>
    <text x="910" y="118" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="1.5">RENDER</text>
    <text x="910" y="170" fill="#5a6272" font-size="13">code</text>
  </g>
  <g stroke="#5a6272" stroke-width="2">
    <line x1="170" y1="112" x2="202" y2="112" marker-end="url(#fl-arrow)"/>
    <line x1="364" y1="112" x2="396" y2="112" marker-end="url(#fl-arrow)"/>
    <line x1="558" y1="112" x2="590" y2="112" marker-end="url(#fl-arrow)"/>
    <line x1="752" y1="112" x2="766" y2="112"/>
    <line x1="812" y1="112" x2="828" y2="112" marker-end="url(#fl-arrow)"/>
  </g>
  <g stroke="#1d3252" stroke-width="3" stroke-linecap="round">
    <line x1="776" y1="97" x2="776" y2="127"/>
    <line x1="789" y1="97" x2="789" y2="127"/>
    <line x1="802" y1="97" x2="802" y2="127"/>
  </g>
  <text x="789" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5a6272" text-anchor="middle">validate gates</text>
</svg>
