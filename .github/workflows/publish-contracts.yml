name: Publish contracts

# Copies contracts/ and samples/ into ed-insights-ai/touchline-contracts, the
# shared test data every reader (site, desk) builds against. This repo stays
# the source: a writer change, its fixture and its changelog land here in one
# commit, the nightly cadence checks data homes against contracts/ here, and
# this job makes touchline-contracts follow. Nothing is ever edited there by
# hand.
#
# Credentials: the touchline-publisher GitHub App (infra/GITHUB_APP.md), whose
# id and key live in the `production` environment. The App must be installed
# on touchline-contracts with Contents read and write. Until it is, the job
# says so and exits clean rather than failing every merge.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "samples/**"
      - ".github/workflows/publish-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-contracts
  cancel-in-progress: false

jobs:
  publish:
    name: Copy contracts and samples to touchline-contracts
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ID: ${{ secrets.TOUCHLINE_APP_ID }}
    steps:
      - name: Publisher App configured?
        id: configured
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::notice::TOUCHLINE_APP_ID is not set in the production environment; touchline-contracts was not updated (see infra/GITHUB_APP.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          path: rib
      - name: Token for touchline-contracts
        if: steps.configured.outputs.ok == 'true'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TOUCHLINE_APP_ID }}
          private-key: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY }}
          owner: ed-insights-ai
          repositories: touchline-contracts
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          repository: ed-insights-ai/touchline-contracts
          token: ${{ steps.token.outputs.token }}
          path: contracts-repo
      - name: Copy and push
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          rsync -a --delete rib/contracts/ contracts-repo/contracts/
          rsync -a --delete rib/samples/ contracts-repo/samples/
          cd contracts-repo
          python3 -I scripts/check.py
          git add -A contracts samples
          if git diff --cached --quiet; then
            echo "touchline-contracts already matches ${GITHUB_SHA::7}"
            exit 0
          fi
          git -c user.name="touchline-publisher[bot]" \
              -c user.email="touchline-publisher[bot]@users.noreply.github.com" \
              commit -q -m "Sync from keelson-rib-touchline ${GITHUB_SHA::7}" \
              -m "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push -q origin HEAD:main
          echo "touchline-contracts updated from ${GITHUB_SHA::7}"
