name: Probe pages (temporary)
# Thread scratch: run collect-board for a few programmes on a hosted runner
# and commit the temp homes back to this branch. Deleted before merge.
on:
  push:
    branches: [claude/project-thread-8gmfo2]
    paths: [.probe/collect.sh, .github/workflows/probe-pages.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project pipeline --frozen --no-dev
      - run: bash .probe/collect.sh
      - run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add .probe/collect
          git commit -m "probe: collected" && git push
