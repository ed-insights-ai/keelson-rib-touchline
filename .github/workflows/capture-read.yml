name: Read the D3 capture (temporary)
on:
  push:
    branches: [claude/project-thread-htvkce]
    paths: [.github/workflows/capture-read.yml]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences "/repos/${GITHUB_REPOSITORY}/actions/jobs/138876848423/logs" > log.txt
          grep -c 'CAPTURE ' log.txt || true
          sed -n 's/.*CAPTURE //p' log.txt > cap.jsonl
          python3 - <<'PY'
          import json, collections
          rows = [json.loads(l) for l in open("cap.jsonl")]
          print("records", len(rows), "errors", sum(1 for r in rows if "error" in r), "status", collections.Counter(r.get("status") for r in rows))
          for r in rows:
              if r["label"].startswith(("c2c-", "mascac-")):
                  print("STAND", json.dumps(r, ensure_ascii=False))
          bad = [r["label"] for r in rows if r.get("status") != 200]
          print("NOT200", bad)
          PY
