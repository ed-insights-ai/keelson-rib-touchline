name: Journal

# The AI journals, written in the cloud (site/journal/README.md). Until
# 2026-11-21 the Mac wrote them with `claude -p` and committed them to
# touchline-ui main; this does the same with Gemini 4 Neon on the Flex tier:
#
#   1. read the private data homes' main (the touchline-publisher App)
#   2. put touchline-ui main's journals into the pinned touchline-ui code
#   3. per build, write only the conferences collected since their journal,
#      then that build's national journal (site/journal/run.sh); the
#      validator drops every claim the data cannot back
#   4. sum the token use and estimated cost into the run summary
#   5. commit the journals to touchline-ui main, or, with commit off (a
#      trial), keep them as this run's artifact for review
#
# Publish site calls this before its site job when the repository variable
# TOUCHLINE_JOURNALS is `on`. Run it by hand for a trial:
#   gh workflow run journal.yml -f conferences=gac,psac -f commit=false
#
# Only main may run it: the App key and GEMINI_API_KEY live in `production`.

on:
  workflow_call:
    inputs:
      conferences:
        type: string
        default: ""
      divisions:
        type: string
        default: "d2 d1 d3"
      genders:
        type: string
        default: "men women"
      national:
        type: boolean
        default: true
      thinking:
        type: string
        default: ""
      commit:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      conferences:
        description: Conference keys to write whatever their stamps, comma-separated (empty writes the changed ones)
        type: string
        default: ""
      divisions:
        description: Divisions, space-separated
        type: string
        default: "d2 d1 d3"
      genders:
        description: Genders, space-separated
        type: string
        default: "men women"
      national:
        description: Also write each build's national journal
        type: boolean
        default: true
      thinking:
        description: Gemini thinking level
        type: choice
        options: [low, medium, high, xhigh]
        default: medium
      commit:
        description: Commit to touchline-ui main (off keeps them as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  journal:
    name: Write the journals
    runs-on: ubuntu-latest
    # A first run after a gap rewrites all 98 journals, and Flex can take
    # minutes per reply (the trial: 2 and 7).
    timeout-minutes: 240
    environment: production
    # One writer at a time: two runs would race on touchline-ui main.
    concurrency:
      group: journal
      cancel-in-progress: false
    env:
      JOURNAL_DIVISIONS: ${{ inputs.divisions || 'd2 d1 d3' }}
      JOURNAL_GENDERS: ${{ inputs.genders || 'men women' }}
      JOURNAL_ONLY: ${{ inputs.conferences || '' }}
      JOURNAL_NATIONAL: ${{ inputs.national == false && 'false' || 'true' }}
      JOURNAL_THINKING: ${{ inputs.thinking || vars.TOUCHLINE_JOURNAL_THINKING || 'medium' }}
      JOURNAL_MODEL: ${{ vars.TOUCHLINE_JOURNAL_MODEL || 'gemini-4-neon' }}
      JOURNAL_SERVICE_TIER: ${{ vars.TOUCHLINE_JOURNAL_TIER || 'flex' }}
      COMMIT: ${{ inputs.commit && 'true' || 'false' }}
    steps:
      - name: Main only, with a key
        env:
          KEY_SET: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Only main may read the private data homes."; exit 1
          fi
          if [ "$KEY_SET" != true ]; then
            echo "::error::GEMINI_API_KEY is not set in the production environment."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rib
          persist-credentials: false
      - name: Pinned touchline-ui
        id: ui
        run: echo "sha=$(tr -d '[:space:]' < rib/site/touchline-ui.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/touchline-ui
          ref: ${{ steps.ui.outputs.sha }}
          path: ui
          persist-credentials: false
      - name: Token for the data homes and touchline-ui
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.TOUCHLINE_APP_ID }}
          private-key: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY }}
          owner: ed-insights-ai
          repositories: d1-soccer,d2-soccer,d3-soccer,touchline-ui
      - name: Check out d2-soccer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/d2-soccer
          token: ${{ steps.app.outputs.token }}
          path: homes/d2-soccer
          persist-credentials: false
      - name: Check out d1-soccer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/d1-soccer
          token: ${{ steps.app.outputs.token }}
          path: homes/d1-soccer
          persist-credentials: false
      - name: Check out d3-soccer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/d3-soccer
          token: ${{ steps.app.outputs.token }}
          path: homes/d3-soccer
          persist-credentials: false
      - name: Check out touchline-ui main's journals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/touchline-ui
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: journals
          sparse-checkout: journal
          persist-credentials: false
      - name: Put main's journals into the pinned code
        run: |
          set -eu
          rm -rf ui/journal
          cp -R journals/journal ui/journal
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install touchline-ui
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Write the journals
        id: write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -u
          sh rib/site/journal/run.sh ui homes usage.jsonl || rc=$?
          echo "rc=${rc:-0}" >> "$GITHUB_OUTPUT"
      - name: Cost of this run
        # Only once the writer ran: a setup step that failed has no bun and no log.
        if: always() && steps.write.outcome != 'skipped'
        run: |
          set -eu
          [ -f usage.jsonl ] || : > usage.jsonl
          {
            echo "### Journal (${JOURNAL_MODEL}, ${JOURNAL_SERVICE_TIER}, thinking ${JOURNAL_THINKING})"
            echo
            bun rib/site/journal/usage.ts usage.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
          total=$(bun rib/site/journal/usage.ts usage.jsonl 2>&1 >/dev/null)
          echo "::notice title=Journal cost::$total"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: journal-usage
          path: usage.jsonl
          retention-days: 90
          if-no-files-found: ignore
      - name: Copy the written journals back
        if: always() && steps.write.outcome != 'skipped'
        run: |
          set -eu
          rm -rf journals/journal
          cp -R ui/journal journals/journal
          # A reply that did not parse is kept beside the journal for whoever
          # runs the writer by hand; it is not published.
          find journals/journal -name '*.rejected.txt' -print -delete
          git -C journals status --short -- journal | tee changed.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: env.COMMIT != 'true'
        with:
          name: journals
          path: journals/journal/
          retention-days: 7
      - name: Fresh token for the push
        id: push-app
        if: env.COMMIT == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.TOUCHLINE_APP_ID }}
          private-key: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY }}
          owner: ed-insights-ai
          repositories: touchline-ui
      - name: Commit to touchline-ui main
        if: env.COMMIT == 'true'
        env:
          TOKEN: ${{ steps.push-app.outputs.token }}
        run: |
          set -eu
          if [ ! -s changed.txt ]; then echo "No journal changed."; exit 0; fi
          bash rib/.github/scripts/git-auth.sh journals "$TOKEN"
          cd journals
          git config user.name "touchline-publisher[bot]"
          git config user.email "touchline-publisher[bot]@users.noreply.github.com"
          git add -A journal
          scopes=$(git diff --cached --name-only -- journal | sed -n 's|.*journal-[0-9]*-[a-z]*-\([a-z0-9-]*\)\.json$|\1|p' | sort -u | paste -sd' ' -)
          git commit -q -m "chore(journal): cloud run $(date -u +%Y-%m-%d) [$scopes]" -m "Written by ${JOURNAL_MODEL} (${JOURNAL_SERVICE_TIER}) in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push -q origin HEAD:main; then echo "pushed $(git rev-parse --short HEAD)"; exit 0; fi
            sleep $((attempt * 5))
            git pull -q --rebase origin main
          done
          echo "::error::could not push the journals to touchline-ui main"; exit 1
      - name: Fail when a journal failed
        env:
          RC: ${{ steps.write.outputs.rc }}
        run: |
          if [ "${RC:-1}" != 0 ]; then
            echo "::error::a conference or national journal failed; the ones that worked were kept. See the log."
            exit 1
          fi
