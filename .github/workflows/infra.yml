name: Infra

# Terraform for infra/main. Pull requests check formatting and validate both
# stacks with no cloud access. A merge to main that touches infra/main plans
# and applies it through the `infra` environment's OIDC role.
#
# infra/bootstrap is never applied here: it holds the role this workflow
# uses, so it changes only through Daniel's signed-in CLI (infra/RUNBOOK.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/main/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref: main applies queue behind each other, and a pull request run can
  # never take the pending slot of a main apply.
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  CHECKPOINT_DISABLE: "1"

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=infra fmt -recursive -check -diff
      - name: Validate bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate
      - name: Validate main
        run: |
          terraform -chdir=infra/main init -backend=false
          terraform -chdir=infra/main validate

  apply:
    name: Apply infra/main
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Check account id
        run: |
          case "$AWS_ACCOUNT_ID" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::Set the AWS_ACCOUNT_ID variable on the infra environment (12 digits)."; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/touchline-infra-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: touchline-infra-${{ github.run_id }}
      - name: Init
        run: terraform -chdir=infra/main init -backend-config="bucket=touchline-tfstate-${AWS_ACCOUNT_ID}" -backend-config="region=${AWS_REGION}"
      - name: Plan
        run: terraform -chdir=infra/main plan -out=tfplan -var="region=${AWS_REGION}"
      - name: Apply
        run: terraform -chdir=infra/main apply tfplan
