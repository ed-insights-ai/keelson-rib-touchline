name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rib:
    name: Rib (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned; docs.yml pins to the same release per the family's lockstep rule.
          bun-version: 1.3.13
      # test/membership-parity.test.ts runs the pipeline's resolver through
      # `uv run` to hold resolveConference to members_in_effect.
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the pipeline environment
        # Built here so the parity test's first `uv run` does not spend its
        # 30s test timeout creating the venv on a cold runner.
        run: uv sync --project pipeline --frozen
      - name: Lint
        run: bun run check
      - name: Lint shell scripts
        # bin/*.sh run under /bin/sh (launchd on the machine, keelson bash
        # nodes); shellcheck in sh mode keeps them POSIX. ubuntu-latest ships
        # shellcheck; the apt fallback covers an image that drops it.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | head -2
          bun run check:sh
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  pipeline:
    name: Pipeline (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect pipeline
        id: pipeline
        run: |
          if [ -f pipeline/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.pipeline.outputs.exists == 'true'
      - name: Lint
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: uv run ruff check .
      - name: Format
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: uv run ruff format --check .
      - name: Test
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: uv run pytest -q
      - name: Sample data homes within the contracts
        # The real data homes are private and never reach CI; the samples
        # under samples/ are byte-identical cuts of them. A fixture change
        # that the real data no longer fits fails here, not on the next
        # daily run. No samples yet (or none left), nothing to check.
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: |
          set -- ../samples/*/data
          if [ ! -d "$1" ]; then echo "no sample data homes under samples/"; exit 0; fi
          homes=""
          for d in "$@"; do homes="$homes ${d%/data}"; done
          # shellcheck disable=SC2086
          uv run check-contracts $homes
      - name: Sample data homes at parity with themselves
        # Runs the parity check end to end on real-shaped data: every record
        # of each sample must match itself. tests/test_parity.py covers the
        # timing and disagreement rules on edited copies of the same samples.
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: |
          set -- ../samples/*/data
          if [ ! -d "$1" ]; then echo "no sample data homes under samples/"; exit 0; fi
          for d in "$@"; do
            home="${d%/data}"
            uv run check-parity "$home" "$home" --compare-inherited --require-complete --summary "$GITHUB_STEP_SUMMARY" --json /dev/null
          done
      - name: Await pipeline extraction
        if: steps.pipeline.outputs.exists != 'true'
        run: echo "No pipeline/pyproject.toml yet - pipeline CI is a no-op until the extraction lands."
