name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rib:
    name: Rib (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  pipeline:
    name: Pipeline (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect pipeline
        id: pipeline
        run: |
          if [ -f pipeline/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.pipeline.outputs.exists == 'true'
      - name: Lint
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: uv run ruff check .
      - name: Test
        if: steps.pipeline.outputs.exists == 'true'
        working-directory: pipeline
        run: uv run pytest -q
      - name: Await pipeline extraction
        if: steps.pipeline.outputs.exists != 'true'
        run: echo "No pipeline/pyproject.toml yet - pipeline CI is a no-op until the extraction lands."
