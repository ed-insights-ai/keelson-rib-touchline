name: D3 discovery (temporary)

# Temporary, branch only: builds data/reference/programmes.json for the
# Division III stanzas with the full Census Gazetteer (which the authoring
# container cannot reach) and commits the result to this branch. Removed
# before merge.
on:
  push:
    branches: [claude/project-thread-htvkce]
    paths: [.github/workflows/d3-discover.yml, pipeline/config/schools.toml, spikes/d3/gaz_lookup.py]

permissions:
  contents: write

concurrency:
  group: d3-discover
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build the programmes reference
        working-directory: pipeline
        run: |
          mkdir -p ../spikes/d3/out
          uv sync --frozen --no-dev
          export TOUCHLINE_GAZETTEER_FILE="$RUNNER_TEMP/places.txt" TOUCHLINE_GAZETTEER_COUSUBS_FILE="$RUNNER_TEMP/cousubs.txt"
          uv run --frozen --no-dev build-programmes 2>&1 | tee ../spikes/d3/out/build-programmes.log || true
          ls -la "$RUNNER_TEMP"
          python3 -I ../spikes/d3/gaz_lookup.py "$RUNNER_TEMP/places.txt" "$RUNNER_TEMP/cousubs.txt" > ../spikes/d3/out/gaz-lookup.txt 2>&1 || true
      - name: Commit the results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add spikes/d3/out data/reference pipeline/data/gazetteer
          git commit -m "spike(d3): programmes build [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
