name: D3 discovery (temporary)

# Temporary, branch only: fetches the short URL list in spikes/d3/urls.txt and
# commits what came back to this branch. Removed before merge.
on:
  push:
    branches: [claude/project-thread-htvkce]
    paths: [spikes/d3/urls.txt, spikes/d3/fetch.py, .github/workflows/d3-discover.yml]

permissions:
  contents: write

concurrency:
  group: d3-discover
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I spikes/d3/fetch.py
      - name: Commit the results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add spikes/d3/out
          git commit -m "spike(d3): discovery results [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
