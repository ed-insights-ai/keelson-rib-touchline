name: Publish site

# The publish workflow (plan steps "Build", "Site" and "Release"):
#
#   bundle    hold the data homes to the contracts and cut the site bundle
#             (season JSON) the site reads
#   snapshot  build the desk's dataset (touchline.duckdb format 1, deltas and
#             manifest) from the same homes at the same commits with
#             touchline-desk's packages/data at the commit in
#             snapshot/touchline-desk.sha, sign it with the KMS key, verify it
#             through the desk's own fetch, and upload it, all but latest.json
#             (snapshot/README.md)
#   site      build touchline-ui at the pinned commit in site/touchline-ui.sha
#             from the bundle, upload only the files whose content changed to
#             the site bucket, invalidate CloudFront, and ask the live site for
#             real status codes
#   release   only when the live smoke check passed: move each snapshot scope's
#             latest.json with a conditional write, so the desk never sees a
#             snapshot the live site does not show
#
# The site job needs the snapshot job, so a dataset that does not build,
# sign and verify also keeps the site as it was. It runs beside gh-pages;
# nothing redirects here yet.
#
# Source of the data:
#   samples  the sample homes under samples/ (the site then shows GAC and A10;
#            always what pull requests build)
#   data     the default on main: the private d1-soccer and d2-soccer homes at their main, read with
#            the touchline-publisher App (infra/GITHUB_APP.md); journals come
#            from touchline-ui main, where the Mac commits them
# A run takes the `source` input unless it is `default`, else the repo
# variable SITE_SOURCE, else data.
#
# Pull requests build and gate the sample site and deploy nothing. Their
# snapshot job cannot read the private touchline-desk (the publisher App's key
# is in `production`, which only main may use), so it says so and the snapshot
# is built and verified on main. Only main, through `production`, can assume
# touchline-publish-site and touchline-publish or use the signing key. A run
# on any other branch signs with a throwaway key and uploads nothing.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "default (the SITE_SOURCE variable, else data), samples or data"
        type: choice
        options: [default, samples, data]
        default: default
      allow_mass_delete:
        description: "Allow a deploy that deletes over a quarter of the live site"
        type: boolean
        default: false
      allow_shrink:
        description: "Why the dataset may lose rows this time (empty: a loss stops the run)"
        type: string
        default: ""
  workflow_call:
    inputs:
      source:
        type: string
        default: ""
      allow_mass_delete:
        type: boolean
        default: false
      allow_shrink:
        type: string
        default: ""
  # Daily: after each scheduled Collect run on main, while the season runs
  # (TOUCHLINE_COLLECT_UNTIL, the same variable Collect stops on; see the
  # `when` job). Collect writes only to the homes' `shadow` branch; this
  # builds from their main, the Mac's production data, and writes to neither.
  workflow_run:
    workflows: [Collect]
    types: [completed]
    branches: [main]
  # A merge that changes the site's code (the pin, the scripts, this file)
  # deploys it, from SITE_SOURCE (data unless that variable says samples).
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/scripts/cut_bundle.py"
      - "snapshot/**"
      - ".github/workflows/publish-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "samples/**"
      - "contracts/**"
      - "pipeline/scripts/cut_bundle.py"
      - "snapshot/**"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: read

concurrency:
  # One deploy at a time; pull request builds run per branch beside it.
  group: ${{ github.event_name == 'pull_request' && format('publish-site-{0}', github.ref) || 'publish-site-deploy' }}
  cancel-in-progress: false

env:
  # Pull requests always build the samples, whatever the default.
  SOURCE: ${{ github.event_name == 'pull_request' && 'samples' || (inputs.source != '' && inputs.source != 'default') && inputs.source || vars.SITE_SOURCE || 'data' }}
  # The one division list: site builds and snapshot scopes both come from it.
  # Root division first (infra/main site_root_division). Add d3 here once the
  # d3-soccer home exists (infra/main already lists it).
  DIVISIONS: d2 d1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '822013580129' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # Terraform outputs site_bucket, site_distribution_id, site_url (infra/main).
  SITE_BUCKET: ${{ vars.SITE_BUCKET || 'touchline-site-822013580129' }}
  SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID || 'E2OD2GJ3B1JTOK' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://dn1yvpcd2depb.cloudfront.net' }}
  # Terraform outputs data_bucket and signing_key_alias (infra/main).
  DATA_BUCKET: ${{ vars.DATA_BUCKET || 'touchline-data-822013580129' }}
  SIGNING_KEY: alias/touchline-snapshot-signing

jobs:
  when:
    name: Is this run due
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - name: Due
        id: due
        env:
          EVENT: ${{ github.event_name }}
          COLLECT_EVENT: ${{ github.event.workflow_run.event }}
          COLLECT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UNTIL: ${{ vars.TOUCHLINE_COLLECT_UNTIL }}
        run: |
          go=true
          if [ "$EVENT" = workflow_run ]; then
            today=$(date -u +%Y-%m-%d)
            if [ "$COLLECT_EVENT" != schedule ]; then
              go=false; why="the Collect run was a $COLLECT_EVENT run, not the daily one"
            elif [ "$COLLECT_CONCLUSION" = cancelled ]; then
              go=false; why="the Collect run was cancelled"
            elif [ -z "$UNTIL" ]; then
              go=false; why="TOUCHLINE_COLLECT_UNTIL is not set"
            elif [ "$today" \> "$UNTIL" ]; then
              go=false; why="today ($today) is after TOUCHLINE_COLLECT_UNTIL ($UNTIL)"
            else
              why="daily run after Collect ($COLLECT_CONCLUSION; the site reads the homes' main, not shadow)"
            fi
          else
            why="$EVENT run"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Publish: $go: $why" | tee -a "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Check contracts and cut the bundle
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The App's secrets live in production; samples need no environment.
    environment: ${{ github.event_name != 'pull_request' && ((inputs.source != '' && inputs.source != 'default') && inputs.source || vars.SITE_SOURCE || 'data') == 'data' && 'production' || '' }}
    outputs:
      sources: ${{ steps.cut.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rib
      - uses: astral-sh/setup-uv@v5
      - name: Source
        run: |
          case "$SOURCE" in
            samples) ;;
            data)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::Only main may read the private data homes."; exit 1
              fi ;;
            *) echo "::error::source is samples or data, not '$SOURCE'"; exit 1 ;;
          esac
          echo "Publishing the site from: $SOURCE"
      - name: Token for the data homes
        if: env.SOURCE == 'data'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          # A variable per infra/GITHUB_APP.md; a secret of the same name also works.
          app-id: ${{ vars.TOUCHLINE_APP_ID || secrets.TOUCHLINE_APP_ID }}
          private-key: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY }}
          owner: ed-insights-ai
          repositories: d1-soccer,d2-soccer
      - name: Check out d2-soccer
        if: env.SOURCE == 'data'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/d2-soccer
          token: ${{ steps.token.outputs.token }}
          path: homes/d2-soccer
      - name: Check out d1-soccer
        if: env.SOURCE == 'data'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/d1-soccer
          token: ${{ steps.token.outputs.token }}
          path: homes/d1-soccer
      - name: Sample homes
        if: env.SOURCE == 'samples'
        run: |
          mkdir homes
          for d in $DIVISIONS; do ln -s "$PWD/rib/samples/$d-soccer" "homes/$d-soccer"; done
      - name: Homes within the contracts
        working-directory: rib/pipeline
        run: |
          homes=""
          for d in $DIVISIONS; do homes="$homes $GITHUB_WORKSPACE/homes/$d-soccer"; done
          # shellcheck disable=SC2086
          uv run check-contracts $homes
      - name: Cut the site bundle
        id: cut
        working-directory: rib/pipeline
        run: |
          set -eu
          sources=""
          for d in $DIVISIONS; do
            home="$GITHUB_WORKSPACE/homes/$d-soccer"
            if [ "$SOURCE" = data ]; then sha=$(git -C "$home" rev-parse HEAD); else sha="samples@$(git -C .. rev-parse HEAD)"; fi
            uv run python -m scripts.cut_bundle --home "$home" --source-sha "$sha" --out "$GITHUB_WORKSPACE/bundle/$d-soccer"
            sources="$sources $d-soccer=$sha"
          done
          echo "sources=${sources# }" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site-bundle
          path: bundle/
          retention-days: 7

  snapshot:
    name: Build, sign and verify the dataset snapshot
    needs: bundle
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      SOURCES: ${{ needs.bundle.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rib
      - name: Pins
        id: pins
        run: |
          set -eu
          sha=$(tr -d '[:space:]' < rib/snapshot/touchline-desk.sha)
          case "$sha" in *[!0-9a-f]* | "") echo "::error::snapshot/touchline-desk.sha is not a commit"; exit 1 ;; esac
          [ ${#sha} -eq 40 ] || { echo "::error::snapshot/touchline-desk.sha is not a full commit"; exit 1; }
          echo "desk=$sha" >> "$GITHUB_OUTPUT"
          grep -E '^(NODE_API|ENGINE)=[0-9A-Za-z.-]+$' rib/snapshot/duckdb.env | sed 's/^NODE_API=/node_api=/; s/^ENGINE=/engine=/' >> "$GITHUB_OUTPUT"
      - name: Can this run read touchline-desk?
        id: access
        env:
          HAS_KEY: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY" = true ]; then
            echo "::error::TOUCHLINE_APP_PRIVATE_KEY is not set in production; the snapshot needs it to read touchline-desk."; exit 1
          fi
          echo "::notice::The snapshot was not built: this run cannot read the private touchline-desk (the publisher App's key is in production, main only). It is built, signed and verified on main."
      - name: Token for touchline-desk and the data homes
        if: steps.access.outputs.ok == 'true'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TOUCHLINE_APP_ID || secrets.TOUCHLINE_APP_ID }}
          private-key: ${{ secrets.TOUCHLINE_APP_PRIVATE_KEY }}
          owner: ed-insights-ai
          repositories: ${{ env.SOURCE == 'data' && 'touchline-desk,d1-soccer,d2-soccer' || 'touchline-desk' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.access.outputs.ok == 'true'
        with:
          repository: ed-insights-ai/touchline-desk
          ref: ${{ steps.pins.outputs.desk }}
          token: ${{ steps.token.outputs.token }}
          path: desk
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.access.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install the desk's packages/data only
        if: steps.access.outputs.ok == 'true'
        working-directory: desk
        env:
          NODE_API: ${{ steps.pins.outputs.node_api }}
        run: |
          set -eu
          pinned=$(jq -r '.dependencies["@duckdb/node-api"]' packages/data/package.json)
          if [ "$pinned" != "$NODE_API" ]; then
            echo "::error::the desk pins @duckdb/node-api $pinned, snapshot/duckdb.env says $NODE_API"; exit 1
          fi
          # Until the desk's lockfile names the public registry, fetch the same
          # tarballs from it; the lockfile's integrity hashes still check them.
          sed -i 's#https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/#https://registry.npmjs.org/#g' pnpm-lock.yaml
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter "@touchline/data..."
          pnpm exec tsc -b packages/data
      - uses: astral-sh/setup-uv@v5
        if: steps.access.outputs.ok == 'true'
      - name: Homes at the bundle's commits
        if: steps.access.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -eu
          mkdir homes
          for d in $DIVISIONS; do
            if [ "$SOURCE" = samples ]; then ln -s "$PWD/rib/samples/$d-soccer" "homes/$d-soccer"; continue; fi
            sha=""
            for pair in $SOURCES; do
              case "$pair" in "$d-soccer="*) sha=${pair#*=} ;; esac
            done
            case "$sha" in *[!0-9a-f]* | "") echo "::error::the bundle reported no commit for $d-soccer"; exit 1 ;; esac
            git init -q "homes/$d-soccer"
            git -C "homes/$d-soccer" -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
              fetch -q --depth 1 "https://github.com/ed-insights-ai/$d-soccer" "$sha"
            git -C "homes/$d-soccer" checkout -q FETCH_HEAD
          done
      - name: Homes within the contracts
        if: steps.access.outputs.ok == 'true'
        working-directory: rib/pipeline
        run: |
          homes=""
          for d in $DIVISIONS; do homes="$homes $GITHUB_WORKSPACE/homes/$d-soccer"; done
          # shellcheck disable=SC2086
          uv run check-contracts $homes
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.access.outputs.ok == 'true' && env.DEPLOY == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/touchline-publish
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: touchline-snapshot-${{ github.run_id }}
      - name: Signing key
        if: steps.access.outputs.ok == 'true'
        id: key
        run: |
          set -eu
          mkdir -p keys
          if [ "$DEPLOY" = true ]; then
            aws kms get-public-key --key-id "$SIGNING_KEY" --query PublicKey --output text |
              base64 -d | openssl pkey -pubin -inform DER -outform PEM > keys/public.pem
            if [ -f rib/snapshot/signing-public-key.pem ] &&
              ! cmp -s <(openssl pkey -pubin -in rib/snapshot/signing-public-key.pem -outform DER) \
                       <(openssl pkey -pubin -in keys/public.pem -outform DER); then
              echo "::error::$SIGNING_KEY is not the key in snapshot/signing-public-key.pem"; exit 1
            fi
            echo "sign=kms:$SIGNING_KEY" >> "$GITHUB_OUTPUT"
            {
              echo "### Signing key"
              echo "KMS \`$SIGNING_KEY\`, ECDSA P-256. Public key (the desk's \`SNAPSHOT_PUBLIC_KEY\`):"
              echo '```'; cat keys/public.pem; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Not main: a throwaway key, so the whole path is exercised and
            # nothing this run signs could be trusted by an app.
            node desk/packages/data/dist/cli.js keygen "$RUNNER_TEMP/throwaway" > /dev/null
            cp "$RUNNER_TEMP/throwaway.pub" keys/public.pem
            echo "sign=key:$RUNNER_TEMP/throwaway.key" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, sign, verify and upload
        if: steps.access.outputs.ok == 'true'
        shell: bash
        env:
          DESK_CLI: ${{ github.workspace }}/desk/packages/data/dist/cli.js
          HOMES_DIR: ${{ github.workspace }}/homes
          WORK: ${{ github.workspace }}/work
          SIGN: ${{ steps.key.outputs.sign }}
          PUBLIC_KEY: ${{ github.workspace }}/keys/public.pem
          ENGINE: ${{ steps.pins.outputs.engine }}
          DESK_SHA: ${{ steps.pins.outputs.desk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          set -eu
          export PROVENANCE="$SOURCES"
          if [ "$DEPLOY" = true ]; then
            BUCKET="$DATA_BUCKET" sh rib/snapshot/build.sh
          else
            # No bucket: publish twice locally, so the second snapshot is
            # also checked by delta from the first.
            sh rib/snapshot/build.sh
            sh rib/snapshot/build.sh
          fi
          { echo "### Snapshot ($SOURCE)"; echo; cat work/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.access.outputs.ok == 'true' && env.DEPLOY == 'true'
        with:
          name: snapshot-release
          path: work/release/*.latest.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.access.outputs.ok == 'true' && env.DEPLOY == 'true'
        with:
          # ETags travel beside latest.json; both are small and carry no data.
          name: snapshot-release-etags
          path: work/release/*.etag
          retention-days: 7

  site:
    name: Build, deploy and smoke-check the site
    needs: [bundle, snapshot]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      # The release gate: "true" only when this run deployed and every build's
      # live smoke check passed. A later release job (move latest.json) needs
      # this job and checks needs.site.outputs.smoke_passed == 'true'.
      smoke_passed: ${{ steps.smoke.outputs.passed || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rib
      - name: Pinned touchline-ui
        id: ui
        run: echo "sha=$(tr -d '[:space:]' < rib/site/touchline-ui.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/touchline-ui
          ref: ${{ steps.ui.outputs.sha }}
          path: ui
      - name: Today's journals
        # Journals are data the Mac commits to touchline-ui main daily; the
        # code stays pinned. The sample site uses the pinned commit's own.
        if: env.SOURCE == 'data'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ed-insights-ai/touchline-ui
          ref: main
          path: journals
          sparse-checkout: journal
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install touchline-ui
        working-directory: ui
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-bundle
          path: bundle
      - name: Build and gate every build
        run: |
          if [ "$SOURCE" = data ]; then export TOUCHLINE_JOURNAL_DIR="$PWD/journals/journal"; fi
          TOUCHLINE_CONTRACTS_DIR="$PWD/rib/contracts" SITE_DIVISIONS="$DIVISIONS" \
            sh rib/site/build.sh ui bundle "$SITE_URL" smoke.tsv
          {
            echo "### Site build"
            echo "- source: \`$SOURCE\` (${{ needs.bundle.outputs.sources }})"
            echo "- touchline-ui: \`${{ steps.ui.outputs.sha }}\`"
            echo "- $(find ui/dist -type f | wc -l) files, $(du -sh ui/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v5
        if: env.DEPLOY == 'true'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.DEPLOY == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/touchline-publish-site
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: touchline-site-${{ github.run_id }}
      - name: Upload changed files
        if: env.DEPLOY == 'true'
        id: sync
        run: |
          set -eu
          mass=""
          if [ "${{ inputs.allow_mass_delete }}" = true ]; then mass="--allow-mass-delete"; fi
          # shellcheck disable=SC2086
          uv run rib/site/sync.py --dist ui/dist --bucket "$SITE_BUCKET" --changed-out changed.txt $mass | tee sync.json
          summary=$(tail -n1 sync.json)
          echo "changed=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "- sync: \`$summary\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Invalidate CloudFront
        # One wildcard path is one billed path (1,000 a month are free), and
        # pages already expire in five minutes; this makes a deploy show now.
        if: env.DEPLOY == 'true' && steps.sync.outputs.changed != '0'
        run: |
          set -eu
          id=$(aws cloudfront create-invalidation --distribution-id "$SITE_DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$SITE_DISTRIBUTION_ID" --id "$id"
      - name: Smoke-check the live site
        id: smoke
        if: env.DEPLOY == 'true'
        working-directory: ui
        run: |
          set -eu
          status=0
          if [ ! -s ../smoke.tsv ]; then echo "::error::no builds to smoke-check (smoke.tsv is empty)"; exit 1; fi
          while IFS="$(printf '\t')" read -r path stamp pages; do
            url="$SITE_URL${path%/}/"
            echo "→ $url"
            bun scripts/deployed.ts "$url" "$stamp" "$pages" || status=1
          done < ../smoke.tsv
          echo "- live: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi
          exit $status

  release:
    name: Move latest.json to the new snapshot
    needs: [snapshot, site]
    # Only once the live site shows this run's data.
    if: needs.site.outputs.smoke_passed == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rib
          sparse-checkout: snapshot
      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-release*
          merge-multiple: true
          path: release
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/touchline-publish
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: touchline-release-${{ github.run_id }}
      - name: Conditional write of each scope's latest.json
        env:
          BUCKET: ${{ env.DATA_BUCKET }}
          RELEASE: ${{ github.workspace }}/release
        shell: bash
        run: |
          set -euo pipefail
          sh rib/snapshot/release.sh | tee released.txt
          { echo "### Released ($SOURCE)"; sed 's/^/- /' released.txt; } >> "$GITHUB_STEP_SUMMARY"
